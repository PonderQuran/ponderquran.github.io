<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14101a">
<title>Mirān</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&family=Amiri+Quran&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap');

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: #14101a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}
#orbit-mount { width: 100vw; height: 100vh; height: 100dvh; }

.v-root {
  font-family: 'Inter Tight', system-ui, sans-serif;
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  color: var(--ink);
  background: var(--bg);
  user-select: none;
  -webkit-font-smoothing: antialiased;
  transition: background 1200ms ease;
}
.v-root * { box-sizing: border-box; }
.v-root::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 20;
}
.arabic-font {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
}
.serif { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; }
button {
  font: inherit; color: inherit;
  background: none; border: none;
  cursor: pointer; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
input, textarea { font-family: inherit; }

@keyframes v-fade-rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes v-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes v-spin-cw  { to { transform: rotate(360deg); } }
@keyframes v-spin-ccw { to { transform: rotate(-360deg); } }
@keyframes v-heartbeat {
  0%, 70%, 100% { transform: scale(1); }
  14% { transform: scale(1.022); }
  28% { transform: scale(1); }
  42% { transform: scale(1.014); }
}
@keyframes v-glow-pulse {
  0%, 100% { text-shadow: 0 0 18px color-mix(in oklab, var(--accent) 8%, transparent); }
  50%      { text-shadow: 0 0 36px color-mix(in oklab, var(--accent) 32%, transparent),
                          0 0 72px color-mix(in oklab, var(--accent) 14%, transparent); }
}
@keyframes v-translation-pulse {
  0%, 100% { opacity: 0.85; }
  50%      { opacity: 1; }
}
@keyframes v-center-pulse {
  0%, 100% {
    box-shadow:
      0 0 0 0 color-mix(in oklab, var(--accent) 24%, transparent),
      0 0 30px color-mix(in oklab, var(--accent) 12%, transparent);
  }
  50% {
    box-shadow:
      0 0 0 14px color-mix(in oklab, var(--accent) 0%, transparent),
      0 0 60px color-mix(in oklab, var(--accent) 28%, transparent);
  }
}
@keyframes v-aura-breathe {
  0%, 100% { opacity: 0.5; transform: scale(0.94); }
  50%      { opacity: 1;   transform: scale(1.06); }
}
@keyframes v-slide-up {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes v-slide-up-md {
  from { transform: translate(-50%, 40px); opacity: 0; }
  to   { transform: translate(-50%, 0);    opacity: 1; }
}
@keyframes v-step-in {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes v-plasma-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-40px, -30px) scale(1.1); }
}
@keyframes v-plasma-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(50px, -40px) scale(1.15); }
}
@keyframes v-plasma-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-20px, 50px) scale(0.95); }
}
@keyframes v-toast-in {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes v-toast-out {
  from { opacity: 1; transform: translate(-50%, 0); }
  to   { opacity: 0; transform: translate(-50%, -8px); }
}
@keyframes v-twinkle {
  0%, 100% { opacity: var(--star-lo, 0.2); }
  50%      { opacity: var(--star-hi, 0.8); }
}
@keyframes v-luminous-twinkle {
  0%, 100% { opacity: var(--star-lo, 0.4); transform: scale(1); }
  50%      { opacity: var(--star-hi, 1);  transform: scale(1.15); }
}
.fade-in { animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both; }

.orbit-root {
  background:
    radial-gradient(ellipse at center top, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 50%),
    radial-gradient(ellipse at center bottom, var(--bg-soft) 0%, var(--bg) 70%),
    var(--bg);
}

/* Stars — wider variety; some big & luminous */
.orbit-backdrop {
  position: absolute; inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.orbit-backdrop span {
  position: absolute;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 4px color-mix(in oklab, var(--accent) 60%, transparent);
  animation: v-twinkle var(--star-dur, 6s) ease-in-out infinite;
}
.orbit-backdrop span[data-lum="1"] {
  background: color-mix(in oklab, var(--ink) 80%, var(--accent));
  box-shadow:
    0 0 6px color-mix(in oklab, var(--accent) 80%, transparent),
    0 0 14px color-mix(in oklab, var(--accent) 40%, transparent);
  animation: v-luminous-twinkle var(--star-dur, 6s) ease-in-out infinite;
}
.v-root[data-theme="space"] .orbit-backdrop span {
  background: #fff;
  box-shadow: 0 0 6px color-mix(in oklab, var(--accent) 70%, transparent);
}
.v-root[data-theme="space"] .orbit-backdrop span[data-lum="1"] {
  background: #fff;
  box-shadow:
    0 0 10px #cfe0ff,
    0 0 22px color-mix(in oklab, var(--accent) 70%, transparent),
    0 0 40px color-mix(in oklab, var(--accent) 30%, transparent);
}

.orbit-glow {
  position: absolute;
  inset: 10% 10%;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 60%);
  pointer-events: none;
}

.plasma-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1500ms ease;
  overflow: hidden;
}
.v-root[data-theme="space"] .plasma-layer { opacity: 1; }
.plasma-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  will-change: transform;
}
.plasma-blob.a {
  width: 60%; height: 60%;
  top: -10%; left: -10%;
  background: radial-gradient(circle, color-mix(in oklab, #6a90ff 30%, transparent) 0%, transparent 65%);
  animation: v-plasma-a 90s ease-in-out infinite;
}
.plasma-blob.b {
  width: 70%; height: 70%;
  bottom: -15%; right: -15%;
  background: radial-gradient(circle, color-mix(in oklab, #8a5fc9 27%, transparent) 0%, transparent 65%);
  animation: v-plasma-b 120s ease-in-out infinite;
}
.plasma-blob.c {
  width: 50%; height: 50%;
  bottom: 10%; left: 30%;
  background: radial-gradient(circle, color-mix(in oklab, #3aa9d6 22%, transparent) 0%, transparent 65%);
  animation: v-plasma-c 150s ease-in-out infinite;
}

/* Stage — minimal in v3: just centers content. No rings, no markers in home. */
.orbit-stage {
  position: absolute; inset: 0;
  display: flex;
  align-items: center; justify-content: center;
  transition: filter 800ms cubic-bezier(0.22, 1, 0.36, 1),
              opacity 800ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
}
.v-root[data-fullscreen="true"] .orbit-stage {
  filter: blur(28px);
  opacity: 0.22;
  transform: scale(1.08);
  pointer-events: none;
}
.v-root[data-fullscreen="true"] .orbit-themes {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 12px);
  transition: opacity 400ms ease, transform 500ms ease;
}

/* Center hub */
.center-hub {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding: 0 24px;
}
.center-aura {
  position: absolute;
  top: 50%; left: 50%;
  width: 240px; height: 240px;
  margin-top: -120px;
  margin-left: -120px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 14%, transparent) 0%, transparent 65%);
  animation: v-aura-breathe 4.8s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}
/* The aura sits behind the button, not behind the pills */
.center-hub-button-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.center-button {
  position: relative;
  width: 168px; height: 168px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent);
  background:
    radial-gradient(circle at 30% 25%, color-mix(in oklab, var(--accent) 14%, var(--bg)) 0%, color-mix(in oklab, var(--bg) 92%, var(--accent)) 65%, color-mix(in oklab, var(--bg) 98%, var(--accent)) 100%);
  display: flex;
  align-items: center; justify-content: center;
  color: var(--ink);
  cursor: pointer;
  animation: v-center-pulse 3.6s ease-in-out infinite;
  transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1), border-color 400ms ease, opacity 500ms ease;
}
.center-button:hover { transform: scale(1.035); border-color: var(--accent); }
.center-button:active { transform: scale(0.98); }
.center-button-label {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 28px;
  letter-spacing: 0.005em;
  color: var(--ink);
  line-height: 1;
}

/* Completed step pills above center button */
.center-pills {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 320px;
  margin-bottom: 6px;
  min-height: 28px;
}
.center-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  transition: all 280ms;
  cursor: pointer;
}
.center-pill:hover {
  color: var(--ink);
  border-color: var(--accent);
  background: color-mix(in oklab, var(--bg) 70%, var(--accent));
}
.center-pill-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px color-mix(in oklab, var(--accent) 60%, transparent);
}

/* Locked countdown button (post-session) */
.center-button[data-locked="true"] {
  animation: none;
  cursor: default;
  background:
    radial-gradient(circle at 30% 25%, color-mix(in oklab, var(--accent) 6%, var(--bg)) 0%, color-mix(in oklab, var(--bg) 96%, var(--accent)) 70%);
  border-color: color-mix(in oklab, var(--accent) 22%, transparent);
}
.center-button[data-locked="true"]:hover { transform: none; }
.center-button-countdown {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Inter Tight', sans-serif;
}
.center-button-countdown-time {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.center-button-countdown-label {
  font-size: 8px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
}
.center-button-lock {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -38px);
  opacity: 0.5;
  color: var(--accent);
}
.center-button-lock svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; }

/* Theme picker */
.orbit-themes {
  position: absolute;
  bottom: max(28px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 5;
  transition: opacity 500ms ease;
}
.orbit-themes-row {
  display: flex;
  gap: 14px;
  padding: 10px 20px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.orbit-theme-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  position: relative;
  transition: transform 300ms;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
}
.orbit-theme-dot:hover { transform: scale(1.15); }
.orbit-theme-dot.active {
  transform: scale(1.15);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 0 2px var(--ink), 0 0 16px var(--accent);
}

/* ───── Step fullscreen layout ───── */
.step-fs {
  position: absolute; inset: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding:
    calc(env(safe-area-inset-top) + 26px)
    24px
    calc(env(safe-area-inset-bottom) + 32px);
  animation: v-step-in 700ms cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.step-fs > * { pointer-events: auto; }
.step-fs-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 18px);
  left: 18px;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  color: var(--ink-soft);
  display: flex;
  align-items: center; justify-content: center;
  transition: all 300ms;
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.step-fs-back:hover {
  color: var(--ink);
  border-color: var(--accent);
  transform: translateX(-2px);
}
.step-fs-back svg {
  width: 16px; height: 16px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.step-fs-help {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 18px);
  right: 18px;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  color: var(--ink-soft);
  display: flex;
  align-items: center; justify-content: center;
  transition: all 300ms;
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
}
.step-fs-help:hover {
  color: var(--ink);
  border-color: var(--accent);
}

.step-fs-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: clamp(16px, 3.5vh, 28px);
}
.step-fs-eyebrow {
  font-size: 10px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.78;
  font-family: 'Inter Tight', sans-serif;
}
.step-fs-ref {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-family: 'Inter Tight', sans-serif;
}
.step-fs-body {
  flex: 1 1 auto;
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 2.6vh, 26px);
  min-height: 0;
}
.step-fs-bottom {
  width: 100%;
  max-width: 760px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 2.4vh, 22px);
  margin-top: clamp(14px, 2.6vh, 24px);
}

/* Actions / soft buttons */
.action {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  color: var(--ink);
  transition: color 300ms, opacity 300ms;
}
.action-text {
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  font-family: 'Inter Tight', sans-serif;
}
.action-line {
  width: 24px; height: 1px;
  background: var(--accent);
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
}
.action:hover .action-line { width: 56px; }
.action:disabled { opacity: 0.35; cursor: not-allowed; }
.action:disabled:hover .action-line { width: 24px; }
.action[data-blocked="true"] .action-line {
  background: var(--ink-faint);
  width: 16px;
}
.action-soft {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 8px 12px;
  transition: color 300ms;
}
.action-soft:hover { color: var(--ink-soft); }

/* Verse display (shared by Listen/Ponder) */
.verse-fs-arabic-wrap {
  width: 100%;
  max-width: 1080px;
  display: flex;
  align-items: center; justify-content: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  max-height: 50vh;
  padding: 6px 4px;
  scrollbar-width: none;
}
.verse-fs-arabic-wrap::-webkit-scrollbar { display: none; }
.verse-fs-arabic-wrap[data-overflowing="true"] {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
}
.verse-fs-arabic {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
  font-size: clamp(22px, 3.4vw + 4px, 44px);
  line-height: 2.1;
  color: var(--ink);
  text-align: center;
  word-wrap: break-word;
  overflow-wrap: break-word;
  width: 100%;
  text-shadow: 0 0 30px color-mix(in oklab, var(--accent) 8%, transparent);
  transition: text-shadow 600ms ease;
}
.verse-fs-translation-wrap {
  width: 100%;
  max-width: 720px;
  max-height: 26vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 8px;
  scrollbar-width: none;
}
.verse-fs-translation-wrap::-webkit-scrollbar { display: none; }
.verse-fs-translation-wrap[data-overflowing="true"] {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 91%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 91%, transparent 100%);
}
.verse-fs-translation {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  font-size: clamp(15px, 1.1vw + 8px, 19px);
  line-height: 1.65;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
  letter-spacing: 0.005em;
}
.step-fs.playing .verse-fs-arabic {
  animation:
    v-heartbeat 1.2s ease-in-out infinite,
    v-glow-pulse 2.4s ease-in-out infinite;
}
.step-fs.playing .verse-fs-translation {
  animation: v-translation-pulse 2.4s ease-in-out infinite;
}

/* Verse position dots */
.verse-position {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 100px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.verse-position-dots { display: flex; gap: 4px; }
.verse-position-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--ink-faint);
  opacity: 0.35;
  transition: all 350ms;
}
.verse-position-dot.active {
  background: var(--accent);
  opacity: 1;
  width: 16px;
  border-radius: 3px;
}
.verse-position-dot.done {
  background: var(--accent);
  opacity: 0.7;
}

/* Per-verse nav (prev / play / next) */
.verse-nav {
  display: flex;
  align-items: center;
  gap: 18px;
  justify-content: center;
}
.verse-nav-arrow {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  color: var(--ink-soft);
  display: flex;
  align-items: center; justify-content: center;
  transition: all 300ms;
  background: color-mix(in oklab, var(--bg) 50%, transparent);
}
.verse-nav-arrow:hover:not(:disabled) {
  color: var(--ink);
  border-color: var(--accent);
  transform: scale(1.06);
}
.verse-nav-arrow:disabled { opacity: 0.2; cursor: not-allowed; }
.verse-nav-arrow svg {
  width: 16px; height: 16px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}

/* Audio player */
.verse-fs-audio { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.player-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center; justify-content: center;
  color: var(--accent);
  transition: all 400ms;
}
.player-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 28px color-mix(in oklab, var(--accent) 35%, transparent);
  transform: scale(1.05);
}
.player-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.player-btn svg { width: 24px; height: 24px; fill: currentColor; }
.verse-fs-wave {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 28px;
  width: 110px;
  justify-content: center;
}
.verse-fs-wave span {
  display: block;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  transition: height 120ms ease, opacity 120ms ease;
}
.verse-fs-meta {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-faint);
  font-style: italic;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.verse-fs-meta .reciter { color: var(--ink-soft); }
.verse-fs-meta .sep { opacity: 0.5; margin: 0 8px; }
.verse-fs-actions {
  display: flex;
  align-items: center;
  gap: clamp(14px, 3vw, 28px);
  justify-content: center;
  flex-wrap: wrap;
}

/* ───── Selection step ───── */
.select-scroll {
  width: 100%;
  max-width: 680px;
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 4px;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 4%, black 96%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 4%, black 96%, transparent 100%);
}
.select-scroll::-webkit-scrollbar { width: 3px; }
.select-scroll::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 2px;
}
.select-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.select-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: color-mix(in oklab, var(--bg) 0%, transparent);
  transition: all 280ms;
  text-align: left;
  cursor: pointer;
}
.select-row:hover {
  background: color-mix(in oklab, var(--bg) 30%, transparent);
}
.select-row[data-state="selected"] {
  background: color-mix(in oklab, var(--accent) 8%, transparent);
  border-color: color-mix(in oklab, var(--accent) 35%, transparent);
}
.select-row[data-state="endpoint"] {
  background: color-mix(in oklab, var(--accent) 14%, transparent);
  border-color: var(--accent);
  box-shadow: 0 0 22px color-mix(in oklab, var(--accent) 22%, transparent);
}
.select-row-num {
  flex-shrink: 0;
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  opacity: 0.65;
  min-width: 38px;
  padding-top: 4px;
}
.select-row[data-state="selected"] .select-row-num,
.select-row[data-state="endpoint"] .select-row-num { opacity: 1; }
.select-row-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.select-row-arabic {
  font-family: 'Amiri Quran', serif;
  direction: rtl;
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
  text-align: right;
  opacity: 0.92;
}
.select-row-translation {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink-soft);
}
.select-row-mark {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
  display: flex;
  align-items: center; justify-content: center;
  margin-top: 6px;
  transition: all 280ms;
}
.select-row[data-state="selected"] .select-row-mark {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 8px color-mix(in oklab, var(--accent) 50%, transparent);
}
.select-row[data-state="endpoint"] .select-row-mark {
  background: var(--accent);
  border-color: var(--ink);
  box-shadow: 0 0 14px var(--accent);
}
.select-summary {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}
.select-summary-count {
  font-size: 22px;
  color: var(--ink);
}
.select-summary-hint {
  font-size: 13px;
  color: var(--ink-soft);
  opacity: 0.8;
  text-align: center;
  max-width: 360px;
  line-height: 1.5;
}

/* Ponder instruction text */
.ponder-instruction {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(13px, 0.6vw + 11px, 16px);
  line-height: 1.6;
  color: var(--ink-soft);
  text-align: center;
  max-width: 460px;
  opacity: 0.85;
}

/* Question step */
.q-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-family: 'Inter Tight', sans-serif;
}
.q-pill-dots { display: flex; gap: 5px; }
.q-pill-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--ink-faint);
  opacity: 0.35;
  transition: all 400ms;
}
.q-pill-dot.active {
  background: var(--accent);
  opacity: 1;
  width: 18px;
  border-radius: 3px;
}
.q-pill-dot.done {
  background: var(--accent);
  opacity: 0.7;
}
.question-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  width: 100%;
  max-width: 720px;
}
.question-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(20px, 1.5vw + 14px, 30px);
  line-height: 1.45;
  color: var(--ink);
  text-align: center;
  letter-spacing: -0.005em;
  text-shadow: 0 0 32px color-mix(in oklab, var(--accent) 6%, transparent);
}
.question-ornament {
  width: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.question-ornament .o-line {
  height: 1px;
  flex: 1;
  background: linear-gradient(to right, transparent, color-mix(in oklab, var(--accent) 50%, transparent));
}
.question-ornament .o-line.flip {
  background: linear-gradient(to left, transparent, color-mix(in oklab, var(--accent) 50%, transparent));
}
.question-ornament .o-mark { color: var(--accent); font-size: 9px; opacity: 0.7; }
.question-hint {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
  text-align: center;
  opacity: 0.65;
  max-width: 360px;
  line-height: 1.5;
}

/* Verse panel beneath question (collapsible) */
.verse-panel {
  width: 100%;
  max-width: 640px;
  border: 1px solid color-mix(in oklab, var(--accent) 18%, transparent);
  border-radius: 14px;
  background: color-mix(in oklab, var(--bg) 30%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  transition: max-height 400ms ease;
}
.verse-panel-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  transition: color 200ms;
}
.verse-panel-toggle:hover { color: var(--ink); }
.verse-panel-toggle svg {
  width: 12px; height: 12px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round;
  transition: transform 300ms;
}
.verse-panel[data-open="true"] .verse-panel-toggle svg { transform: rotate(180deg); }
.verse-panel-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 400ms cubic-bezier(0.22, 1, 0.36, 1);
}
.verse-panel[data-open="true"] .verse-panel-content { max-height: 42vh; }
.verse-panel-scroll {
  max-height: 42vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px 16px 16px;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
}
.verse-panel-scroll::-webkit-scrollbar { width: 3px; }
.verse-panel-scroll::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 2px;
}
.verse-panel-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0;
  border-bottom: 1px solid color-mix(in oklab, var(--accent) 8%, transparent);
}
.verse-panel-row:last-child { border-bottom: none; }
.verse-panel-row-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.verse-panel-row-ref {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
}
.verse-panel-tafsir-btn {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  transition: color 200ms;
}
.verse-panel-tafsir-btn:hover { color: var(--accent); }
.verse-panel-arabic {
  font-family: 'Amiri Quran', serif;
  direction: rtl;
  font-size: 17px;
  line-height: 1.8;
  color: var(--ink);
  text-align: right;
  opacity: 0.92;
}
.verse-panel-translation {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-soft);
}

/* Write step */
.write-scroll {
  width: 100%;
  max-width: 640px;
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px 4px;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
}
.write-scroll::-webkit-scrollbar { width: 3px; }
.write-scroll::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 2px;
}
.write-intro {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(15px, 0.5vw + 13px, 17px);
  line-height: 1.7;
  color: var(--ink-soft);
  text-align: center;
  max-width: 560px;
  margin: 0 auto 20px;
}
.write-intro strong {
  color: var(--ink);
  font-weight: 400;
  font-style: italic;
  display: block;
  margin-top: 14px;
  font-size: 1.05em;
}
.write-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  margin-top: 14px;
}
.write-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
  animation: v-fade-rise 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.write-row-num {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--accent);
  opacity: 0.65;
  font-variant-numeric: tabular-nums;
  font-family: 'Inter Tight', sans-serif;
  width: 22px;
  text-align: center;
}
.write-input {
  flex: 1;
  border: none;
  border-bottom: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-style: italic;
  padding: 10px 0;
  outline: none;
  transition: border-color 300ms;
  line-height: 1.5;
}
.write-input:focus { border-color: var(--accent); }
.write-input::placeholder {
  color: var(--ink-faint);
  opacity: 0.5;
  font-style: italic;
}
.write-remove {
  width: 22px; height: 22px;
  border-radius: 50%;
  color: var(--ink-faint);
  opacity: 0;
  display: flex;
  align-items: center; justify-content: center;
  transition: opacity 300ms, color 300ms;
}
.write-row:hover .write-remove { opacity: 0.6; }
.write-remove:hover { color: var(--accent); opacity: 1; }
.write-remove svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; }
.write-add {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 12px 0;
  margin-top: 8px;
  transition: color 300ms;
}
.write-add:hover { color: var(--accent); }
.write-add svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; }

/* Title prompt step */
.title-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 24px;
  animation: v-fade-rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.title-step-prompt {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(20px, 1vw + 16px, 26px);
  line-height: 1.4;
  color: var(--ink);
  text-align: center;
  letter-spacing: -0.005em;
}
.title-step-hint {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-soft);
  text-align: center;
  opacity: 0.75;
  line-height: 1.55;
  max-width: 400px;
}
.title-step-input {
  width: 100%;
  border: none;
  border-bottom: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  text-align: center;
  padding: 14px 4px;
  outline: none;
  transition: border-color 300ms;
}
.title-step-input:focus { border-color: var(--accent); }
.title-step-input::placeholder {
  color: var(--ink-faint);
  opacity: 0.5;
}

/* Tafsir sheet */
.tafsir-backdrop {
  position: fixed; inset: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  animation: v-fade-in 400ms ease;
}
.tafsir-sheet {
  position: fixed;
  z-index: 51;
  left: 0; right: 0; bottom: 0;
  max-height: 88dvh;
  background:
    radial-gradient(ellipse at top, color-mix(in oklab, var(--accent) 5%, transparent) 0%, transparent 50%),
    color-mix(in oklab, var(--bg) 92%, var(--bg-soft));
  border-top: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  animation: v-slide-up 560ms cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}
.tafsir-handle {
  width: 36px; height: 4px;
  background: var(--ink-faint);
  opacity: 0.35;
  border-radius: 2px;
  margin: 10px auto 4px;
  flex-shrink: 0;
}
.tafsir-header {
  display: flex;
  align-items: center; justify-content: space-between;
  padding: 14px 24px 10px;
  flex-shrink: 0;
}
.tafsir-header-left { display: flex; flex-direction: column; gap: 4px; }
.tafsir-era {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
}
.tafsir-scholar {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  color: var(--ink);
  font-style: italic;
  letter-spacing: 0.005em;
}
.tafsir-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  color: var(--ink-soft);
  display: flex;
  align-items: center; justify-content: center;
  transition: all 250ms;
}
.tafsir-close:hover {
  color: var(--ink);
  border-color: var(--accent);
  transform: rotate(90deg);
}
.tafsir-close svg {
  width: 14px; height: 14px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round;
}
.tafsir-divider {
  height: 1px;
  margin: 6px 24px 0;
  background: linear-gradient(to right,
    transparent,
    color-mix(in oklab, var(--accent) 30%, transparent) 30%,
    color-mix(in oklab, var(--accent) 30%, transparent) 70%,
    transparent);
  flex-shrink: 0;
}
.tafsir-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 24px 28px 36px;
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  font-size: 16px;
  line-height: 1.75;
  color: var(--ink-soft);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 96%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 96%, transparent 100%);
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
}
.tafsir-body::-webkit-scrollbar { width: 3px; }
.tafsir-body::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--accent) 30%, transparent); border-radius: 2px; }
.tafsir-body p { margin: 0 0 14px; }
.tafsir-body p:last-child { margin-bottom: 0; }
.tafsir-body h1, .tafsir-body h2, .tafsir-body h3, .tafsir-body h4 {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--ink);
  font-weight: 400;
  font-size: 17px;
  margin: 18px 0 10px;
}
.tafsir-body em, .tafsir-body i { color: var(--ink); font-style: italic; }
.tafsir-body strong, .tafsir-body b { color: var(--ink); font-weight: 500; }
.tafsir-loading {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  padding: 40px 0;
  color: var(--ink-faint);
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
@media (min-width: 768px) {
  .tafsir-sheet {
    left: 50%;
    right: auto;
    bottom: 6vh;
    transform: translateX(-50%);
    width: min(640px, 92vw);
    max-height: 78vh;
    border-radius: 24px;
    border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
    animation: v-slide-up-md 560ms cubic-bezier(0.22, 1, 0.36, 1);
  }
}

.loading-dots { display: inline-flex; gap: 6px; align-items: center; }
.loading-dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.5;
  animation: v-twinkle 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
.verse-skeleton {
  font-size: clamp(22px, 3.4vw + 4px, 44px);
  color: var(--ink-faint);
  opacity: 0.4;
  letter-spacing: 0.2em;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 110px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  z-index: 60;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.toast.entering { animation: v-toast-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
.toast.leaving  { animation: v-toast-out 360ms ease both; }
.toast-time {
  font-variant-numeric: tabular-nums;

    body: "From your life’s purpose down to tomorrow. Aim short. Aim true. The top horizon — Al-Firdaws — is fixed; it is the one you cannot edit, because the rest only make sense beneath it." },
  nextSession: {
    title: 'The next sitting',
    body: "One cycle per day, by design. Sittings are short visits with the Qurʾān, not a race through it. While you wait, refine your Resolutions, your Provision, or your plan for tomorrow." },
};

window.THEMES = [
  { id: 'dusk',  name: 'Dusk',       subtitle: 'Plum horizon',
    bg: '#14101a', bgSoft: '#1e1726', ink: '#f0e3d5', inkSoft: '#bfa99a', inkFaint: '#6e5d6a',
    accent: '#d7826a', accentSoft: '#9a5540',
    ring: 'radial-gradient(circle at 30% 30%, #f3b6a2, #b25f46 55%, #3d1d18)' },
  { id: 'olive', name: 'Olive',      subtitle: 'Garden, dim light',
    bg: '#0f1410', bgSoft: '#171e18', ink: '#e7e0cd', inkSoft: '#a9b099', inkFaint: '#5a6352',
    accent: '#a8b266', accentSoft: '#6d7840',
    ring: 'radial-gradient(circle at 30% 30%, #d6dc9a, #7a8840 55%, #2a3014)' },
  { id: 'space', name: 'Deep Space', subtitle: 'Slow and vast',
    bg: '#05070d', bgSoft: '#0a0f1c', ink: '#d8e0f0', inkSoft: '#8a96b3', inkFaint: '#3e4868',
    accent: '#9bb8ff', accentSoft: '#5a78c8',
    ring: 'radial-gradient(circle at 30% 30%, #d4dfff, #5b6dc8 55%, #14204a)' },
];
</script>

<script type="text/babel" data-presets="react">
/* global React, ReactDOM */
const { useState, useEffect, useRef, useCallback, useMemo, useReducer } = React;

const STEPS = [
  { id: 'listen',    label: 'Listen' },
  { id: 'select',    label: 'Select' },
  { id: 'ponder',    label: 'Ponder' },
  { id: 'questions', label: 'Questions' },
  { id: 'write',     label: 'Write' },
];

/* ─────────── helpers ─────────── */
function uuid() {
  return 'x-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function verseKey(s, v) { return `${s}:${v}`; }
function parseKey(k) { const [s, v] = k.split(':').map(Number); return { surah: s, verse: v }; }
function stripHtml(str) {
  if (!str) return "";
  const t = document.createElement("div");
  t.innerHTML = str;
  return t.textContent || t.innerText || "";
}
function cleanTafsirHtml(rawHtml) {
  if (!rawHtml || !rawHtml.trim()) return "";
  const doc = new DOMParser().parseFromString(rawHtml, "text/html");
  const allowed = new Set(["P","H1","H2","H3","H4","EM","STRONG","B","I","BR","SPAN"]);
  function walk(node) {
    const out = [];
    for (const child of node.childNodes) {
      if (child.nodeType === 3) out.push(child.textContent);
      else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (allowed.has(tag)) {
          const inner = walk(child);
          if (tag === "BR") out.push("<br>");
          else if (tag === "SPAN") out.push(inner);
          else out.push(`<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`);
        } else out.push(walk(child));
      }
    }
    return out.join("");
  }
  return walk(doc.body);
}
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function wordCount(str) {
  if (!str) return 0;
  return str.trim().split(/\s+/).filter(Boolean).length;
}
function countdownToMidnight() {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setHours(24, 0, 0, 0);
  const ms = tomorrow.getTime() - now.getTime();
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return { h, m, s, ms };
}
function pad2(n) { return String(n).padStart(2, '0'); }

async function fetchSurahInfo(n) {
  try {
    const r = await fetch(`${window.API_BASE}/chapters/${n}`);
    if (!r.ok) return null;
    const ch = (await r.json()).chapter;
    if (!ch) return null;
    return { name: ch.name_simple || "", verses_count: ch.verses_count || 0 };
  } catch (e) { return null; }
}
async function fetchVerseDetails(vk) {
  const data = { key: vk, arabic: "", translation: "", audioUrl: "" };
  try {
    const r = await fetch(`${window.API_BASE}/verses/by_key/${vk}?fields=text_uthmani`);
    if (r.ok) data.arabic = (await r.json()).verse?.text_uthmani || "";
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/quran/translations/${window.TRANSLATION_ID}?verse_key=${vk}`);
    if (r.ok) data.translation = stripHtml((await r.json()).translations?.[0]?.text || "");
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/recitations/${window.RECITATION_ID}/by_ayah/${vk}`);
    if (r.ok) {
      const url = (await r.json()).audio_files?.[0]?.url || "";
      data.audioUrl = url.startsWith("http") ? url : window.AUDIO_BASE + url;
    }
  } catch (e) {}
  return data;
}
async function fetchTafsir(vk) {
  try {
    const r = await fetch(`${window.API_BASE}/tafsirs/${window.TAFSIR_ID}/by_ayah/${vk}`);
    if (!r.ok) return "";
    return cleanTafsirHtml((await r.json()).tafsir?.text || "");
  } catch (e) { return ""; }
}
async function fetchVersesForSession(surah, startVerse, maxInSurah) {
  const target = window.SESSION_VERSES_TARGET;
  const remainingInSurah = Math.max(0, maxInSurah - startVerse + 1);
  const count = Math.min(target, remainingInSurah);
  if (count <= 0) return [];
  const promises = [];
  for (let i = 0; i < count; i++) {
    const v = startVerse + i;
    promises.push(fetchVerseDetails(verseKey(surah, v)).then(d => ({
      ...d, surah, verse: v, key: verseKey(surah, v),
    })));
  }
  return Promise.all(promises);
}
function computeNextSessionStart(lastSurah, lastVerse) {
  // Given the LAST pondered verse, return the NEXT session's start.
  // Default: lastSurah=1, lastVerse=7 → start at 2:1.
  let s = lastSurah;
  let v = lastVerse + 1;
  return { surah: s, verse: v };
}

/* ─────────── force-update on Y.Doc updates ─────────── */
function useYjsTick() {
  const [, tick] = useReducer(x => (x + 1) | 0, 0);
  useEffect(() => {
    if (!window.YDOC) return;
    const handler = () => tick();
    window.YDOC.on('update', handler);
    return () => window.YDOC.off('update', handler);
  }, []);
}

/* ─────────── DB API (built on top of window.YDOC) ─────────── */
function buildDB(ydoc) {
  const DB = {
    ydoc,
    meta: ydoc.getMap('meta'),
    currentSession: ydoc.getMap('currentSession'),
    sessions: ydoc.getArray('sessions'),
    actions: ydoc.getArray('actions'),
    texts: ydoc.getMap('texts'),
    goals: ydoc.getMap('goals'),
    timetable: ydoc.getArray('timetable'),
  };
  DB.getTheme = () => DB.meta.get('themeIdx') ?? 0;
  DB.setTheme = (i) => DB.meta.set('themeIdx', i);
  DB.getLastPondered = () => ({
    surah: DB.meta.get('lastPonderedSurah') ?? 1,
    verse: DB.meta.get('lastPonderedVerse') ?? 7,
  });
  DB.setLastPondered = (s, v) => {
    ydoc.transact(() => {
      DB.meta.set('lastPonderedSurah', s);
      DB.meta.set('lastPonderedVerse', v);
    });
  };
  DB.getLastSessionDate = () => DB.meta.get('lastSessionDate') ?? null;
  DB.setLastSessionDate = (d) => DB.meta.set('lastSessionDate', d);

  DB.getCurrentSession = () => {
    if (!DB.currentSession.has('id')) return null;
    const o = {};
    DB.currentSession.forEach((v, k) => { o[k] = v; });
    return o;
  };
  DB.setCurrentSessionField = (key, val) => DB.currentSession.set(key, val);
  DB.replaceCurrentSession = (data) => {
    ydoc.transact(() => {
      DB.currentSession.forEach((_, k) => DB.currentSession.delete(k));
      if (data) Object.entries(data).forEach(([k, v]) => DB.currentSession.set(k, v));
    });
  };
  DB.clearCurrentSession = () => DB.replaceCurrentSession(null);

  DB.addAction = (text, sessionId) => {
    const existing = DB.actions.toArray();
    const maxRanking = existing.length
      ? Math.max(...existing.map(a => (typeof a.ranking === 'number' ? a.ranking : 0)))
      : -1;
    const action = {
      id: uuid(),
      text: text.trim(),
      ranking: maxRanking + 1,
      sessionId,
      createdAt: Date.now(),
    };
    DB.actions.push([action]);
    return action.id;
  };
  DB.deleteActionsForSession = (sessionId) => {
    const arr = DB.actions.toArray();
    ydoc.transact(() => {
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i].sessionId === sessionId) DB.actions.delete(i, 1);
      }
    });
  };
  DB.updateAction = (id, patch) => {
    const arr = DB.actions.toArray();
    const idx = arr.findIndex(a => a.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.actions.delete(idx, 1);
      DB.actions.insert(idx, [{ ...arr[idx], ...patch }]);
    });
  };
  DB.swapActionRanking = (idA, idB) => {
    const arr = DB.actions.toArray();
    const iA = arr.findIndex(a => a.id === idA);
    const iB = arr.findIndex(a => a.id === idB);
    if (iA < 0 || iB < 0) return;
    const rA = arr[iA].ranking, rB = arr[iB].ranking;
    DB.updateAction(idA, { ranking: rB });
    DB.updateAction(idB, { ranking: rA });
  };
  DB.getActionsSorted = () => {
    return DB.actions.toArray().slice().sort((a, b) => (a.ranking ?? 0) - (b.ranking ?? 0));
  };

  DB.addSession = (sessionData) => {
    DB.sessions.push([sessionData]);
  };
  DB.updateSessionTitle = (id, title) => {
    const arr = DB.sessions.toArray();
    const idx = arr.findIndex(s => s.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.sessions.delete(idx, 1);
      DB.sessions.insert(idx, [{ ...arr[idx], title }]);
    });
  };

  DB.getText = (key) => DB.texts.get(key) ?? '';
  DB.setText = (key, val) => DB.texts.set(key, val);

  DB.getGoal = (key) => DB.goals.get(key) ?? '';
  DB.setGoal = (key, val) => DB.goals.set(key, val);

  DB.timetableArr = () => DB.timetable.toArray();
  DB.timetableEnsurePrayers = () => {
    const existing = DB.timetable.toArray();
    const hasPrayer = (name) => existing.some(b => b.isPrayer && b.label === name);
    const missing = window.PRAYER_BLOCKS.filter(n => !hasPrayer(n));
    if (!missing.length) return;
    ydoc.transact(() => {
      missing.forEach(n => DB.timetable.push([{ id: uuid(), label: n, time: '', isPrayer: true }]));
    });
  };
  DB.timetableAdd = (time, label) => {
    DB.timetable.push([{ id: uuid(), label, time, isPrayer: false }]);
  };
  DB.timetableUpdate = (id, patch) => {
    const arr = DB.timetable.toArray();
    const idx = arr.findIndex(b => b.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.timetable.delete(idx, 1);
      DB.timetable.insert(idx, [{ ...arr[idx], ...patch }]);
    });
  };
  DB.timetableRemove = (id) => {
    const arr = DB.timetable.toArray();
    const idx = arr.findIndex(b => b.id === id);
    if (idx >= 0) DB.timetable.delete(idx, 1);
  };

  return DB;
}

/* ─────────── ROOT (mounted by startApp) ─────────── */
function MiranRoot() {
  useYjsTick();
  const DB = window.DB;
  const themeIdx = DB.getTheme();
  const theme = window.THEMES[themeIdx];

  /* update browser theme color */
  useEffect(() => {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme.bg);
  }, [theme.bg]);

  const cs = DB.getCurrentSession();
  const lastSessionDate = DB.getLastSessionDate();
  const sessionInProgress = !!cs;
  const dailyDoneToday = !sessionInProgress && lastSessionDate === todayStr();

  /* in-memory verse cache (re-fetched on session start; ephemeral) */
  const verseCacheRef = useRef({}); // { 'S:V': details }
  const [verseCacheVersion, bumpCache] = useReducer(x => x + 1, 0);

  /* loading verses for the active session */
  const [versesLoading, setVersesLoading] = useState(false);
  const [versesError, setVersesError] = useState(null);
  useEffect(() => {
    if (!cs || !cs.verseKeys || cs.verseKeys.length === 0) return;
    // any missing verse details? fetch all in parallel
    const missing = cs.verseKeys.filter(k => !verseCacheRef.current[k]);
    if (missing.length === 0) return;
    setVersesLoading(true);
    setVersesError(null);
    let cancelled = false;
    (async () => {
      try {
        const results = await Promise.all(missing.map(k => fetchVerseDetails(k)));
        results.forEach((d, i) => { verseCacheRef.current[missing[i]] = d; });
        if (!cancelled) { setVersesLoading(false); bumpCache(); }
      } catch (e) {
        if (!cancelled) { setVersesError(String(e)); setVersesLoading(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [cs?.id, cs?.verseKeys?.join(',')]);

  /* view: which screen is showing */
  const [view, setView] = useState('home'); // 'home' | 'listen' | 'select' | 'ponder' | 'questions' | 'write' | 'title' | sub-sections
  const [subView, setSubView] = useState(null); // dashboard subsection key
  const [helpKey, setHelpKey] = useState(null);

  /* toast & confirm */
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);
  const showToast = useCallback((message, time) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ id: Date.now(), message, time, leaving: false });
    toastTimerRef.current = setTimeout(() => {
      setToast(t => t ? { ...t, leaving: true } : null);
      setTimeout(() => setToast(null), 400);
    }, 2600);
  }, []);
  const [confirm, setConfirm] = useState(null);

  /* tafsir sheet */
  const [tafsirOpen, setTafsirOpen] = useState(false);
  const [tafsirVerseKey, setTafsirVerseKey] = useState(null);
  const [tafsirText, setTafsirText] = useState('');
  const [tafsirLoading, setTafsirLoading] = useState(false);
  const tafsirCacheRef = useRef({}); // { key: html }
  const openTafsir = useCallback((vk) => {
    setTafsirOpen(true);
    setTafsirVerseKey(vk);
    if (tafsirCacheRef.current[vk]) {
      setTafsirText(tafsirCacheRef.current[vk]);
      return;
    }
    setTafsirText('');
    setTafsirLoading(true);
    fetchTafsir(vk).then(t => {
      tafsirCacheRef.current[vk] = t;
      setTafsirText(t);
      setTafsirLoading(false);
    }).catch(() => setTafsirLoading(false));
  }, []);

  /* theme switch */
  const setTheme = useCallback((i) => DB.setTheme(i), []);

  /* start a new session */
  const startNewSession = useCallback(async () => {
    if (sessionInProgress) return;
    const { surah: lastS, verse: lastV } = DB.getLastPondered();
    const start = computeNextSessionStart(lastS, lastV);
    // Fetch surah info first to know its size
    setVersesLoading(true);
    let surahInfo = await fetchSurahInfo(start.surah);
    if (!surahInfo) {
      setVersesLoading(false);
      showToast('Could not load surah', '');
      return;
    }
    let surah = start.surah;
    let startVerse = start.verse;
    // If we've overflowed the surah, jump to next surah
    if (startVerse > surahInfo.verses_count) {
      surah = surah + 1;
      startVerse = 1;
      if (surah > 114) { surah = 2; startVerse = 1; }
      surahInfo = await fetchSurahInfo(surah);
      if (!surahInfo) { setVersesLoading(false); showToast('Could not load surah', ''); return; }
    }
    const verses = await fetchVersesForSession(surah, startVerse, surahInfo.verses_count);
    if (!verses.length) { setVersesLoading(false); showToast('No verses to load', ''); return; }
    verses.forEach(v => { verseCacheRef.current[v.key] = v; });
    bumpCache();
    DB.replaceCurrentSession({
      id: uuid(),
      startedAt: Date.now(),
      surah,
      surahName: surahInfo.name,
      surahVersesCount: surahInfo.verses_count,
      verseKeys: verses.map(v => v.key),
      completedSteps: 0,
      listenIdx: 0,
      listenReached: 0,
      selectedEndIdx: 0,
      ponderIdx: 0,
      qIdx: 0,
      writeActions: [''],
      title: '',
    });
    setVersesLoading(false);
    setView('listen');
  }, [sessionInProgress, showToast]);

  /* continue an existing session by entering its current step */
  const enterCurrentStep = useCallback(() => {
    if (!cs) return;
    const stepId = STEPS[cs.completedSteps]?.id;
    if (stepId) setView(stepId);
  }, [cs]);

  /* enter a completed step (revisit) */
  const revisitStep = useCallback((stepIdx) => {
    if (!cs) return;
    if (stepIdx >= cs.completedSteps) return;
    setView(STEPS[stepIdx].id);
  }, [cs]);

  /* mark a step complete and return to home */
  const completeStep = useCallback((stepIdx) => {
    if (!cs) return;
    const next = Math.max(cs.completedSteps, stepIdx + 1);
    DB.setCurrentSessionField('completedSteps', next);
    setView('home');
  }, [cs]);

  /* save Write step → save actions → ask for title */
  const submitWrite = useCallback((writeActions) => {
    DB.setCurrentSessionField('writeActions', writeActions);
    DB.setCurrentSessionField('completedSteps', 5);
    setView('title');
  }, []);

  /* finalize session with a title */
  const finalizeSession = useCallback((title) => {
    if (!cs) return;
    const finalTitle = (title || '').trim() || 'A sitting';
    const today = todayStr();
    // Save actions
    const actionIds = [];
    (cs.writeActions || []).map(s => s.trim()).filter(Boolean).forEach(txt => {
      actionIds.push(DB.addAction(txt, cs.id));
    });
    // Determine pondered range
    const ponderedKeys = cs.verseKeys.slice(0, (cs.selectedEndIdx ?? 0) + 1);
    const lastKey = ponderedKeys[ponderedKeys.length - 1];
    const { surah: lastS, verse: lastV } = parseKey(lastKey);
    // Save session
    DB.addSession({
      id: cs.id,
      title: finalTitle,
      date: today,
      verseKeys: cs.verseKeys,
      ponderedKeys,
      actionIds,
    });
    // Update lastPondered to last verse user actually pondered
    DB.setLastPondered(lastS, lastV);
    DB.setLastSessionDate(today);
    // Ensure prayers exist in timetable for the user
    DB.timetableEnsurePrayers();
    DB.clearCurrentSession();
    setView('home');
  }, [cs]);

  /* back from a step to home */
  const goHome = useCallback(() => setView('home'), []);

  /* abandon current session — not exposed in UI by default */

  /* style vars */
  const styleVars = {
    '--bg': theme.bg, '--bg-soft': theme.bgSoft,
    '--ink': theme.ink, '--ink-soft': theme.inkSoft, '--ink-faint': theme.inkFaint,
    '--accent': theme.accent, '--accent-soft': theme.accentSoft,
  };
  const fullscreen = view !== 'home' || !!subView;

  /* current verse details from cache */
  const getVerse = useCallback((idx) => {
    if (!cs?.verseKeys?.[idx]) return null;
    return verseCacheRef.current[cs.verseKeys[idx]] || null;
  }, [cs?.verseKeys, verseCacheVersion]);
  const sessionVerses = useMemo(() => {
    if (!cs?.verseKeys) return [];
    return cs.verseKeys.map(k => verseCacheRef.current[k] || { key: k });
  }, [cs?.verseKeys, verseCacheVersion]);

  return (
    <div className="v-root orbit-root" style={styleVars} data-fullscreen={fullscreen} data-theme={theme.id}>
      <PlasmaLayer />
      <OrbitBackdrop />

      {view === 'home' && !subView && (
        <HomeView
          DB={DB}
          cs={cs}
          dailyDoneToday={dailyDoneToday}
          versesLoading={versesLoading}
          startNewSession={startNewSession}
          enterCurrentStep={enterCurrentStep}
          revisitStep={revisitStep}
          openSection={(key) => setSubView(key)}
          openHelp={(key) => setHelpKey(key)}
          themeIdx={themeIdx}
          setTheme={setTheme}
        />
      )}

      {view === 'listen' && cs && (
        <ListenStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          versesLoading={versesLoading}
          onBack={goHome}
          onContinue={() => completeStep(0)}
          openTafsir={openTafsir}
        />
      )}

      {view === 'select' && cs && (
        <SelectionStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onContinue={() => completeStep(1)}
        />
      )}

      {view === 'ponder' && cs && (
        <PonderStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onContinue={() => completeStep(2)}
          openTafsir={openTafsir}
          showToast={showToast}
        />
      )}

      {view === 'questions' && cs && (
        <QuestionsStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onComplete={() => completeStep(3)}
          openTafsir={openTafsir}
          setConfirm={setConfirm}
        />
      )}

      {view === 'write' && cs && (
        <WriteStep
          cs={cs}
          DB={DB}
          onBack={goHome}
          onSave={submitWrite}
        />
      )}

      {view === 'title' && cs && (
        <TitleStep
          cs={cs}
          onSubmit={finalizeSession}
        />
      )}

      {subView && (
        <SubsectionRouter
          subView={subView}
          DB={DB}
          onClose={() => setSubView(null)}
          openHelp={(key) => setHelpKey(key)}
        />
      )}

      {tafsirOpen && (
        <TafsirSheet
          tafsirText={tafsirText}
          loading={tafsirLoading}
          verseKey={tafsirVerseKey}
          onClose={() => setTafsirOpen(false)}
        />
      )}

      {helpKey && (
        <HelpModal
          help={window.HELP_TEXTS[helpKey]}
          onClose={() => setHelpKey(null)}
        />
      )}

      {toast && <Toast {...toast} />}
      {confirm && <ConfirmModal {...confirm} />}

      <OrbitThemePicker themeIdx={themeIdx} setThemeIdx={setTheme} />
    </div>
  );
}

/* ─────────── PLASMA ─────────── */
function PlasmaLayer() {
  return (
    <div className="plasma-layer" aria-hidden>
      <div className="plasma-blob a" />
      <div className="plasma-blob b" />
      <div className="plasma-blob c" />

/* ─────────── STARS (bigger variety, some luminous) ─────────── */
function OrbitBackdrop() {
  const stars = useMemo(() => {
    return Array.from({ length: 110 }, (_, i) => {
      const lum = (i % 5 === 0); // ~20% are luminous & bigger
      const baseSize = lum
        ? 1.6 + ((i * 13) % 11) / 7   // 1.6 – 3.2px
        : 0.5 + ((i * 17) % 8) / 6;   // 0.5 – 1.8px
      return {
        x: (i * 37 + (i * i * 7) % 31) % 100,
        y: (i * 53 + (i * i * 3) % 41) % 100,
        s: baseSize,
        lum,
        lo: lum ? 0.35 + ((i * 7) % 4) / 18 : 0.08 + ((i * 7) % 4) / 18,
        hi: lum ? 0.85 + ((i * 11) % 4) / 25 : 0.35 + ((i * 11) % 6) / 18,
        dur: 4 + (i % 11) * 0.7,
        delay: (i % 13) * 0.5,
      };
    });
  }, []);
  return (
    <div className="orbit-backdrop" aria-hidden>
      {stars.map((s, i) => (
        <span key={i} data-lum={s.lum ? '1' : '0'} style={{
          left: `${s.x}%`, top: `${s.y}%`,
          width: `${s.s}px`, height: `${s.s}px`,
          '--star-lo': s.lo, '--star-hi': s.hi,
          '--star-dur': `${s.dur}s`,
          animationDelay: `${s.delay}s`,
        }} />
      ))}
      <div className="orbit-glow" />
    </div>
  );
}

/* ─────────── VERSE BODY (shared) ─────────── */
function VerseBody({ verse, loading }) {
  const arabicRef = useRef(null);
  const transRef = useRef(null);
  useEffect(() => {
    const check = (el) => { if (!el) return; el.dataset.overflowing = el.scrollHeight > el.clientHeight + 2 ? 'true' : 'false'; };
    const a = arabicRef.current, t = transRef.current;
    check(a); check(t);
    const obs = [];
    [a, t].forEach(el => {
      if (!el || typeof ResizeObserver === 'undefined') return;
      const ro = new ResizeObserver(() => check(el));
      ro.observe(el);
      if (el.firstChild) ro.observe(el.firstChild);
      obs.push(ro);
    });
    const onR = () => { check(a); check(t); };
    window.addEventListener('resize', onR);
    return () => { obs.forEach(o => o.disconnect()); window.removeEventListener('resize', onR); };
  }, [verse?.arabic, verse?.translation]);
  return (
    <div className="step-fs-body">
      <div className="verse-fs-arabic-wrap" ref={arabicRef}>
        {verse?.arabic ? (
          <div className="verse-fs-arabic arabic-font">{verse.arabic}</div>
        ) : (
          <div className="verse-skeleton">···</div>
        )}
      </div>
      <div className="verse-fs-translation-wrap" ref={transRef}>
        <div className="verse-fs-translation">
          {verse?.translation || (loading ? <span className="loading-dots"><span/><span/><span/></span> : '')}
        </div>
      </div>
    </div>
  );
}

/* ─────────── LISTEN STEP (multi-verse) ─────────── */
function ListenStep({ cs, DB, verses, versesLoading, onBack, onContinue, openTafsir }) {
  const total = verses.length;
  const [idx, setIdx] = useState(cs.listenIdx ?? 0);
  const [reachedIdx, setReachedIdx] = useState(cs.listenReached ?? 0);
  // Persist idx/reachedIdx in DB
  useEffect(() => { DB.setCurrentSessionField('listenIdx', idx); }, [idx]);
  useEffect(() => { DB.setCurrentSessionField('listenReached', reachedIdx); }, [reachedIdx]);

  const verse = verses[idx];
  const audioRef = useRef(null);
  const [audioState, setAudioState] = useState({ playing: false, finished: false, current: 0, duration: 0 });
  const [autoAdvance, setAutoAdvance] = useState(true);

  // Set up audio for current verse
  useEffect(() => {
    if (!verse?.audioUrl) {
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      setAudioState({ playing: false, finished: false, current: 0, duration: 0 });
      return;
    }
    const a = new Audio(verse.audioUrl);
    a.preload = 'auto';
    audioRef.current = a;
    const onPlay = () => setAudioState(s => ({ ...s, playing: true, finished: false }));
    const onPause = () => setAudioState(s => ({ ...s, playing: false }));
    const onEnded = () => {
      setAudioState(s => ({ ...s, playing: false, finished: true }));
      // auto-advance to next verse
      if (autoAdvance) {
        if (idx < total - 1) {
          setIdx(i => i + 1);
          setReachedIdx(r => Math.max(r, idx + 1));
        } else {
          setReachedIdx(total - 1);
        }
      }
    };
    const onTime = () => setAudioState(s => ({ ...s, current: a.currentTime, duration: a.duration || s.duration }));
    const onMeta = () => setAudioState(s => ({ ...s, duration: a.duration || 0 }));
    a.addEventListener('play', onPlay);
    a.addEventListener('pause', onPause);
    a.addEventListener('ended', onEnded);
    a.addEventListener('timeupdate', onTime);
    a.addEventListener('loadedmetadata', onMeta);
    return () => {
      a.pause();
      a.removeEventListener('play', onPlay);
      a.removeEventListener('pause', onPause);
      a.removeEventListener('ended', onEnded);
      a.removeEventListener('timeupdate', onTime);
      a.removeEventListener('loadedmetadata', onMeta);
    };
  }, [verse?.audioUrl, idx, total, autoAdvance]);

  const togglePlay = useCallback(() => {
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) a.play().catch(() => {});
    else a.pause();
  }, []);
  const replayCurrent = useCallback(() => {
    const a = audioRef.current;
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(() => {});
  }, []);
  const goPrev = useCallback(() => {
    if (idx <= 0) return;
    if (audioRef.current) audioRef.current.pause();
    setIdx(i => i - 1);
  }, [idx]);
  const goNext = useCallback(() => {
    if (idx >= total - 1) return;
    if (audioRef.current) audioRef.current.pause();
    setIdx(i => i + 1);
    setReachedIdx(r => Math.max(r, idx + 1));
  }, [idx, total]);
  const repeatAll = useCallback(() => {
    setIdx(0);
    setReachedIdx(0);
    setTimeout(() => {
      if (audioRef.current) {
        audioRef.current.currentTime = 0;
        audioRef.current.play().catch(() => {});
      }
    }, 200);
  }, []);

  const playing = audioState.playing;
  const atEnd = reachedIdx >= total - 1;
  const surahRef = `Surah ${cs.surahName} · ${cs.surah}:${verse?.verse ?? '—'}`;

  return (
    <div className={`step-fs ${playing ? 'playing' : ''}`}>
      <BackButton onClick={onBack} />
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Listen</div>
        <VersePositionIndicator idx={idx} total={total} reachedIdx={reachedIdx} />
        <div className="step-fs-ref">{surahRef}</div>
      </div>
      <VerseBody verse={verse} loading={versesLoading} />
      <div className="step-fs-bottom">
        <div className="verse-fs-audio">
          <div className="verse-nav">
            <button className="verse-nav-arrow" onClick={goPrev} disabled={idx <= 0} aria-label="Previous verse">
              <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button className="player-btn" onClick={togglePlay} disabled={!verse?.audioUrl} aria-label={playing ? 'Pause' : 'Play'}>
              {playing ? (
                <svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>
              ) : (
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              )}
            </button>
            <button className="verse-nav-arrow" onClick={goNext} disabled={idx >= total - 1} aria-label="Next verse">
              <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div className="verse-fs-meta">
            <span className="reciter">{window.RECITER_NAME}</span>
            {verse?.audioUrl && (<><span className="sep">·</span><span>{formatTime(audioState.current)} / {formatTime(audioState.duration)}</span></>)}
          </div>
        </div>
        <div className="verse-fs-actions">
          <button className="action-soft" onClick={replayCurrent} disabled={!verse?.audioUrl}>Repeat verse</button>
          <button className="action-soft" onClick={() => openTafsir(verse.key)} disabled={!verse?.key}>Tafsir</button>
          {atEnd && <button className="action-soft" onClick={repeatAll}>Repeat all</button>}
          {atEnd && (
            <button className="action" onClick={onContinue}>
              <span className="action-text">Continue</span>
              <span className="action-line" />
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─────────── PONDER STEP (multi-verse, no audio, n/2 min timer, tafsir) ─────────── */
function PonderStep({ cs, DB, verses, onBack, onContinue, openTafsir, showToast }) {
  const selectedCount = (cs.selectedEndIdx ?? 0) + 1;
  const total = selectedCount;
  const [idx, setIdx] = useState(Math.min(cs.ponderIdx ?? 0, total - 1));
  useEffect(() => { DB.setCurrentSessionField('ponderIdx', idx); }, [idx]);

  const totalSeconds = Math.max(30, (selectedCount / 2) * 60);
  const startedAtRef = useRef(Date.now() - (cs.ponderElapsedMs || 0));
  const [remaining, setRemaining] = useState(() => {
    const elapsed = (Date.now() - startedAtRef.current) / 1000;
    return Math.max(0, totalSeconds - elapsed);
  });
  useEffect(() => {
    const t = setInterval(() => {
      const elapsed = (Date.now() - startedAtRef.current) / 1000;
      const rem = Math.max(0, totalSeconds - elapsed);
      setRemaining(rem);
      DB.setCurrentSessionField('ponderElapsedMs', Math.floor(elapsed * 1000));
      if (rem <= 0) clearInterval(t);
    }, 500);
    return () => clearInterval(t);
  }, [totalSeconds]);

  const ready = remaining <= 0;
  const verse = verses[idx];
  const tryContinue = () => {
    if (!ready) { showToast('Sit a little longer', formatTime(remaining)); return; }
    onContinue();
  };

  return (
    <div className="step-fs">
      <BackButton onClick={onBack} />
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Ponder</div>
        <VersePositionIndicator idx={idx} total={total} reachedIdx={total - 1} />
        <div className="step-fs-ref">Surah {cs.surahName} · {cs.surah}:{verse?.verse ?? '—'}</div>
      </div>
      <VerseBody verse={verse} />
      <div className="step-fs-bottom">
        <div className="verse-nav">
          <button className="verse-nav-arrow" onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx <= 0} aria-label="Previous verse">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button className="verse-nav-arrow" onClick={() => setIdx(i => Math.min(total - 1, i + 1))} disabled={idx >= total - 1} aria-label="Next verse">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div className="ponder-instruction">
          {selectedCount === 1 ? 'Sit with this verse.' : `Sit with these ${selectedCount} verses.`} Let them move through you.
          {' '}{Math.ceil(selectedCount / 2)} minute{selectedCount > 2 ? 's' : ''} — no less.
        </div>
        <div className="verse-fs-actions">
          <button className="action-soft" onClick={() => openTafsir(verse.key)} disabled={!verse?.key}>Tafsir</button>
          <button className="action" data-blocked={!ready} onClick={tryContinue}>
            <span className="action-text">{ready ? 'Continue' : formatTime(remaining)}</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── QUESTIONS STEP ─────────── */
function QuestionsStep({ cs, DB, verses, onBack, onComplete, openTafsir, setConfirm }) {
  const total = window.QUESTIONS.length;
  const [qIdx, setQIdx] = useState(cs.qIdx ?? 0);
  useEffect(() => { DB.setCurrentSessionField('qIdx', qIdx); }, [qIdx]);

  const [remaining, setRemaining] = useState(window.QUESTION_SECONDS);
  useEffect(() => {
    setRemaining(window.QUESTION_SECONDS);
    let start = Date.now();
    const i = setInterval(() => {
      const elapsed = (Date.now() - start) / 1000;
      const rem = Math.max(0, window.QUESTION_SECONDS - elapsed);
      setRemaining(rem);
      if (rem <= 0) clearInterval(i);
    }, 250);
    return () => clearInterval(i);
  }, [qIdx]);

  const selectedCount = (cs.selectedEndIdx ?? 0) + 1;
  const selectedVerses = verses.slice(0, selectedCount);

  const advance = () => {
    const next = qIdx + 1;
    if (next >= total) onComplete();
    else setQIdx(next);
  };
  const tryAdvance = () => {
    if (remaining > 0) {
      setConfirm({
        eyebrow: 'A moment',
        message: 'Are you sure? Sitting with this question may serve you.',
        time: formatTime(remaining),
        onConfirm: () => { setConfirm(null); advance(); },
        onCancel: () => setConfirm(null),
      });
    } else {
      advance();
    }
  };
  const isLast = qIdx === total - 1;

  return (
    <div className="step-fs" key={qIdx}>
      <BackButton onClick={onBack} />
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Questions</div>
        <div className="q-pill">
          <span>{qIdx + 1} of {total}</span>
          <div className="q-pill-dots">
            {Array.from({ length: total }).map((_, i) => (
              <div key={i} className={`q-pill-dot ${i === qIdx ? 'active' : i < qIdx ? 'done' : ''}`} />
            ))}
          </div>
        </div>
      </div>
      <div className="step-fs-body">
        <div className="question-body fade-in">
          <div className="question-ornament">
            <div className="o-line flip" />
            <span className="o-mark">✦</span>
            <div className="o-line" />
          </div>
          <div className="question-text">{window.QUESTIONS[qIdx]}</div>
          <div className="question-hint">Close your eyes. Sit with this for one minute.</div>
          <VersesPanel verses={selectedVerses} openTafsir={openTafsir} />
        </div>
      </div>
      <div className="step-fs-bottom">
        <button className="action" data-blocked={remaining > 0} onClick={tryAdvance}>
          <span className="action-text">{isLast ? 'Complete' : 'Next question'}</span>
          <span className="action-line" />
        </button>
      </div>
    </div>
  );
}
