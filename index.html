              <div className="verse-panel-row-head">
                <div className="verse-panel-row-ref">{v.surah}:{v.verse ?? (i+1)}</div>
                <button className="verse-panel-tafsir-btn" onClick={() => openTafsir(v.key)} disabled={!v.key}>Tafsir</button>
              </div>
              {v.arabic && <div className="verse-panel-arabic">{v.arabic}</div>}
              {v.translation && <div className="verse-panel-translation">{v.translation}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─────────── WRITE STEP ─────────── */
function WriteStep({ cs, DB, onBack, onSave }) {
  const [actions, setActions] = useState(() => (cs.writeActions?.length ? cs.writeActions : ['']));
  useEffect(() => { DB.setCurrentSessionField('writeActions', actions); }, [actions]);
  const update = (i, val) => setActions(prev => prev.map((a, idx) => idx === i ? val : a));
  const addRow = () => setActions(prev => [...prev, '']);
  const removeRow = (i) => setActions(prev => {
    const next = prev.filter((_, idx) => idx !== i);
    return next.length ? next : [''];
  });
  return (
    <div className="step-fs">
      <BackButton onClick={onBack} />
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Write</div>
        <div className="step-fs-ref">Surah {cs.surahName} · {cs.surah}:{cs.verseKeys[0]?.split(':')[1]} – {cs.verseKeys[cs.verseKeys.length-1]?.split(':')[1]}</div>
      </div>
      <div className="write-scroll">
        <div className="write-intro">
          The goal of every Muslim is to enter Paradise and be saved from Hellfire. Life is a test, and our limited time on earth is a precious gift from Allah that we may use to that purpose. Action and knowledge come together.
          <strong>What practical actions or commitments can you implement in your life to benefit from this knowledge?</strong>
        </div>
        <div className="write-list">
          {actions.map((val, i) => (
            <div className="write-row" key={i}>
              <span className="write-row-num">{String(i + 1).padStart(2, '0')}</span>
              <input className="write-input" type="text" value={val} placeholder="An action you will take…" onChange={(e) => update(i, e.target.value)} />
              <button className="write-remove" onClick={() => removeRow(i)} aria-label="Remove" tabIndex={-1}>
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
          ))}
          <button className="write-add" onClick={addRow}>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add another
          </button>
        </div>
      </div>
      <div className="step-fs-bottom">
        <button className="action" onClick={() => onSave(actions)}>
          <span className="action-text">Save &amp; complete</span>
          <span className="action-line" />
        </button>
      </div>
    </div>
  );
}

/* ─────────── TITLE STEP ─────────── */
function TitleStep({ cs, onSubmit }) {
  const [title, setTitle] = useState(cs.title || '');
  const inputRef = useRef(null);
  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 400); }, []);
  const submit = () => onSubmit(title);
  return (
    <div className="step-fs">
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Title</div>
        <div className="step-fs-ref">Surah {cs.surahName}</div>
      </div>
      <div className="step-fs-body">
        <div className="title-step">
          <div className="title-step-prompt">Give this sitting a name.</div>
          <div className="title-step-hint">Something you’ll recognize when you return to it. A theme. A reminder. A phrase from the verses.</div>
          <input
            ref={inputRef}
            className="title-step-input"
            type="text"
            value={title}
            placeholder="A sitting…"
            onChange={(e) => setTitle(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
            maxLength={80}
          />
        </div>
      </div>
      <div className="step-fs-bottom">
        <button className="action" onClick={submit}>
          <span className="action-text">Complete</span>
          <span className="action-line" />
        </button>
      </div>
    </div>
  );
}

/* ─────────── SUBSECTION ROUTER ─────────── */
function SubsectionRouter({ subView, DB, onClose, openHelp }) {
  useYjsTick();
  const titles = {
    sittings: 'Sittings',
    abodes: 'Paradise & Fire',
    resolutions: 'Resolutions',
    tomorrow: 'Tomorrow',
    provision: 'Provision',
    horizons: 'Horizons',
  };
  const Body = () => {
    if (subView === 'sittings')    return <SittingsBody DB={DB} />;
    if (subView === 'abodes')      return <AbodesBody DB={DB} />;
    if (subView === 'resolutions') return <ResolutionsBody DB={DB} />;
    if (subView === 'tomorrow')    return <TomorrowBody DB={DB} />;
    if (subView === 'provision')   return <ProvisionBody DB={DB} />;
    if (subView === 'horizons')    return <HorizonsBody DB={DB} />;
    return null;
  };
  return (
    <div className="sub-fs">
      <div className="sub-fs-top">
        <button className="step-fs-back" style={{ position: 'static' }} onClick={onClose} aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div className="sub-fs-title">{titles[subView]}</div>
        <button className="step-fs-help" style={{ position: 'static' }} onClick={() => openHelp(subView)} aria-label="Help">?</button>
      </div>
      <div className="sub-fs-body">
        <div className="sub-fs-inner">
          <Body />
        </div>
      </div>
    </div>
  );
}

/* ── Sittings ── */
function SittingsBody({ DB }) {
  const sessions = DB.sessions.toArray().slice().reverse();
  const [showAll, setShowAll] = useState(false);
  const visible = showAll ? sessions : sessions.slice(0, 3);
  if (!sessions.length) return <div className="sit-empty">No sittings yet. Complete your first cycle.</div>;
  return (
    <>
      {visible.map(s => {
        const first = s.verseKeys?.[0] || '—';
        const last = s.ponderedKeys?.[s.ponderedKeys.length - 1] || s.verseKeys?.[s.verseKeys.length - 1] || '—';
        return (
          <div key={s.id} className="sit-row">
            <div className="sit-row-title">{s.title || 'A sitting'}</div>
            <div className="sit-row-meta">
              <span className="sit-row-range">{first} → {last}</span>
              <span>{s.date}</span>
            </div>
          </div>
        );
      })}
      {!showAll && sessions.length > 3 && (
        <button className="sit-show-more" onClick={() => setShowAll(true)}>Show all {sessions.length}</button>
      )}
    </>
  );
}

/* ── Abodes (Paradise & Fire) ── */
function AbodesBody({ DB }) {
  const [paradise, setParadise] = useState(DB.getText('paradise'));
  const [hellfire, setHellfire] = useState(DB.getText('hellfire'));
  // debounced write
  useEffect(() => { const t = setTimeout(() => DB.setText('paradise', paradise), 300); return () => clearTimeout(t); }, [paradise]);
  useEffect(() => { const t = setTimeout(() => DB.setText('hellfire', hellfire), 300); return () => clearTimeout(t); }, [hellfire]);
  return (
    <>
      <div className="sub-section-label">Paradise</div>
      <textarea className="sub-textarea" value={paradise} placeholder="Picture a scene in Al-Firdaws. Where are you? What is around you? What does the light feel like…" onChange={(e) => setParadise(e.target.value)} />
      <div className="sub-section-label">Hellfire</div>
      <textarea className="sub-textarea" value={hellfire} placeholder="Picture, soberly and with restraint, what you wish to be saved from. Write it so vividly that fleeing it becomes natural…" onChange={(e) => setHellfire(e.target.value)} />
    </>
  );
}

/* ── Resolutions ── */
function ResolutionsBody({ DB }) {
  const all = DB.getActionsSorted();
  const [showAll, setShowAll] = useState(false);
  const visible = showAll ? all : all.slice(0, 3);
  if (!all.length) return <div className="sit-empty">No resolutions yet. They’re added each time you complete a sitting.</div>;
  const moveUp = (idx) => {
    if (idx <= 0) return;
    DB.swapActionRanking(all[idx].id, all[idx - 1].id);
  };
  const moveDown = (idx) => {
    if (idx >= all.length - 1) return;
    DB.swapActionRanking(all[idx].id, all[idx + 1].id);
  };
  return (
    <>
      {visible.map((a, i) => (
        <div key={a.id} className="res-row">
          <div className="res-row-rank">{i + 1}</div>
          <div className="res-row-text">{a.text}</div>
          <div className="res-row-controls">
            <button className="res-arrow" onClick={() => moveUp(i)} disabled={i === 0} aria-label="Move up">
              <svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>
            </button>
            <button className="res-arrow" onClick={() => moveDown(i)} disabled={i === all.length - 1} aria-label="Move down">
              <svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      ))}
      {!showAll && all.length > 3 && (
        <button className="sit-show-more" onClick={() => setShowAll(true)}>Show all {all.length}</button>
      )}
      <div className="res-meta">Focus on the top three. Reorder as your priorities change.</div>
    </>
  );
}

/* ── Tomorrow (timetable) ── */
function TomorrowBody({ DB }) {
  // Make sure prayer rows exist
  useEffect(() => { DB.timetableEnsurePrayers(); }, []);
  const all = DB.timetable.toArray();
  // Sort by time (empty times go last among prayers, etc.) — keep insertion order for now
  const updateTime = (id, time) => DB.timetableUpdate(id, { time });
  const updateLabel = (id, label) => DB.timetableUpdate(id, { label });
  const remove = (id) => DB.timetableRemove(id);
  const [newTime, setNewTime] = useState('');
  const [newLabel, setNewLabel] = useState('');
  const addBlock = () => {
    if (!newLabel.trim()) return;
    DB.timetableAdd(newTime, newLabel.trim());
    setNewTime(''); setNewLabel('');
  };
  return (
    <>
      <div className="tt-list">
        {all.map(b => (
          <div key={b.id} className="tt-row" data-prayer={b.isPrayer ? 'true' : 'false'}>
            <input className="tt-time" type="time" value={b.time || ''} placeholder="--:--" onChange={(e) => updateTime(b.id, e.target.value)} />
            <input className="tt-label" type="text" value={b.label || ''} placeholder="What…" onChange={(e) => updateLabel(b.id, e.target.value)} readOnly={b.isPrayer} />
            {!b.isPrayer && (
              <button className="tt-remove" onClick={() => remove(b.id)} aria-label="Remove">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            )}
          </div>
        ))}
      </div>
      <div className="sub-section-label">Add a block</div>
      <div className="tt-row" style={{ background: 'transparent' }}>
        <input className="tt-time" type="time" value={newTime} placeholder="--:--" onChange={(e) => setNewTime(e.target.value)} />
        <input className="tt-label" type="text" value={newLabel} placeholder="What you’ll do…" onChange={(e) => setNewLabel(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addBlock(); }} />
      </div>
      <button className="action" onClick={addBlock} style={{ alignSelf: 'center', marginTop: 4 }}>
        <span className="action-text">Add</span>
        <span className="action-line" />
      </button>
    </>
  );
}

/* ── Provision ── */
function ProvisionBody({ DB }) {
  const [text, setText] = useState(DB.getText('provision'));
  useEffect(() => { const t = setTimeout(() => DB.setText('provision', text), 300); return () => clearTimeout(t); }, [text]);
  const words = wordCount(text);
  const over = words > window.PROVISION_WORD_LIMIT;
  return (
    <>
      <textarea
        className="sub-textarea"
        style={{ minHeight: 320 }}
        value={text}
        placeholder="The dense, refined text you read every day. Distill. Cut. Refine again…"
        onChange={(e) => setText(e.target.value)}
      />
      <div className={`sub-counter ${over ? 'over' : ''}`}>{words} / {window.PROVISION_WORD_LIMIT} words</div>
    </>
  );
}

/* ── Horizons (goals) ── */
function HorizonsBody({ DB }) {
  return (
    <>
      <div className="goal-field-pinned">
        <div className="goal-field-pinned-label">Above all</div>
        {window.HARDCODED_TOP_GOAL}
      </div>
      {window.GOAL_FIELDS.map(g => (
        <HorizonsField key={g.key} DB={DB} field={g} />
      ))}
    </>
  );
}
function HorizonsField({ DB, field }) {
  const [val, setVal] = useState(DB.getGoal(field.key));
  useEffect(() => { const t = setTimeout(() => DB.setGoal(field.key, val), 300); return () => clearTimeout(t); }, [val]);
  return (
    <div className="goal-field">
      <div className="goal-field-label">{field.label}</div>
      <input className="sub-textfield" type="text" value={val} placeholder={field.hint} onChange={(e) => setVal(e.target.value)} />
    </div>
  );
}

/* ─────────── TAFSIR SHEET ─────────── */
function TafsirSheet({ tafsirText, loading, verseKey, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <>
      <div className="tafsir-backdrop" onClick={onClose} aria-hidden />
      <div className="tafsir-sheet" role="dialog" aria-label="Tafsir">
        <div className="tafsir-handle" />
        <div className="tafsir-header">
          <div className="tafsir-header-left">
            <div className="tafsir-era">{window.TAFSIR_ERA} · Tafsir{verseKey ? ' · ' + verseKey : ''}</div>
            <div className="tafsir-scholar">{window.TAFSIR_NAME}</div>
          </div>
          <button className="tafsir-close" onClick={onClose} aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div className="tafsir-divider" />
        <div className="tafsir-body">
          {loading || !tafsirText ? (
            <div className="tafsir-loading">
              <span className="loading-dots"><span/><span/><span/></span>
              <span>Loading tafsir</span>
            </div>
          ) : (
            <div dangerouslySetInnerHTML={{ __html: tafsirText }} />
          )}
        </div>
      </div>
    </>
  );
}

/* ─────────── HELP MODAL ─────────── */
function HelpModal({ help, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!help) return null;
  return (
    <div className="confirm-backdrop" onClick={onClose}>
      <div className="help-card" onClick={(e) => e.stopPropagation()}>
        <div className="help-title">{help.title}</div>
        <div className="help-body"><p>{help.body}</p></div>
        <div className="confirm-buttons" style={{ justifyContent: 'center' }}>
          <button className="action" onClick={onClose}>
            <span className="action-text">Close</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── TOAST ─────────── */
function Toast({ message, time, leaving }) {
  return (
    <div className={`toast ${leaving ? 'leaving' : 'entering'}`} role="status">
      <span>{message}</span>
      {time && <span className="toast-time">{time}</span>}
    </div>
  );
}

/* ─────────── CONFIRM MODAL ─────────── */
function ConfirmModal({ eyebrow, message, time, onConfirm, onCancel }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
  return (
    <div className="confirm-backdrop" onClick={onCancel}>
      <div className="confirm-card" onClick={(e) => e.stopPropagation()}>
        <div className="confirm-eyebrow">{eyebrow}</div>
        <div className="confirm-msg">{message}</div>
        {time && <div className="confirm-time">{time} remaining</div>}
        <div className="confirm-buttons">
          <button className="action-soft" onClick={onCancel}>Wait</button>
          <button className="action" onClick={onConfirm}>
            <span className="action-text">Continue anyway</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── THEME PICKER ─────────── */
function OrbitThemePicker({ themeIdx, setThemeIdx }) {
  return (
    <div className="orbit-themes">
      <div className="orbit-themes-row">
        {window.THEMES.map((t, i) => (
          <button
            key={t.id}
            className={`orbit-theme-dot ${i === themeIdx ? 'active' : ''}`}
            style={{ background: t.ring }}
            onClick={() => setThemeIdx(i)}
            title={t.name}
            aria-label={`${t.name} theme`}
          />
        ))}
      </div>
    </div>
  );
}

/* ─────────── BOOT ─────────── */
async function startApp() {
  // wait for Yjs to be loaded (it loads via type=module, async)
  let waitedMs = 0;
  while (!window.Y || !window.IndexeddbPersistence) {
    await new Promise(r => setTimeout(r, 50));
    waitedMs += 50;
    if (waitedMs > 8000) { console.error('Yjs failed to load after 8s'); break; }
  }
  if (!window.Y || !window.IndexeddbPersistence) {
    document.getElementById('orbit-mount').innerHTML =
      '<div style="color:#bfa99a;font-family:Cormorant Garamond,serif;font-style:italic;font-size:18px;text-align:center;padding:40px">Could not load the database. Please check your connection and reload.</div>';
    return;
  }
  const ydoc = new window.Y.Doc();
  window.YDOC = ydoc;
  // IndexedDB persistence
  try {
    const persistence = new window.IndexeddbPersistence('miran-v3', ydoc);
    await persistence.whenSynced;
  } catch (e) {
    console.warn('IndexeddbPersistence failed, continuing in-memory:', e);
  }
  window.DB = buildDB(ydoc);
  ReactDOM.createRoot(document.getElementById('orbit-mount')).render(<MiranRoot />);
}
startApp();
</script>
