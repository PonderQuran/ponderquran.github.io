                    });
                };

                DB.timetableToggleDone = (id) => {
                    const arr = DB.timetable.toArray();
                    const idx = arr.findIndex((b) => b.id === id);
                    if (idx < 0) return;
                    DB.timetableUpdate(id, { done: !arr[idx].done });
                };

                DB.setLearningSitting = (id) =>
                    DB.meta.set("learningSittingId", id);
                DB.getLearningSittingId = () =>
                    DB.meta.get("learningSittingId") || null;
                DB.getLearningEnabled = () =>
                    DB.meta.get("learningEnabled") !== false;
                DB.setLearningEnabled = (v) =>
                    DB.meta.set("learningEnabled", !!v);
                DB.setLearnedVerseKeys = (keys) => {
                    const arr =
                        DB.learnedVerseKeys ||
                        ydoc.getArray("learnedVerseKeys");
                    if (!DB.learnedVerseKeys) DB.learnedVerseKeys = arr;
                    arr.delete(0, arr.length);
                    keys.forEach((k) => arr.push([k]));
                };
                DB.getLearnedVerseKeys = () => {
                    if (!DB.learnedVerseKeys) {
                        DB.learnedVerseKeys = ydoc.getArray("learnedVerseKeys");
                    }
                    return DB.learnedVerseKeys.toArray();
                };
                DB.markVerseLearned = (key) => {
                    const arr = DB.getLearnedVerseKeys();
                    if (!arr.includes(key)) {
                        if (!DB.learnedVerseKeys) {
                            DB.learnedVerseKeys =
                                ydoc.getArray("learnedVerseKeys");
                        }
                        DB.learnedVerseKeys.push([key]);
                    }
                };
                DB.unmarkVerseLearned = (key) => {
                    const arr = DB.getLearnedVerseKeys();
                    const idx = arr.indexOf(key);
                    if (idx >= 0 && DB.learnedVerseKeys) {
                        DB.learnedVerseKeys.delete(idx, 1);
                    }
                };
                DB.hasLearnedAllVerses = () => {
                    const sittingId = DB.getLearningSittingId();
                    if (!sittingId) return true;
                    const arr = DB.getLearnedVerseKeys();
                    return arr.length >= 5;
                };

                return DB;
            }

            /* ─────────── ROOT (mounted by startApp) ─────────── */
            function MiranRoot() {
                useYjsTick();
                const DB = window.DB;
                const themeIdx = DB.getTheme();
                const theme = window.THEMES[themeIdx];

                /* update browser theme color */
                useEffect(() => {
                    const meta = document.querySelector(
                        'meta[name="theme-color"]',
                    );
                    if (meta) meta.setAttribute("content", theme.bg);
                }, [theme.bg]);

                const cs = DB.getCurrentSession();
                const lastSessionDate = DB.getLastSessionDate();
                const sessionInProgress = !!cs;
                const dailyDoneToday =
                    (!sessionInProgress || (cs && cs.isReplay)) &&
                    lastSessionDate === todayStr();

                /* in-memory verse cache (re-fetched on session start; ephemeral) */
                const verseCacheRef = useRef({}); // { 'S:V': details }
                const [verseCacheVersion, bumpCache] = useReducer(
                    (x) => x + 1,
                    0,
                );

                /* loading verses for the active session */
                const [versesLoading, setVersesLoading] = useState(false);
                const [versesError, setVersesError] = useState(null);
                useEffect(() => {
                    if (!cs || !cs.verseKeys || cs.verseKeys.length === 0)
                        return;
                    // any missing verse details? fetch all in parallel
                    const missing = cs.verseKeys.filter(
                        (k) => !verseCacheRef.current[k],
                    );
                    if (missing.length === 0) return;
                    setVersesLoading(true);
                    setVersesError(null);
                    let cancelled = false;
                    (async () => {
                        try {
                            const results = await Promise.all(
                                missing.map((k) => fetchVerseDetails(k)),
                            );
                            results.forEach((d, i) => {
                                verseCacheRef.current[missing[i]] = d;
                            });
                            if (!cancelled) {
                                setVersesLoading(false);
                                bumpCache();
                            }
                        } catch (e) {
                            if (!cancelled) {
                                setVersesError(String(e));
                                setVersesLoading(false);
                            }
                        }
                    })();
                    return () => {
                        cancelled = true;
                    };
                }, [cs?.id, cs?.verseKeys?.join(",")]);

                /* view: which screen is showing */
                const [view, setView] = useState(() => {
                    if (sessionStorage.getItem("qf_just_logged_in")) return "lessons";
                    return "home";
                });

                /* on mount: jump straight to memorize if verses pending and learning enabled */
                useEffect(() => {
                    if (sessionStorage.getItem("qf_just_logged_in")) {
                        sessionStorage.removeItem("qf_just_logged_in");
                        return;
                    }
                    if (!DB.getLearningEnabled()) return;
                    const lsid = DB.getLearningSittingId();
                    const learned = DB.getLearnedVerseKeys();
                    if (lsid && learned.length < 5) {
                        setView("memorize");
                    }
                }, []); // 'home' | 'listen' | 'ponder' | 'questions' | 'write' | 'title' | sub-sections
                const [homeTab, setHomeTab] = useState("dashboard");
                const [subView, setSubView] = useState(null); // dashboard subsection key
                const [returnSubView, setReturnSubView] = useState(null); // where to go back after replay
                const [helpKey, setHelpKey] = useState(null);
                const [showIntro, setShowIntro] = useState(!DB.getHideIntro());
                const [showSettings, setShowSettings] = useState(false);
                const [forceDashboard, setForceDashboard] = useState(false);

                /* toast & confirm */
                const [toast, setToast] = useState(null);
                const toastTimerRef = useRef(null);
                const showToast = useCallback((message, time) => {
                    if (toastTimerRef.current)
                        clearTimeout(toastTimerRef.current);
                    setToast({ id: Date.now(), message, time, leaving: false });
                    toastTimerRef.current = setTimeout(() => {
                        setToast((t) => (t ? { ...t, leaving: true } : null));
                        setTimeout(() => setToast(null), 400);
                    }, 2600);
                }, []);
                const [confirm, setConfirm] = useState(null);

                /* tafsir sheet */
                const [tafsirOpen, setTafsirOpen] = useState(false);
                const [tafsirVerseKey, setTafsirVerseKey] = useState(null);
                const [tafsirText, setTafsirText] = useState("");
                const [tafsirLoading, setTafsirLoading] = useState(false);
                const tafsirCacheRef = useRef({}); // { key: html }
                const openTafsir = useCallback((vk) => {
                    setTafsirOpen(true);
                    setTafsirVerseKey(vk);
                    if (tafsirCacheRef.current[vk]) {
                        setTafsirText(tafsirCacheRef.current[vk]);
                        return;
                    }
                    setTafsirText("");
                    setTafsirLoading(true);
                    fetchTafsir(vk)
                        .then((t) => {
                            tafsirCacheRef.current[vk] = t;
                            setTafsirText(t);
                            setTafsirLoading(false);
                        })
                        .catch(() => setTafsirLoading(false));
                }, []);

                /* theme switch */
                const setTheme = useCallback((i) => DB.setTheme(i), []);

                /* start a new session */
                const doStartNewSession = useCallback(async () => {
                    setHomeTab("sitting");
                    const furthest = computeFurthestPondered(DB);
                    const start = computeNextSessionStart(
                        furthest.surah,
                        furthest.verse,
                    );
                    setVersesLoading(true);
                    let surahInfo = await fetchSurahInfo(start.surah);
                    if (!surahInfo) {
                        setVersesLoading(false);
                        showToast("Could not load surah", "");
                        return;
                    }
                    let surah = start.surah;
                    let startVerse = start.verse;
                    if (startVerse > surahInfo.verses_count) {
                        surah = surah + 1;
                        startVerse = 1;
                        if (surah > 114) {
                            surah = 2;
                            startVerse = 1;
                        }
                        surahInfo = await fetchSurahInfo(surah);
                        if (!surahInfo) {
                            setVersesLoading(false);
                            showToast("Could not load surah", "");
                            return;
                        }
                    }
                    const verses = await fetchVersesForSession(
                        surah,
                        startVerse,
                        surahInfo.verses_count,
                    );
                    if (!verses.length) {
                        setVersesLoading(false);
                        showToast("No verses to load", "");
                        return;
                    }
                    verses.forEach((v) => {
                        verseCacheRef.current[v.key] = v;
                    });
                    bumpCache();
                    DB.replaceCurrentSession({
                        id: uuid(),
                        startedAt: Date.now(),
                        surah,
                        surahName: surahInfo.name,
                        surahVersesCount: surahInfo.verses_count,
                        verseKeys: verses.map((v) => v.key),
                        completedSteps: 0,
                        listenIdx: 0,
                        listenReached: 0,
                        selectedEndIdx: Math.min(4, verses.length - 1),
                        ponderIdx: 0,
                        qIdx: 0,
                        lessonsVerseIdx: null,
                        writeActions: [""],
                        title: "",
                    });
                    setVersesLoading(false);
                    setView("listen");
                }, [sessionInProgress, showToast]);

                const startNewSession = useCallback(() => {
                    if (sessionInProgress) return;
                    const hasUnlearned =
                        DB.getLearningSittingId() && !DB.hasLearnedAllVerses();
                    if (hasUnlearned) {
                        setConfirm({
                            eyebrow: "Have you learned your verses?",
                            message:
                                "You have not yet memorised all 5 verses from your last sitting. Are you sure you want to begin a new sitting before completing them?",
                            onConfirm: () => {
                                setConfirm(null);
                                doStartNewSession();
                            },
                            onCancel: () => setConfirm(null),
                        });
                        return;
                    }
                    doStartNewSession();
                }, [sessionInProgress, doStartNewSession]);

                const replaySitting = useCallback(
                    async (sitting, fromSubView) => {
                        if (sessionInProgress) return;
                        const verseKeys = sitting.verseKeys || [];
                        if (!verseKeys.length) {
                            showToast("Nothing to replay", "");
                            return;
                        }
                        setReturnSubView(fromSubView || null);
                        setVersesLoading(true);
                        try {
                            const verses = await Promise.all(
                                verseKeys.map((k) => fetchVerseDetails(k)),
                            );
                            verses.forEach((v) => {
                                verseCacheRef.current[v.key] = v;
                            });
                            bumpCache();
                            const first = parseKey(verseKeys[0]);
                            let surahInfo = await fetchSurahInfo(first.surah);
                            if (!surahInfo)
                                surahInfo = { name: "", verses_count: 999 };
                            // Pre-fill old resolutions
                            const oldActions = DB.getActionsSorted().filter(
                                (a) => a.sessionId === sitting.id,
                            );
                            const prefillActions =
                                oldActions.length > 0
                                    ? oldActions.map((a) => a.text || "")
                                    : [""];
                            // Pre-fill old title
                            const prefillTitle = sitting.title || "";
                            DB.replaceCurrentSession({
                                id: uuid(),
                                startedAt: Date.now(),
                                surah: first.surah,
                                surahName: surahInfo.name,
                                surahVersesCount: surahInfo.verses_count,
                                verseKeys,
                                completedSteps: 0,
                                listenIdx: 0,
                                listenReached: 0,
                                selectedEndIdx: Math.min(
                                    4,
                                    verseKeys.length - 1,
                                ),
                                ponderIdx: 0,
                                qIdx: 0,
                                lessonsVerseIdx: null,
                                writeActions: prefillActions,
                                title: prefillTitle,
                                isReplay: true,
                                replaySittingId: sitting.id,
                            });
                            setVersesLoading(false);
                            setView("listen");
                        } catch (e) {
                            setVersesLoading(false);
                            showToast("Failed to load sitting", "");
                        }
                    },
                    [sessionInProgress, showToast],
                );

                /* continue an existing session by entering its current step */
                const enterCurrentStep = useCallback(() => {
                    if (!cs) return;
                    const stepId = STEPS[cs.completedSteps]?.id;
                    if (stepId) setView(stepId);
                }, [cs]);

                /* enter a completed step (revisit) */
                const revisitStep = useCallback(
                    (stepIdx) => {
                        if (!cs) return;
                        if (stepIdx >= cs.completedSteps) return;
                        setView(STEPS[stepIdx].id);
                    },
                    [cs],
                );

                /* mark a step complete and return to home */
                const completeStep = useCallback(
                    (stepIdx, nextView) => {
                        if (!cs) return;
                        const next = Math.max(cs.completedSteps, stepIdx + 1);
                        DB.setCurrentSessionField("completedSteps", next);
                        setView(nextView || "home");
                    },
                    [cs],
                );

                /* save Write step → save actions → ask for title */
                const submitWrite = useCallback((writeActions) => {
                    DB.setCurrentSessionField("writeActions", writeActions);
                    DB.setCurrentSessionField("completedSteps", 5);
                    setView("title");
                }, []);

                /* finalize session with a title */
                const finalizeSession = useCallback(
                    (title) => {
                        if (!cs) return;
                        const finalTitle = (title || "").trim() || "A sitting";
                        const today = todayStr();
                        const ponderedKeys = cs.verseKeys.slice(
                            0,
                            (cs.selectedEndIdx ?? 0) + 1,
                        );

                        if (cs.isReplay && cs.replaySittingId) {
                            const newActionIds = [];
                            (cs.writeActions || [])
                                .map((s) => s.trim())
                                .filter(Boolean)
                                .forEach((txt) => {
                                    newActionIds.push(
                                        DB.addAction(txt, cs.replaySittingId),
                                    );
                                });
                            DB.updateSessionTitle(
                                cs.replaySittingId,
                                finalTitle,
                            );

                            const arr = DB.sessions.toArray();
                            const sIdx = arr.findIndex(
                                (s) => s.id === cs.replaySittingId,
                            );
                            const existing = DB.getActionsSorted().filter(
                                (a) => a.sessionId === cs.replaySittingId,
                            );
                            const existingIds = existing.map((a) => a.id);
                            const finalActionIds = [
                                ...new Set([...existingIds, ...newActionIds]),
                            ];
                            if (sIdx >= 0) {
                                window.YDOC.transact(() => {
                                    DB.sessions.delete(sIdx, 1);
                                    DB.sessions.insert(sIdx, [
                                        {
                                            id: cs.replaySittingId,
                                            title: finalTitle,
                                            date: today,
                                            verseKeys: cs.verseKeys,
                                            ponderedKeys,
                                            actionIds: finalActionIds,
                                        },
                                    ]);
                                });
                            }

                            DB.setLastSessionDate(today);
                            DB.clearCurrentSession();
                            setView("home");
                            return;
                        }

                        // Normal: finalize session with a title
                        const actionIds = [];
                        (cs.writeActions || [])
                            .map((s) => s.trim())
                            .filter(Boolean)
                            .forEach((txt) => {
                                actionIds.push(DB.addAction(txt, cs.id));
                            });
                        const lastKey = ponderedKeys[ponderedKeys.length - 1];
                        const { surah: lastS, verse: lastV } =
                            parseKey(lastKey);
                        DB.addSession({
                            id: cs.id,
                            title: finalTitle,
                            date: today,
                            verseKeys: cs.verseKeys,
                            ponderedKeys,
                            actionIds,
                        });
                        DB.setLastPondered(lastS, lastV);
                        DB.setLastSessionDate(today);
                        DB.timetableEnsurePrayers();
                        if (DB.getLearningEnabled()) {
                            DB.setLearningSitting(cs.id);
                            DB.setLearnedVerseKeys([]);
                            DB.timetableEnsureLearningBlock();
                        }
                        DB.clearCurrentSession();
                        setView("home");
                    },
                    [cs],
                );

                /* back from a step to home (or to subView if came from subscreen) */
                const goHome = useCallback(() => {
                    if (returnSubView) {
                        setSubView(returnSubView);
                        setReturnSubView(null);
                    } else {
                        setView("home");
                    }
                }, [returnSubView]);

                /* abandon current session — not exposed in UI by default */

                /* style vars */
                const styleVars = {
                    "--bg": theme.bg,
                    "--bg-soft": theme.bgSoft,
                    "--ink": theme.ink,
                    "--ink-soft": theme.inkSoft,
                    "--ink-faint": theme.inkFaint,
                    "--accent": theme.accent,
                    "--accent-soft": theme.accentSoft,
                };
                const fullscreen = view !== "home" || !!subView;

                /* current verse details from cache */
                const getVerse = useCallback(
                    (idx) => {
                        if (!cs?.verseKeys?.[idx]) return null;
                        return verseCacheRef.current[cs.verseKeys[idx]] || null;
                    },
                    [cs?.verseKeys, verseCacheVersion],
                );
                const sessionVerses = useMemo(() => {
                    if (!cs?.verseKeys) return [];
                    return cs.verseKeys.map(
                        (k) => verseCacheRef.current[k] || { key: k },
                    );
                }, [cs?.verseKeys, verseCacheVersion]);

                return (
                    <div
                        className="v-root orbit-root"
                        style={styleVars}
                        data-fullscreen={fullscreen}
                        data-theme={theme.id}
                    >
                        <PlasmaLayer />
                        <OrbitBackdrop />

                        {/* Settings button — only on home */}
                        {view === "home" &&
                            !subView &&
                            !showIntro &&
                            !showSettings && (
                                <SettingsButton
                                    onClick={() => setShowSettings(true)}
                                />
                            )}

                        {view === "home" && !subView && (
                            <HomeView
                                DB={DB}
                                cs={cs}
                                dailyDoneToday={dailyDoneToday}
                                versesLoading={versesLoading}
                                startNewSession={startNewSession}
                                enterCurrentStep={enterCurrentStep}
                                revisitStep={revisitStep}
                                openSection={(key) => setSubView(key)}
                                openHelp={(key) => setHelpKey(key)}
                                themeIdx={themeIdx}
                                setTheme={setTheme}
                                homeTab={homeTab}
                                setHomeTab={setHomeTab}
                                setView={setView}
                                verseCacheRef={verseCacheRef}
                            />
                        )}

                        {view === "listen" && cs && (
                            <ListenStep
                                cs={cs}
                                DB={DB}
                                verses={sessionVerses}
                                versesLoading={versesLoading}
                                onBack={goHome}
                                onContinue={() => completeStep(0, "ponder")}
                                openTafsir={openTafsir}
                            />
                        )}

                        {view === "ponder" && cs && (
                            <PonderStep
                                cs={cs}
                                DB={DB}
                                verses={sessionVerses}
                                onBack={goHome}
                                onContinue={() => completeStep(1)}
                                openTafsir={openTafsir}
                                showToast={showToast}
                            />
                        )}

                        {view === "questions" && cs && (
                            <QuestionsStep
                                cs={cs}
                                DB={DB}
                                verses={sessionVerses}
                                onBack={goHome}
                                onComplete={() => completeStep(2)}
                                openTafsir={openTafsir}
                                showToast={showToast}
                            />
                        )}

                        {view === "lessons" && cs && (
                            <LessonsStep
                                cs={cs}
                                DB={DB}
                                verses={sessionVerses}
                                onBack={goHome}
                                onContinue={() => completeStep(3, "write")}
                                showToast={showToast}
                            />
                        )}

                        {view === "write" && cs && (
                            <WriteStep
                                cs={cs}
                                DB={DB}
                                onBack={goHome}
                                onSave={submitWrite}
                            />
                        )}

                        {view === "title" && cs && (
                            <TitleStep cs={cs} onSubmit={finalizeSession} />
                        )}

                        {view === "memorize" && (
                            <MemorizeStep
                                DB={DB}
                                verseCacheRef={verseCacheRef}
                                openTafsir={openTafsir}
                                onBack={() => {
                                    setView("home");
                                    setHomeTab("dashboard");
                                }}
                                showToast={showToast}
                                setConfirm={setConfirm}
                            />
                        )}

                        {subView && (
                            <SubsectionRouter
                                subView={subView}
                                DB={DB}
                                onClose={() => setSubView(null)}
                                openHelp={(key) => setHelpKey(key)}
                                onReplaySitting={replaySitting}
                            />
                        )}

                        {/* Intro overlay */}
                        {showIntro && (
                            <IntroOverlay
                                DB={DB}
                                onDismiss={() => setShowIntro(false)}
                            />
                        )}

                        {/* Settings modal */}
                        {showSettings && (
                            <SettingsModal
                                DB={DB}
                                onClose={() => setShowSettings(false)}
                            />
                        )}

                        {tafsirOpen && !showIntro && (
                            <TafsirSheet
                                tafsirText={tafsirText}
                                loading={tafsirLoading}
                                verseKey={tafsirVerseKey}
                                onClose={() => setTafsirOpen(false)}
                            />
                        )}

                        {helpKey && (
                            <HelpModal
                                help={window.HELP_TEXTS[helpKey]}
                                onClose={() => setHelpKey(null)}
                            />
                        )}

                        {toast && <Toast {...toast} />}
                        {confirm && <ConfirmModal {...confirm} />}

                        <OrbitThemePicker
                            themeIdx={themeIdx}
                            setThemeIdx={setTheme}
                        />
                    </div>
                );
            }

            /* ─────────── PLASMA ─────────── */
            function PlasmaLayer() {
                return (
                    <div className="plasma-layer" aria-hidden>
                        <div className="plasma-blob a" />
                        <div className="plasma-blob b" />
                        <div className="plasma-blob c" />
                    </div>
                );
            }

            /* ─────────── STARS (bigger variety, some luminous) ─────────── */
            function OrbitBackdrop() {
                const stars = useMemo(() => {
                    return Array.from({ length: 110 }, (_, i) => {
                        const lum = i % 5 === 0; // ~20% are luminous & bigger
                        const baseSize = lum
                            ? 1.6 + ((i * 13) % 11) / 7 // 1.6 – 3.2px
                            : 0.5 + ((i * 17) % 8) / 6; // 0.5 – 1.8px
                        return {
                            x: (i * 37 + ((i * i * 7) % 31)) % 100,
                            y: (i * 53 + ((i * i * 3) % 41)) % 100,
                            s: baseSize,
                            lum,
                            lo: lum
                                ? 0.35 + ((i * 7) % 4) / 18
                                : 0.08 + ((i * 7) % 4) / 18,
                            hi: lum
                                ? 0.85 + ((i * 11) % 4) / 25
                                : 0.35 + ((i * 11) % 6) / 18,
                            dur: 4 + (i % 11) * 0.7,
                            delay: (i % 13) * 0.5,
                        };
                    });
                }, []);
                return (
                    <div className="orbit-backdrop" aria-hidden>
                        {stars.map((s, i) => (
                            <span
                                key={i}
                                data-lum={s.lum ? "1" : "0"}
                                style={{
                                    left: `${s.x}%`,
                                    top: `${s.y}%`,
                                    width: `${s.s}px`,
                                    height: `${s.s}px`,
                                    "--star-lo": s.lo,
                                    "--star-hi": s.hi,
                                    "--star-dur": `${s.dur}s`,
                                    animationDelay: `${s.delay}s`,
                                }}
                            />
                        ))}
                        <div className="orbit-glow" />
                    </div>
                );
            }

            /* ─────────── HOME ─────────── */
            function HomeView({
                DB,
                cs,
                dailyDoneToday,
                versesLoading,
                startNewSession,
                enterCurrentStep,
                revisitStep,
                openSection,
                openHelp,
                themeIdx,
                setTheme,
                homeTab,
                setHomeTab,
                setView,
                verseCacheRef,
            }) {
                if (homeTab === "dashboard") {
                    return (
                        <div className="home-scroll">
                            {/* Top-left button completely removed from Dashboard */}
                            <Dashboard
                                DB={DB}
                                openSection={openSection}
                                openHelp={openHelp}
                                dailyDoneToday={dailyDoneToday}
                                setHomeTab={setHomeTab}
                                setView={setView}
                                verseCacheRef={verseCacheRef}
                                cs={cs}
                            />
                        </div>
                    );
                }

                return (
                    <div className="home-scroll">
                        {/* Grid icon remains here so you can go back to Dashboard from the Sitting view */}
                        <button
                            className="settings-btn"
                            style={{ right: "auto", left: "16px" }}
                            onClick={() => setHomeTab("dashboard")}
                            aria-label="Go to dashboard"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="1.5"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                            >
                                <rect x="3" y="3" width="7" height="7" rx="1" />
                                <rect
                                    x="14"
                                    y="3"
                                    width="7"
                                    height="7"
                                    rx="1"
                                />
                                <rect
                                    x="14"
                                    y="14"
                                    width="7"
                                    height="7"
                                    rx="1"
                                />
                                <rect
                                    x="3"
                                    y="14"
                                    width="7"
                                    height="7"
                                    rx="1"
                                />
                            </svg>
                        </button>
                        <div className="home-center">
                            <InSessionCenter
                                cs={cs}
                                dailyDoneToday={dailyDoneToday}
                                versesLoading={versesLoading}
                                startNewSession={startNewSession}
                                enterCurrentStep={enterCurrentStep}
                                revisitStep={revisitStep}
                            />
                        </div>
                    </div>
                );
            }

            function InSessionCenter({
                cs,
                dailyDoneToday,
                versesLoading,
                startNewSession,
                enterCurrentStep,
                revisitStep,
            }) {
                const [t, setT] = useState(countdownToMidnight);
                useEffect(() => {
                    if (!dailyDoneToday) return;
                    const i = setInterval(
                        () => setT(countdownToMidnight()),
                        1000,
                    );
                    return () => clearInterval(i);
                }, [dailyDoneToday]);

                const completedCount = cs?.completedSteps ?? 0;
                const completedSteps = STEPS.slice(0, completedCount);
                const isStarting = !cs;
                const nextStep = STEPS[completedCount];
                const label = isStarting
                    ? "Listen"
                    : nextStep
                      ? nextStep.label
                      : "Listen";
                const ready = t.h === 0 && t.m === 0 && t.s === 0;

                const onClick = () => {
                    if (versesLoading) return;
                    if (isStarting) {
                        if (dailyDoneToday && !ready) return;
                        startNewSession();
                    } else {
                        enterCurrentStep();
                    }
                };

                if (isStarting && dailyDoneToday && !ready) {
                    return (
                        <div className="center-hub-button-wrap">
                            <button
                                className="center-button"
                                data-locked="true"
                                onClick={onClick}
                            >
                                <div className="center-button-lock">
                                    <svg viewBox="0 0 24 24">
                                        <rect
                                            x="5"
                                            y="11"
                                            width="14"
                                            height="9"
                                            rx="2"
                                        />
                                        <path d="M8 11V8a4 4 0 018 0v3" />
                                    </svg>
                                </div>
                                <div className="center-button-countdown">
                                    <div className="center-button-countdown-time">
                                        {pad2(t.h)}:{pad2(t.m)}:{pad2(t.s)}
                                    </div>
                                    <div className="center-button-countdown-label">
                                        Next sitting
                                    </div>
                                </div>
                            </button>
                        </div>
                    );
                }

                return (
                    <>
                        <div className="center-pills">
                            {completedSteps.map((s, i) => (
                                <button
                                    key={s.id}
                                    className="center-pill"
                                    onClick={() => revisitStep(i)}
                                >
                                    <span className="center-pill-dot" />
                                    <span>{s.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="center-hub-button-wrap">
                            <button
                                className="center-button"
                                onClick={onClick}
                                aria-label={`Begin ${label}`}
                                disabled={versesLoading}
                            >
                                <span className="center-button-label">
                                    {versesLoading ? (
                                        <span className="loading-dots">
                                            <span />
                                            <span />
                                            <span />
                                        </span>
                                    ) : (
                                        label
                                    )}
                                </span>
                            </button>
                        </div>
                    </>
                );
            }

            /* ─────────── DASHBOARD (card grid) ─────────── */

                                            className={`dash-card-preview ${c.empty ? "empty" : ""}`}

                                            <div

                                                    setView("memorize")

                                    <div
                                        key={c.key}

                                        onClick={() => openSection(c.key)}
                                    >
                                        {c.helpKey && (
                                            <button
                                                className="dash-card-help"
                                                onClick={(e) => {
                                                    e.stopPropagation();

                                            {c.title}

                                        </div>
                                    </div>

            }
            /* ─────────── SETTINGS BUTTON ─────────── */

                                        "We learned sacred knowledge and action

            /* ─────────── SETTINGS MODAL ─────────── */
            function SettingsModal({ DB, onClose }) {
                useYjsTick();
                const [questions, setQuestions] = useState(() =>
                    DB.getQuestions(),
                );
                const langCode = DB.getLangCode();
                const translationId = DB.getTranslationId();
                const tafsirId = DB.getTafsirId();
                const recitationId = DB.getRecitationId();
                const [showDeleteConfirm, setShowDeleteConfirm] =
                    useState(false);
                const [fileMessage, setFileMessage] = useState(null);

                const handleLangChange = (code) => {
                    const l = window.LANGUAGES.find((x) => x.code === code);
                    if (!l) return;
                    DB.setLangCode(code);
                    DB.setTranslationId(l.translationId);
                    DB.setTafsirId(l.tafsirId);
                    DB.setRecitationId(l.recitationId);
                };

                const handleExport = () => {
                    try {
                        const json = exportDbJSON();
                        const blob = new Blob([json], {
                            type: "application/json",
                        });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `miran-backup-${todayStr()}.json`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setFileMessage({
                            type: "ok",
                            text: "Database exported.",
                        });
                        setTimeout(() => setFileMessage(null), 2400);
                    } catch (e) {
                        setFileMessage({ type: "err", text: "Export failed." });
                        setTimeout(() => setFileMessage(null), 2400);
                    }
                };

                const handleImportClick = () => {
                    const input = document.createElement("input");
                    input.type = "file";
                    input.accept = ".json";
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = () => {
                            try {
                                importDbJSON(reader.result, DB);
                                setFileMessage({
                                    type: "ok",
                                    text: "Database imported.",
                                });
                                setTimeout(() => setFileMessage(null), 2400);
                            } catch (err) {
                                setFileMessage({
                                    type: "err",
                                    text: "Invalid file.",
                                });
                                setTimeout(() => setFileMessage(null), 2400);
                            }
                        };
                        reader.readAsText(file);
                    };
                    input.click();
                };

                const handleDeleteAll = () => {
                    deleteAllData(DB);
                    setShowDeleteConfirm(false);
                    setFileMessage({ type: "ok", text: "All data deleted." });
                    setTimeout(() => setFileMessage(null), 2400);
                };

                return (
                    <div className="settings-backdrop" onClick={onClose}>
                        <div
                            className="settings-panel"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="sett-header">
                                <div className="sett-title">Settings</div>
                                <button
                                    className="sett-close"
                                    onClick={onClose}
                                    aria-label="Close"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M6 6l12 12M18 6L6 18" />
                                    </svg>
                                </button>
                            </div>

                            <div className="sett-section">
                                <div className="sett-section-label">
                                    Language
                                </div>
                                <div className="sett-row">
                                    <span className="sett-row-label">
                                        Translation
                                    </span>
                                    <select
                                        className="sett-select"
                                        value={langCode}
                                        onChange={(e) =>
                                            handleLangChange(e.target.value)
                                        }
                                    >
                                        {window.LANGUAGES.map((l) => (
                                            <option key={l.code} value={l.code}>
                                                {l.label}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div className="sett-row">
                                    <span className="sett-row-label">
                                        Tafsir
                                    </span>
                                    <span
                                        className="sett-row-label"
                                        style={{
                                            textAlign: "right",
                                            opacity: 0.65,
                                            fontSize: 12,
                                        }}
                                    >
                                        {window.LANGUAGES.find(
                                            (l) => l.code === langCode,
                                        )?.tafsirName || "Maʿārif al-Qurʾān"}
                                    </span>
                                </div>
                            </div>

                            <div className="sett-section">
                                <div className="sett-section-label">Theme</div>
                                <div className="sett-theme-row">
                                    {window.THEMES.map((t, i) => (
                                        <button
                                            key={t.id}
                                            className={`sett-theme-dot ${i === DB.getTheme() ? "active" : ""}`}
                                            style={{ background: t.ring }}
                                            onClick={() => DB.setTheme(i)}
                                            title={t.name}
                                            aria-label={`${t.name} theme`}
                                        />
                                    ))}
                                </div>
                            </div>
                            <div className="sett-section">
                                <div className="sett-section-label">Qur’an</div>
                                <div className="sett-row">
                                    <span className="sett-row-label">
                                        Memorisation mode
                                    </span>

            /* ─────────── shared back & help buttons ─────────── */
            function BackButton({ onClick }) {
                return (

            function HelpButton({ onClick }) {

            /* ─────────── VERSE BODY (shared) ─────────── */
            function VerseBody({ verse, loading }) {
                const arabicRef = useRef(null);
                const transRef = useRef(null);
                useEffect(() => {
                    const check = (el) => {
                        if (!el) return;
                        el.dataset.overflowing =
                            el.scrollHeight > el.clientHeight + 2
                                ? "true"
                                : "false";
                    };
                    const a = arabicRef.current,
                        t = transRef.current;
                    check(a);
                    check(t);
                    const obs = [];
                    [a, t].forEach((el) => {
                        if (!el || typeof ResizeObserver === "undefined")
                            return;
                        const ro = new ResizeObserver(() => check(el));
                        ro.observe(el);
                        if (el.firstChild) ro.observe(el.firstChild);
                        obs.push(ro);
                    });
                    const onR = () => {
                        check(a);
                        check(t);
                    };
                    window.addEventListener("resize", onR);
                    return () => {
                        obs.forEach((o) => o.disconnect());
                        window.removeEventListener("resize", onR);
                    };
                }, [verse?.arabic, verse?.translation]);
                return (
                    <div className="step-fs-body">
                        <div className="verse-fs-arabic-wrap" ref={arabicRef}>
                            {verse?.arabic ? (
                                <div className="verse-fs-arabic arabic-font">
                                    {verse.arabic}
                                </div>
                            ) : (
                                <div className="verse-skeleton">···</div>
                            )}
                        </div>
                        <div
                            className="verse-fs-translation-wrap"
                            ref={transRef}
                        >
                            <div className="verse-fs-translation">
                                {verse?.translation ||
                                    (loading ? (
                                        <span className="loading-dots">
                                            <span />
                                            <span />
                                            <span />
                                        </span>
                                    ) : (
                                        ""
                                    ))}
                            </div>
                        </div>
                    </div>
                );
            }

            /* Verse position dots (used by Listen / Ponder) */
            function VersePositionIndicator({ idx, total, reachedIdx }) {
                return (
                    <div className="verse-position">
                        <span>

                        </span>
                        <div className="verse-position-dots">
                            {Array.from({ length: total }).map((_, i) => (
                                <div
                                    key={i}
                                    className={`verse-position-dot ${i === idx ? "active" : i < (reachedIdx ?? idx) ? "done" : ""}`}
                                />
                            ))}
                        </div>
                    </div>
                );
            }

            /* ─────────── LISTEN STEP (multi-verse) ─────────── */
            function ListenStep({
                cs,
                DB,
                verses,
                versesLoading,
                onBack,
                onContinue,
                openTafsir,
            }) {
                const total = verses.length;
                const [idx, setIdx] = useState(cs.listenIdx ?? 0);
                const [reachedIdx, setReachedIdx] = useState(
                    cs.listenReached ?? 0,
                );
                useEffect(() => {
                    DB.setCurrentSessionField("listenIdx", idx);
                }, [idx]);
                useEffect(() => {
                    DB.setCurrentSessionField("listenReached", reachedIdx);
                }, [reachedIdx]);

                const verse = verses[idx];
                const audioRef = useRef(null);
                const autoPlayNextRef = useRef(false);
                const [audioState, setAudioState] = useState({
                    playing: false,
                    finished: false,
                    current: 0,
                    duration: 0,
                });

                // Set up audio for current verse
                useEffect(() => {
                    if (!verse?.audioUrl) {
                        if (audioRef.current) {
                            audioRef.current.pause();
                            audioRef.current = null;
                        }
                        setAudioState({
                            playing: false,
                            finished: false,
                            current: 0,
                            duration: 0,
                        });
                        return;
                    }
                    const a = new Audio(verse.audioUrl);
                    a.preload = "auto";
                    audioRef.current = a;

                    const onPlay = () =>
                        setAudioState((s) => ({
                            ...s,
                            playing: true,
                            finished: false,
                        }));
                    const onPause = () => {
                        setAudioState((s) => ({ ...s, playing: false }));
                    };
                    const onEnded = () => {
                        setAudioState((s) => ({
                            ...s,
                            playing: false,
                            finished: true,
                        }));
                        if (idx < total - 1) {
                            autoPlayNextRef.current = true;
                            setIdx((i) => i + 1);
                            setReachedIdx((r) => Math.max(r, idx + 1));
                        } else {
                            setReachedIdx(total - 1);
                        }
                    };
                    const onTime = () =>
                        setAudioState((s) => ({
                            ...s,
                            current: a.currentTime,
                            duration: a.duration || s.duration,
                        }));
                    const onMeta = () =>
                        setAudioState((s) => ({
                            ...s,
                            duration: a.duration || 0,
                        }));
                    a.addEventListener("play", onPlay);
                    a.addEventListener("pause", onPause);
                    a.addEventListener("ended", onEnded);
                    a.addEventListener("timeupdate", onTime);
                    a.addEventListener("loadedmetadata", onMeta);

                    // Audio paused by default; user must press play

                    return () => {
                        a.pause();
                        a.removeEventListener("play", onPlay);
                        a.removeEventListener("pause", onPause);
                        a.removeEventListener("ended", onEnded);
                        a.removeEventListener("timeupdate", onTime);
                        a.removeEventListener("loadedmetadata", onMeta);
                    };
                }, [verse?.audioUrl, idx, total]);

                const togglePlay = useCallback(() => {
                    const a = audioRef.current;
                    if (!a) return;
                    if (!audioState.playing) {
                        autoPlayNextRef.current = true;
                        a.play().catch(() => {});
                    } else {
                        autoPlayNextRef.current = false;
                        a.pause();
                    }
                }, [audioState.playing]);
                const replayCurrent = useCallback(() => {
                    const a = audioRef.current;
                    if (!a) return;
                    a.currentTime = 0;
                    autoPlayNextRef.current = true;
                    a.play().catch(() => {});
                }, []);
                const goPrev = useCallback(() => {
                    if (idx <= 0) return;
                    if (audioRef.current) audioRef.current.pause();
                    autoPlayNextRef.current = false; // don't auto-play when manually navigating
                    setIdx((i) => i - 1);
                }, [idx]);
                const goNext = useCallback(() => {
                    if (idx >= total - 1) return;
                    if (audioRef.current) audioRef.current.pause();
                    autoPlayNextRef.current = false; // don't auto-play when manually navigating
                    setIdx((i) => i + 1);
                    setReachedIdx((r) => Math.max(r, idx + 1));
                }, [idx, total]);
                const repeatAll = useCallback(() => {
                    setIdx(0);
                    setReachedIdx(0);
                    autoPlayNextRef.current = true;
                    setTimeout(() => {
                        if (audioRef.current) {
                            audioRef.current.currentTime = 0;
                            audioRef.current.play().catch(() => {});
                        }
                    }, 200);
                }, []);

                const playing = audioState.playing;
                const atEnd = reachedIdx >= total - 1;
                const surahRef = `Surah ${cs.surahName} · ${cs.surah}:${verse?.verse ?? "—"}`;

                return (
                    <div className={`step-fs ${playing ? "playing" : ""}`}>
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Listen</div>
                            <VersePositionIndicator
                                idx={idx}
                                total={total}
                                reachedIdx={reachedIdx}
                            />
                            <div className="step-fs-ref">{surahRef}</div>
                        </div>
                        <VerseBody verse={verse} loading={versesLoading} />
                        <div className="step-fs-bottom">
                            <div className="verse-fs-audio">
                                <div className="verse-nav">
                                    <button
                                        className="verse-nav-arrow"
                                        onClick={goPrev}
                                        disabled={idx <= 0}
                                        aria-label="Previous verse"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M15 6l-6 6 6 6" />
                                        </svg>
                                    </button>
                                    <button
                                        className="player-btn"
                                        onClick={togglePlay}
                                        disabled={!verse?.audioUrl}
                                        aria-label={playing ? "Pause" : "Play"}
                                    >
                                        {playing ? (
                                            <svg viewBox="0 0 24 24">
                                                <rect
                                                    x="7"
                                                    y="5"
                                                    width="3.5"
                                                    height="14"
                                                    rx="1"
                                                />
                                                <rect
                                                    x="13.5"
                                                    y="5"
                                                    width="3.5"
                                                    height="14"
                                                    rx="1"
                                                />
                                            </svg>
                                        ) : (
                                            <svg viewBox="0 0 24 24">
                                                <path d="M8 5v14l11-7z" />
                                            </svg>
                                        )}
                                    </button>
                                    <button
                                        className="verse-nav-arrow"
                                        onClick={goNext}
                                        disabled={idx >= total - 1}
                                        aria-label="Next verse"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M9 6l6 6-6 6" />
                                        </svg>
                                    </button>
                                </div>
                                <div className="verse-fs-meta">
                                    <span className="reciter">
                                        {window.RECITER_NAME}
                                    </span>
                                    {verse?.audioUrl && (
                                        <>
                                            <span className="sep">·</span>
                                            <span>
                                                {formatTime(audioState.current)}{" "}
                                                /{" "}
                                                {formatTime(
                                                    audioState.duration,
                                                )}
                                            </span>
                                        </>
                                    )}
                                </div>
                            </div>
                            <div className="verse-fs-actions">
                                <button
                                    className="action-soft"
                                    onClick={replayCurrent}
                                    disabled={!verse?.audioUrl}
                                >
                                    Repeat verse
                                </button>
                                <button
                                    className="action-soft"
                                    onClick={() => openTafsir(verse.key)}
                                    disabled={!verse?.key}
                                >
                                    Tafsir
                                </button>
                                {atEnd && (
                                    <button
                                        className="action-soft"
                                        onClick={repeatAll}
                                    >
                                        Repeat all
                                    </button>
                                )}
                                {atEnd && (
                                    <button
                                        className="action"
                                        onClick={onContinue}
                                    >
                                        <span className="action-text">
                                            Continue
                                        </span>
                                        <span className="action-line" />
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── PONDER STEP (multi-verse, no audio, n/2 min timer, tafsir) ─────────── */
            function PonderStep({
                cs,
                DB,
                verses,
                onBack,
                onContinue,
                openTafsir,
                showToast,
            }) {
                const selectedCount = (cs.selectedEndIdx ?? 0) + 1;
                const total = selectedCount;
                const [idx, setIdx] = useState(
                    Math.min(cs.ponderIdx ?? 0, total - 1),
                );
                useEffect(() => {
                    DB.setCurrentSessionField("ponderIdx", idx);
                }, [idx]);

                const totalSeconds = Math.max(30, (selectedCount / 2) * 60);
                const startedAtRef = useRef(
                    Date.now() - (cs.ponderElapsedMs || 0),
                );
                const [remaining, setRemaining] = useState(() => {
                    const elapsed = (Date.now() - startedAtRef.current) / 1000;
                    return Math.max(0, totalSeconds - elapsed);
                });
                useEffect(() => {
                    const t = setInterval(() => {
                        const elapsed =
                            (Date.now() - startedAtRef.current) / 1000;
                        const rem = Math.max(0, totalSeconds - elapsed);
                        setRemaining(rem);
                        DB.setCurrentSessionField(
                            "ponderElapsedMs",
                            Math.floor(elapsed * 1000),
                        );
                        if (rem <= 0) clearInterval(t);
                    }, 500);
                    return () => clearInterval(t);
                }, [totalSeconds]);

                const ready = remaining <= 0;
                const verse = verses[idx];
                const tryContinue = () => {
                    if (!ready) {
                        showToast("Sit a little longer", formatTime(remaining));
                        return;
                    }
                    onContinue();
                };

                return (
                    <div className="step-fs">
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Ponder</div>
                            <VersePositionIndicator
                                idx={idx}
                                total={total}
                                reachedIdx={total - 1}
                            />
                            <div className="step-fs-ref">
                                Surah {cs.surahName} · {cs.surah}:
                                {verse?.verse ?? "—"}
                            </div>
                        </div>
                        <VerseBody verse={verse} />
                        <div className="step-fs-bottom">
                            <div className="verse-nav">
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() =>
                                        setIdx((i) => Math.max(0, i - 1))
                                    }
                                    disabled={idx <= 0}
                                    aria-label="Previous verse"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M15 6l-6 6 6 6" />
                                    </svg>
                                </button>
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() =>
                                        setIdx((i) =>
                                            Math.min(total - 1, i + 1),
                                        )
                                    }
                                    disabled={idx >= total - 1}
                                    aria-label="Next verse"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 6l6 6-6 6" />
                                    </svg>
                                </button>
                            </div>
                            <div className="ponder-instruction">
                                {selectedCount === 1
                                    ? "Sit with this verse."
                                    : `Sit with these ${selectedCount} verses.`}{" "}
                                Disconnect from the world. Let the words settle
                                in your heart and expose your reality.{" "}
                                {Math.ceil(selectedCount / 2)} minute
                                {selectedCount > 2 ? "s" : ""} — no less.
                            </div>
                            <div className="verse-fs-actions">
                                <button
                                    className="action-soft"
                                    onClick={() => openTafsir(verse.key)}
                                    disabled={!verse?.key}
                                >
                                    Tafsir
                                </button>
                                <button
                                    className="action"
                                    data-blocked={!ready}
                                    onClick={tryContinue}
                                >
                                    <span className="action-text">
                                        Continue
                                    </span>
                                    <span className="action-line" />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── QUESTIONS STEP (like Ponder) ─────────── */
            /* ─────────── QUESTIONS STEP (like Ponder) ─────────── */
            function QuestionsStep({
                cs,
                DB,

                onBack,
                onComplete,
                openTafsir,
                showToast,
