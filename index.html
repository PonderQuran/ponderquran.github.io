                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.4em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.78;
                margin-top: 12px;
            }

            .sub-textarea {
                width: 100%;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 30%, transparent);
                border-radius: 14px;
                background: color-mix(in oklab, var(--bg-soft) 50%, var(--bg));
                color: var(--ink);
                font-family: "Cormorant Garamond", serif;
                font-size: 15px;
                line-height: 1.65;
                padding: 16px 18px;
                resize: vertical;
                min-height: 140px;
                outline: none;
                transition: border-color 300ms;
            }
            .sub-textarea:focus {
                border-color: var(--accent);
                box-shadow: 0 0 16px
                    color-mix(in oklab, var(--accent) 14%, transparent);
            }
            .sub-textarea::placeholder {
                color: var(--ink-soft);
                opacity: 0.55;
                font-style: italic;
            }

            .sub-textfield {
                width: 100%;
                border: none;
                border-bottom: 1px solid
                    color-mix(in oklab, var(--accent) 22%, transparent);
                background: transparent;
                color: var(--ink);
                font-family: "Cormorant Garamond", serif;
                font-size: 15px;
                padding: 10px 2px;
                outline: none;
                transition: border-color 300ms;
            }
            .sub-textfield:focus {
                border-color: var(--accent);
            }
            .sub-textfield::placeholder {
                color: var(--ink-faint);
                opacity: 0.55;
                font-style: italic;
            }

            .sub-counter {
                display: flex;
                justify-content: flex-end;
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.2em;
                color: var(--ink-faint);
                font-variant-numeric: tabular-nums;
                margin-top: -8px;
            }
            .sub-counter.over {
                color: #e07070;
            }

            /* Goal field */
            .goal-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 8px 0;
            }
            .goal-field-label {
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.35em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.72;
            }
            .goal-field-pinned {
                padding: 14px 16px;
                border-radius: 12px;
                background: color-mix(in oklab, var(--accent) 8%, transparent);
                border: 1px solid
                    color-mix(in oklab, var(--accent) 25%, transparent);
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 16px;
                color: var(--ink);
                line-height: 1.5;
            }
            .goal-field-pinned-label {
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.4em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.85;
                margin-bottom: 6px;
                font-style: normal;
            }

            /* Timetable */
            .tt-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
                width: 100%;
            }
            .tt-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 11px 14px;
                border-radius: 12px;
                background: color-mix(in oklab, var(--bg-soft) 45%, var(--bg));
                border: 1px solid color-mix(in oklab, var(--accent) 16%, transparent);
                transition: all 200ms ease;
                min-height: 44px;
            }
            .tt-row[data-done="true"] {
                opacity: 0.35;
                border-color: color-mix(in oklab, var(--accent) 6%, transparent);
            }
            .tt-row[data-done="true"] .tt-label {
                text-decoration: line-through;
                text-decoration-color: color-mix(in oklab, var(--accent) 30%, transparent);
                text-decoration-thickness: 1px;
            }
            .tt-row[data-type="prayer"] {
                background: color-mix(in oklab, var(--accent) 10%, var(--bg-soft));
                border-color: color-mix(in oklab, var(--accent) 24%, transparent);
            }
            .tt-row[data-type="learning"] {
                border-left: 2px solid var(--accent);
            }
            .tt-check {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1.5px solid color-mix(in oklab, var(--accent) 30%, transparent);
                background: transparent;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 180ms;
                padding: 0;
            }
            .tt-check svg {
                width: 11px;
                height: 11px;
                stroke: var(--accent);
                stroke-width: 2.5;
                fill: none;
            }
            .tt-check[data-checked="true"] {
                background: var(--accent);
                border-color: var(--accent);
            }
            .tt-check[data-checked="true"] svg {
                stroke: var(--bg);
            }
            .tt-label {
                flex: 1;
                border: none;
                background: transparent;
                color: var(--ink);
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 15px;
                outline: none;
                padding: 0;
                min-width: 0;
            }
            .tt-row[data-type="prayer"] .tt-label {
                font-style: normal;
                font-family: "Inter Tight", sans-serif;
                font-size: 11px;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                color: var(--accent);
                font-weight: 500;
            }
            .tt-controls {
                display: flex;
                align-items: center;
                gap: 2px;
                flex-shrink: 0;
            }
            .tt-remove {
                width: 26px;
                height: 26px;
                color: var(--ink-faint);
                opacity: 0;
                transition: all 200ms;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 6px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
            }
            .tt-row:hover .tt-remove {
                opacity: 0.5;
            }
            .tt-remove:hover {
                color: var(--accent);
                opacity: 1;
                background: color-mix(in oklab, var(--accent) 8%, transparent);
            }
            .tt-remove svg {
                width: 13px;
                height: 13px;
                stroke: currentColor;
                stroke-width: 1.5;
                fill: none;
            }
            .tt-arrow {
                width: 26px;
                height: 26px;
                color: var(--ink-faint);
                opacity: 0;
                transition: all 200ms;
                flex-shrink: 0;
                padding: 0;
                background: none;
                border: none;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 6px;
            }
            .tt-row:hover .tt-arrow {
                opacity: 0.45;
            }
            .tt-arrow:hover {
                color: var(--accent);
                opacity: 1;
                background: color-mix(in oklab, var(--accent) 8%, transparent);
            }
            .tt-arrow svg {
                width: 13px;
                height: 13px;
                stroke: currentColor;
                stroke-width: 1.5;
                fill: none;
            }
            .tt-summary {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 4px;
                padding: 4px 0 16px;
            }
            .tt-summary-count {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 28px;
                color: var(--ink);
                line-height: 1;
            }
            .tt-summary-sep {
                font-family: "Inter Tight", sans-serif;
                font-size: 14px;
                color: var(--ink-faint);
                opacity: 0.5;
                padding: 0 2px;
            }
            .tt-summary-label {
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                color: var(--ink-faint);
                opacity: 0.6;
                margin-left: 4px;
            }
            .tt-empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 32px 16px;
                opacity: 0.55;
            }
            .tt-empty-text {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 16px;
                color: var(--ink);
            }
            .tt-empty-hint {
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--ink-faint);
                text-align: center;
            }
            .tt-add-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 11px 14px;
                border-radius: 12px;
                background: color-mix(in oklab, var(--bg-soft) 30%, var(--bg));
                border: 1px dashed color-mix(in oklab, var(--accent) 18%, transparent);
                margin-top: 12px;
                transition: all 200ms;
            }
            .tt-add-row:focus-within {
                border-style: solid;
                border-color: color-mix(in oklab, var(--accent) 30%, transparent);
            }
            .tt-add-btn {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                flex-shrink: 0;
                transition: all 200ms;
                padding: 0;
                opacity: 1;
            }
            .tt-add-btn:disabled {
                opacity: 0.25;
                cursor: default;
            }
            .tt-add-btn svg {
                width: 14px;
                height: 14px;
                stroke: currentColor;
                stroke-width: 2;
                fill: none;
            }
            /* Resolutions */
            .res-row {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 12px 14px;
                border-radius: 12px;
                background: color-mix(in oklab, var(--bg-soft) 45%, var(--bg));
                border: 1px solid
                    color-mix(in oklab, var(--accent) 22%, transparent);
            }
            .res-row-rank {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 35%, transparent);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.1em;
                color: var(--accent);
                font-variant-numeric: tabular-nums;
                flex-shrink: 0;
            }
            .res-row-text {
                flex: 1;
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 15px;
                color: var(--ink);
                line-height: 1.5;
            }
            .res-row-edit {
                flex: 1;
                border: none;
                border-bottom: 1px solid var(--accent);
                background: transparent;
                color: var(--ink);
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 15px;
                padding: 4px 0;
                outline: none;
            }
            .res-row-controls {
                display: flex;
                gap: 4px;
                flex-shrink: 0;
            }
            .res-arrow {
                width: 28px;
                height: 28px;
                color: var(--ink-faint);
                display: flex;
                align-items: center;
                justify-content: center;
                transition: color 200ms;
            }
            .res-arrow:hover:not(:disabled) {
                color: var(--accent);
            }
            .res-arrow:disabled {
                opacity: 0.2;
                cursor: not-allowed;
            }
            .res-arrow svg {
                width: 12px;
                height: 12px;
                stroke: currentColor;
                stroke-width: 1.5;
                fill: none;
            }
            .res-delete {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                color: var(--ink-faint);
                display: flex;
                align-items: center;
                justify-content: center;
                transition: color 200ms;
                opacity: 0.5;
            }
            .res-delete:hover {
                color: #e07070;
                opacity: 1;
            }
            .res-delete svg {
                width: 12px;
                height: 12px;
                stroke: currentColor;
                stroke-width: 1.5;
                fill: none;
            }
            .res-meta {
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                color: var(--ink-faint);
                opacity: 0.7;
                text-align: center;
                margin-top: 14px;
            }

            /* Sittings */
            .sit-row {
                display: flex;
                flex-direction: column;
                gap: 5px;
                padding: 16px 4px;
                border-bottom: 1px solid
                    color-mix(in oklab, var(--accent) 22%, transparent);
                cursor: pointer;
                transition: padding 200ms;
            }
            .sit-row:hover {
                padding-left: 8px;
            }
            .sit-row-title {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 17px;
                color: var(--ink);
            }
            .sit-row-meta {
                display: flex;
                gap: 14px;
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-soft);
            }
            .sit-row-range {
                color: var(--accent);
                opacity: 0.95;
            }
            .sit-empty {
                text-align: center;
                padding: 32px 0;
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                color: var(--ink-soft);
                font-size: 14px;
            }

            /* ── Sittings Timeline ── */
            .timeline-wrap {
                display: flex;
                flex-direction: column;
                gap: 0;
                width: 100%;
            }
            .timeline-surah {
                position: relative;
                padding-left: 16px;
                border-left: 1px solid
                    color-mix(in oklab, var(--accent) 30%, transparent);
                padding-bottom: 10px;
            }
            .timeline-surah:last-child {
                border-left-color: transparent;
            }
            .timeline-surah-head {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 8px 0 12px;
                margin-left: -16px;
            }
            .timeline-surah-num {
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.3em;
                color: var(--accent);
                opacity: 0.85;
                min-width: 22px;
            }
            .timeline-surah-name {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 18px;
                color: var(--ink);
                font-weight: 400;
            }
            .timeline-surah-total {
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.25em;
                color: var(--ink-faint);
                opacity: 0.65;
                margin-left: 4px;
            }
            .timeline-line {
                display: flex;
                flex-direction: column;
                gap: 0;
                padding-left: 12px;
                position: relative;
            }
            .timeline-point {
                position: relative;
                padding: 8px 0 8px 18px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                transition: opacity 200ms;
                min-height: 32px;
                border-left: 1px solid
                    color-mix(in oklab, var(--accent) 14%, transparent);
                margin-left: -1px;
            }
            .timeline-point:hover {
                opacity: 0.85;
            }
            .timeline-point:last-child {
                border-left-color: transparent;
            }
            .timeline-dot {
                position: absolute;
                left: -5px;
                top: 16px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                border: 1.5px solid var(--accent);
                background: var(--bg);
                flex-shrink: 0;
            }
            .timeline-point.predicted .timeline-dot {
                border-color: color-mix(
                    in oklab,
                    var(--accent) 40%,
                    transparent
                );
                background: transparent;
            }
            .timeline-range {
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.18em;
                color: var(--accent);
                font-variant-numeric: tabular-nums;
                opacity: 0.9;
                min-width: 55px;
            }
            .timeline-title {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 14px;
                color: var(--ink-soft);
                flex: 1;
                min-width: 100px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .timeline-date {
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.2em;
                color: var(--ink-faint);
                opacity: 0.6;
                font-variant-numeric: tabular-nums;
                flex-shrink: 0;
            }
            @media (max-width: 768px) {
                .timeline-point {
                    flex-wrap: wrap;
                    gap: 4px;
                }
                .timeline-title {
                    min-width: 80px;
                }
            }
            .sit-show-more {
                width: 100%;
                padding: 14px 0;
                text-align: center;
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                color: var(--ink-faint);
                transition: color 200ms;
            }
            .sit-show-more:hover {
                color: var(--accent);
            }

            /* Daily complete (legacy fallback) */
            .daily-complete {
                position: absolute;
                inset: 0;
                z-index: 5;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 32px;
                gap: 22px;
                pointer-events: none;
            }

            /* ───── Responsive ───── */
            @media (max-width: 768px) {
                .center-button {
                    width: 140px;
                    height: 140px;
                }
                .center-button-label {
                    font-size: 24px;
                }
                .center-aura {
                    width: 200px;
                    height: 200px;
                    margin-top: -100px;
                    margin-left: -100px;
                }
                .step-fs {
                    padding: calc(env(safe-area-inset-top) + 18px) 18px
                        calc(env(safe-area-inset-bottom) + 20px);
                }
                .step-fs-back,
                .step-fs-help {
                    top: calc(env(safe-area-inset-top) + 12px);
                    width: 36px;
                    height: 36px;
                }
                .step-fs-back {
                    left: 12px;
                }
                .step-fs-help {
                    right: 12px;
                }
                .verse-fs-arabic {
                    line-height: 2;
                }
                .verse-fs-arabic-wrap {
                    max-height: 44vh;
                }
                .verse-fs-translation-wrap {
                    max-height: 22vh;
                }
                .player-btn {
                    width: 56px;
                    height: 56px;
                }
                .player-btn svg {
                    width: 20px;
                    height: 20px;
                }
                .home-scroll {
                    padding-bottom: calc(env(safe-area-inset-bottom) + 120px);
                }
                .dash-section-title {
                    font-size: 19px;
                }
            }
            @media (max-width: 380px) {
                .center-button {
                    width: 124px;
                    height: 124px;
                }
                .center-button-label {
                    font-size: 21px;
                }
                .center-aura {
                    width: 170px;
                    height: 170px;
                    margin-top: -85px;
                    margin-left: -85px;
                }
                .verse-fs-arabic {
                    font-size: clamp(20px, 5.5vw, 26px);
                    line-height: 1.95;
                }
                .verse-fs-translation {
                    font-size: 14px;
                }
                .question-text {
                    font-size: clamp(19px, 4vw + 8px, 23px);
                }
                .center-pills {
                    gap: 6px;
                }
                .center-pill {
                    padding: 5px 10px;
                    font-size: 9px;
                    letter-spacing: 0.22em;
                }
                }
                .dash-section {
                    padding: 18px 4px;
                }
            }
            @media (max-height: 720px) and (max-width: 480px) {
                .verse-fs-arabic-wrap {
                    max-height: 38vh;
                }
                .verse-fs-translation-wrap {
                    max-height: 18vh;
                }
            }
            @media (max-height: 500px) and (orientation: landscape) {
                .step-fs {
                    padding-top: 12px;
                    padding-bottom: 12px;
                }
                .step-fs-top {
                    margin-bottom: 8px;
                    gap: 6px;
                }
                .verse-fs-arabic {
                    font-size: clamp(18px, 2.4vh + 6px, 28px);
                    line-height: 1.75;
                }
                .verse-fs-arabic-wrap {
                    max-height: 36vh;
                }
                .verse-fs-translation-wrap {
                    max-height: 20vh;
                }
                .player-btn {
                    width: 48px;
                    height: 48px;
                }
                .orbit-themes {
                    display: none;
                }
                .center-button {
                    width: 110px;
                    height: 110px;
                }
                .center-button-label {
                    font-size: 19px;
                }
                .center-aura {
                    width: 150px;
                    height: 150px;
                    margin-top: -75px;
                    margin-left: -75px;
                }
            }
            /* ── Settings button ── */
            .settings-btn {
                position: absolute;
                top: calc(env(safe-area-inset-top) + 16px);
                right: 16px;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 25%, transparent);
                background: color-mix(in oklab, var(--bg) 55%, transparent);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                color: var(--ink-soft);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 8;
                transition: all 300ms;
                cursor: pointer;
            }
            .settings-btn:hover {
                color: var(--ink);
                border-color: var(--accent);
                transform: rotate(30deg);
            }
            .settings-btn svg {
                width: 18px;
                height: 18px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            /* ── Dashboard cards grid ── */
            .dash-grid {
                width: 100%;
                max-width: 760px;
                display: grid;
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(min(280px, 100%), 1fr)
                );
                gap: 16px;
                margin-top: 0;
                padding-bottom: clamp(20px, 4vh, 40px);
            }
            .dash-card {
                position: relative;
                padding: 22px 20px;
                border-radius: 18px;
                border: 1.5px solid
                    color-mix(in oklab, var(--accent) 42%, transparent);
                background: color-mix(
                    in oklab,
                    var(--bg-soft) 50%,
                    var(--bg)
                ) !important;
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                transition: all 320ms cubic-bezier(0.22, 1, 0.36, 1);
                cursor: pointer;
                overflow: hidden;
            }
            .dash-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    ellipse at top left,
                    color-mix(in oklab, var(--accent) 14%, transparent) 0%,
                    transparent 60%
                );
                opacity: 0.4;
                transition: opacity 400ms;
                pointer-events: none;
            }
            .dash-card:hover {
                border-color: color-mix(
                    in oklab,
                    var(--accent) 65%,
                    transparent
                );
                transform: translateY(-2px);
                box-shadow: 0 12px 40px
                    color-mix(in oklab, var(--accent) 22%, transparent);
            }
            .dash-card:hover::before {
                opacity: 0.75;
            }
            .dash-card-icon {
                font-size: 26px;
                margin-bottom: 10px;
                opacity: 1;
                line-height: 1;
            }
            .dash-card-title {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 22px;
                color: var(--ink);
                letter-spacing: -0.005em;
                line-height: 1.15;
                margin-bottom: 4px;
            }
            .dash-card-eyebrow {
                font-family: "Inter Tight", sans-serif;
                font-size: 10px;
                letter-spacing: 0.35em;
                text-transform: uppercase;
                color: var(--accent);
                opacity: 0.92;
                margin-bottom: 8px;
            }
            .dash-card-preview {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 14px;
                color: var(--ink);
                opacity: 0.88;
                line-height: 1.55;
                max-height: 2.7em;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            .dash-card-preview.empty {
                color: var(--ink-soft);
                opacity: 0.65;
            }
            .dash-card-help {
                position: absolute;
                top: 10px;
                right: 12px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 18%, transparent);
                color: var(--ink-faint);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 11px;
                transition: all 200ms;
                z-index: 2;
            }
            .dash-card-help:hover {
                color: var(--accent);
                border-color: var(--accent);
            }
            .dash-card-memorize {
                grid-column: 1 / -1;
                border-color: color-mix(in oklab, var(--accent) 60%, transparent);
                cursor: default;
            }
            .dash-card-memorize:hover {
                transform: none;
                border-color: color-mix(in oklab, var(--accent) 60%, transparent);
            }
            .mem-card-verse {
                margin-top: 10px;
                padding: 14px 16px;
                border-radius: 14px;
                background: color-mix(in oklab, var(--bg) 70%, transparent);
                border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
                cursor: pointer;
                transition: all 200ms;
            }
            .mem-card-verse:hover {
                border-color: color-mix(in oklab, var(--accent) 40%, transparent);
            }
            .mem-card-arabic {
                font-family: "Amiri Quran", serif;
                direction: rtl;
                font-size: 16px;
                line-height: 1.7;
                color: var(--ink);
                text-align: right;
                opacity: 0.92;
                margin-bottom: 6px;
            }
            .mem-card-translation {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-size: 13px;
                line-height: 1.5;
                color: var(--ink-soft);
                opacity: 0.85;
            }

            /* Dashboard section divider */
            .dash-divider {
                width: 100%;
                max-width: 760px;
                margin: 4px 0 18px;
                height: 1px;
                background: linear-gradient(
                    to right,
                    transparent,
                    color-mix(in oklab, var(--accent) 16%, transparent) 40%,
                    color-mix(in oklab, var(--accent) 16%, transparent) 60%,
                    transparent
                );
                opacity: 0.6;
            }
            .dash-daily-label {
                width: 100%;
                max-width: 760px;
                font-family: "Inter Tight", sans-serif;
                font-size: 9px;
                letter-spacing: 0.4em;
                text-transform: uppercase;
                color: var(--ink-soft);
                opacity: 0.7;
                text-align: center;
                margin-bottom: 12px;
            }

            /* ── Locked button inside dashboard ── */
            .dash-locked-card {
                width: 100%;
                max-width: 760px;
                padding: 16px 22px;
                border-radius: 18px;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 40%, transparent);
                background: color-mix(
                    in oklab,
                    var(--accent) 14%,
                    var(--bg-soft)
                );
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                display: flex;
                align-items: center;
                gap: 14px;
                cursor: pointer;
                transition: all 300ms;
                margin-bottom: 20px;
            }
            .dash-locked-card:hover {
                border-color: var(--accent);
                box-shadow: 0 8px 30px
                    color-mix(in oklab, var(--accent) 24%, transparent);
            }
            .dash-locked-icon {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1px solid
                    color-mix(in oklab, var(--accent) 40%, transparent);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                color: var(--accent);
                opacity: 0.8;
            }
            .dash-locked-icon svg {
                width: 18px;
                height: 18px;
                stroke: currentColor;
                stroke-width: 1.5;
                fill: none;
            }
            .dash-locked-info {
                display: flex;

            function cleanTafsirHtml(rawHtml) {
                if (!rawHtml || !rawHtml.trim()) return "";
                const doc = new DOMParser().parseFromString(
                    rawHtml,
                    "text/html",
                );
                const allowed = new Set([
                    "P",
                    "H1",
                    "H2",
                    "H3",
                    "H4",
                    "EM",
                    "STRONG",
                    "B",
                    "I",
                    "BR",
                    "SPAN",
                ]);
                function walk(node) {
                    const out = [];
                    for (const child of node.childNodes) {
                        if (child.nodeType === 3) out.push(child.textContent);
                        else if (child.nodeType === 1) {
                            const tag = child.tagName;
                            if (allowed.has(tag)) {
                                const inner = walk(child);
                                if (tag === "BR") out.push("<br>");
                                else if (tag === "SPAN") out.push(inner);
                                else
                                    out.push(
                                        `<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`,
                                    );
                            } else out.push(walk(child));
                        }
                    }
                    return out.join("");
                }
                return walk(doc.body);
            }

            function countdownToMidnight() {
                const now = new Date();
                const tomorrow = new Date(now);
                tomorrow.setHours(24, 0, 0, 0);
                const ms = tomorrow.getTime() - now.getTime();
                const totalSec = Math.max(0, Math.floor(ms / 1000));
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = totalSec % 60;
                return { h, m, s, ms };
            }

            async function fetchVersesForSession(
                surah,
                startVerse,
                maxInSurah,
            ) {
                const target = window.SESSION_VERSES_TARGET;
                const remainingInSurah = Math.max(
                    0,
                    maxInSurah - startVerse + 1,
                );
                const count = Math.min(target, remainingInSurah);
                if (count <= 0) return [];
                const promises = [];
                for (let i = 0; i < count; i++) {
                    const v = startVerse + i;
                    promises.push(
                        fetchVerseDetails(verseKey(surah, v)).then((d) => ({
                            ...d,
                            surah,
                            verse: v,
                            key: verseKey(surah, v),
                        })),
                    );
                }
                return Promise.all(promises);
            }
            function computeNextSessionStart(lastSurah, lastVerse) {
                // Given the LAST pondered verse, return the NEXT session's start.
                // Default: lastSurah=1, lastVerse=7 → start at 2:1.
                let s = lastSurah;
                let v = lastVerse + 1;
                return { surah: s, verse: v };
            }
            function computeFurthestPondered(DB) {
                // Scan all sittings and return the furthest verse ever pondered
                const sessions = DB.sessions.toArray();
                if (!sessions.length) return { surah: 2, verse: 0 }; // start at 2:1
                let maxSurah = 2,
                    maxVerse = 0;
                sessions.forEach((s) => {
                    const keys = s.ponderedKeys || s.verseKeys || [];
                    keys.forEach((k) => {
                        const { surah, verse } = parseKey(k);
                        if (
                            surah > maxSurah ||
                            (surah === maxSurah && verse > maxVerse)
                        ) {
                            maxSurah = surah;
                            maxVerse = verse;
                        }
                    });
                });
                return { surah: maxSurah, verse: maxVerse };
            }
