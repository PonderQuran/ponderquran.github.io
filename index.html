                const questions = DB.getQuestions();
                const selectedCount = (cs.selectedEndIdx ?? 0) + 1;
                const total = questions.length;
                const [qIdx, setQIdx] = useState(
                    Math.min(cs.qIdx ?? 0, total - 1),
                );
                useEffect(() => {
                    DB.setCurrentSessionField("qIdx", qIdx);
                }, [qIdx]);

                const totalSeconds = Math.max(30, (selectedCount / 2) * 60);
                const startedAtRef = useRef(Date.now() - (cs.qsElapsedMs || 0));
                const [remaining, setRemaining] = useState(() => {
                    const elapsed = (Date.now() - startedAtRef.current) / 1000;
                    return Math.max(0, totalSeconds - elapsed);
                });
                useEffect(() => {
                    const t = setInterval(() => {
                        const elapsed =
                            (Date.now() - startedAtRef.current) / 1000;
                        const rem = Math.max(0, totalSeconds - elapsed);
                        setRemaining(rem);
                        DB.setCurrentSessionField(
                            "qsElapsedMs",
                            Math.floor(elapsed * 1000),
                        );
                        if (rem <= 0) clearInterval(t);
                    }, 500);
                    return () => clearInterval(t);
                }, [totalSeconds]);

                const ready = remaining <= 0;
                const selectedVerses = verses.slice(0, selectedCount);

                const tryContinue = () => {
                    if (!ready) {
                        showToast("Sit a little longer", formatTime(remaining));
                        return;
                    }
                    onComplete();
                };

                return (
                    <div className="step-fs">
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Questions</div>
                            <VersePositionIndicator
                                idx={qIdx}
                                total={total}
                                reachedIdx={total - 1}
                            />
                        </div>
                        <div className="step-fs-body">
                            <div className="question-body fade-in">
                                <div className="question-ornament">
                                    <div className="o-line flip" />
                                    <span className="o-mark">✦</span>
                                    <div className="o-line" />
                                </div>
                                <div className="question-text">
                                    {questions[qIdx]}
                                </div>
                                <div className="question-hint">
                                    Close your eyes. Do not just read the
                                    question, live it. Let the reality of the
                                    verses answer it.
                                </div>
                                <VersesPanel
                                    verses={selectedVerses}
                                    openTafsir={openTafsir}
                                />
                            </div>
                        </div>
                        <div className="step-fs-bottom">
                            <div className="verse-nav">
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() =>
                                        setQIdx((i) => Math.max(0, i - 1))
                                    }
                                    disabled={qIdx <= 0}
                                    aria-label="Previous question"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M15 6l-6 6 6 6" />
                                    </svg>
                                </button>
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() =>
                                        setQIdx((i) =>
                                            Math.min(total - 1, i + 1),
                                        )
                                    }
                                    disabled={qIdx >= total - 1}
                                    aria-label="Next question"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 6l6 6-6 6" />
                                    </svg>
                                </button>
                            </div>
                            <div className="ponder-instruction">
                                Sit with these questions. Be honest with
                                yourself. {Math.ceil(selectedCount / 2)} minute
                                {selectedCount > 2 ? "s" : ""} — no less.
                            </div>
                            <button
                                className="action"
                                data-blocked={!ready}
                                onClick={tryContinue}
                            >
                                <span className="action-text">Continue</span>
                                <span className="action-line" />
                            </button>
                        </div>
                    </div>
                );
            }
            function VersesPanel({ verses, openTafsir }) {
                const [open, setOpen] = useState(false);
                return (
                    <div className="verse-panel" data-open={open}>
                        <button
                            className="verse-panel-toggle"
                            onClick={() => setOpen((o) => !o)}
                        >
                            <span>
                                {verses.length} verse
                                {verses.length > 1 ? "s" : ""} · tap to view
                            </span>
                            <svg viewBox="0 0 24 24">
                                <path d="M6 9l6 6 6-6" />
                            </svg>
                        </button>
                        <div className="verse-panel-content">
                            <div className="verse-panel-scroll">
                                {verses.map((v, i) => (
                                    <div
                                        key={v.key || i}
                                        className="verse-panel-row"
                                    >
                                        <div className="verse-panel-row-head">
                                            <div className="verse-panel-row-ref">
                                                {v.surah}:{v.verse ?? i + 1}
                                            </div>
                                            <button
                                                className="verse-panel-tafsir-btn"
                                                onClick={() =>
                                                    openTafsir(v.key)
                                                }
                                                disabled={!v.key}
                                            >
                                                Tafsir
                                            </button>
                                        </div>
                                        {v.arabic && (
                                            <div className="verse-panel-arabic">
                                                {v.arabic}
                                            </div>
                                        )}
                                        {v.translation && (
                                            <div className="verse-panel-translation">
                                                {v.translation}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── LESSONS STEP ─────────── */
            function LessonsStep({
                cs,
                DB,
                verses,
                onBack,
                onContinue,
                showToast,
            }) {
                const [selectedIdx, setSelectedIdx] = useState(
                    cs.lessonsVerseIdx ?? null,
                );
                const [lessons, setLessons] = useState([]);
                const [loading, setLoading] = useState(false);
                const [loggedIn, setLoggedIn] = useState(() => Auth.loggedIn());
                const ponderedVerses = verses.slice(
                    0,
                    (cs.selectedEndIdx ?? 0) + 1,
                );

                const refreshAuth = () => setLoggedIn(Auth.loggedIn());

                useEffect(() => {
                    if (selectedIdx != null) {
                        DB.setCurrentSessionField(
                            "lessonsVerseIdx",
                            selectedIdx,
                        );
                    }
                }, [selectedIdx, DB]);

                const loadLessons = useCallback(
                    async (chapterId, verseNumber) => {
                        setLoading(true);
                        setLessons([]);
                        const data = await fetchLessons(
                            chapterId,
                            verseNumber,
                        );
                        setLessons(data);
                        setLoading(false);
                        if (data.length === 0) {
                            showToast("No lessons found", "");
                        }
                    },
                    [showToast],
                );

                const selectVerse = (idx) => {
                    if (!loggedIn) {
                        const key = cs.verseKeys[idx];
                        const { surah, verse } = parseKey(key);
                        localStorage.setItem(
                            "qf_pending",
                            JSON.stringify({ surah, verse, idx }),
                        );
                        qfLogin();
                        return;
                    }
                    setSelectedIdx(idx);
                    const key = cs.verseKeys[idx];
                    const { surah, verse } = parseKey(key);
                    loadLessons(surah, verse);
                };

                const deselect = () => {
                    setSelectedIdx(null);
                    setLessons([]);
                };

                const handleLogin = async () => {
                    localStorage.setItem(
                        "qf_pending",
                        JSON.stringify({ idx: -1 }),
                    );
                    await qfLogin();
                };
                const handleLogout = () => {
                    qfLogout();
                    refreshAuth();
                    deselect();
                };

                useEffect(() => {
                    if (!loggedIn) return;
                    const raw = localStorage.getItem("qf_pending");
                    if (raw != null) {
                        localStorage.removeItem("qf_pending");
                        try {
                            const { idx } = JSON.parse(raw);
                            if (idx >= 0 && idx < ponderedVerses.length) {
                                selectVerse(idx);
                            }
                        } catch (e) {}
                    }
                }, [loggedIn]);

                return (
                    <div className="step-fs">
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Lessons</div>
                            {loggedIn && (
                                <button
                                    onClick={handleLogout}
                                    style={{
                                        fontFamily:
                                            '"Inter Tight", sans-serif',
                                        fontSize: "9px",
                                        letterSpacing: "0.25em",
                                        textTransform: "uppercase",
                                        color: "var(--ink-faint)",
                                        cursor: "pointer",
                                        transition: "color 200ms",
                                        opacity: 0.6,
                                        marginTop: "2px",
                                    }}
                                    onMouseOver={(e) => {
                                        e.target.style.color =
                                            "var(--accent)";
                                        e.target.style.opacity = "1";
                                    }}
                                    onMouseOut={(e) => {
                                        e.target.style.color =
                                            "var(--ink-faint)";
                                        e.target.style.opacity = "0.6";
                                    }}
                                >
                                    Logout
                                </button>
                            )}
                            {selectedIdx != null && (
                                <div className="step-fs-ref">
                                    Surah {cs.surahName} ·{" "}
                                    {ponderedVerses[selectedIdx]?.surah}:
                                    {ponderedVerses[selectedIdx]?.verse}
                                </div>
                            )}
                        </div>
                        <div className="step-fs-body">
                            <div className="lessons-body">
                                {selectedIdx == null ? (
                                    <>
                                        <div className="lessons-prompt fade-in">
                                            See what scholars and seekers have
                                            learned from the verses you
                                            pondered.
                                        </div>
                                        {!loggedIn && (
                                            <div
                                                style={{
                                                    textAlign: "center",
                                                    padding: "12px 0 4px",
                                                }}
                                            >
                                                <button
                                                    className="action"
                                                    onClick={handleLogin}
                                                >
                                                    <span className="action-text">
                                                        Login with Quran.com
                                                    </span>
                                                    <span className="action-line" />
                                                </button>
                                            </div>
                                        )}
                                        <div className="lessons-verse-list">
                                            {ponderedVerses.map((v, i) => (
                                                <button
                                                    key={v.key || i}
                                                    className="lessons-verse-card fade-in"
                                                    onClick={() =>
                                                        selectVerse(i)
                                                    }
                                                    style={{
                                                        animationDelay: `${i * 80}ms`,
                                                    }}
                                                >
                                                    <div className="lessons-verse-card-ref">
                                                        {v.surah}:
                                                        {v.verse ?? i + 1}
                                                    </div>
                                                    {v.arabic && (
                                                        <div className="lessons-verse-card-arabic">
                                                            {v.arabic}
                                                        </div>
                                                    )}
                                                    {v.translation && (
                                                        <div className="lessons-verse-card-trans">
                                                            {v.translation}
                                                        </div>
                                                    )}
                                                    <div className="lessons-verse-card-hint">
                                                        <svg viewBox="0 0 24 24">
                                                            <path d="M12 5v14M5 12h14" />
                                                        </svg>
                                                        {loggedIn
                                                            ? "Read lessons"
                                                            : "Login to read lessons"}
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <button
                                            className="lessons-detail-back"
                                            onClick={deselect}
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path d="M15 6l-6 6 6 6" />
                                            </svg>
                                            All verses
                                        </button>
                                        <div className="lessons-detail-verse fade-in">
                                            {ponderedVerses[selectedIdx]
                                                ?.arabic && (
                                                <div className="verse-fs-arabic">
                                                    {
                                                        ponderedVerses[
                                                            selectedIdx
                                                        ].arabic
                                                    }
                                                </div>
                                            )}
                                            {ponderedVerses[selectedIdx]
                                                ?.translation && (
                                                <div className="verse-fs-translation">
                                                    {
                                                        ponderedVerses[
                                                            selectedIdx
                                                        ].translation
                                                    }
                                                </div>
                                            )}
                                        </div>
                                        {loading ? (
                                            <div className="lessons-loading fade-in">
                                                <span className="loading-dots">
                                                    <span />
                                                    <span />
                                                    <span />
                                                </span>
                                                Loading lessons
                                            </div>
                                        ) : lessons.length === 0 ? (
                                            <div className="lessons-empty fade-in">
                                                No lessons found for this verse.
                                            </div>
                                        ) : (
                                            <div className="lessons-list">
                                                {lessons.map((lesson) => (
                                                    <div
                                                        key={lesson.id}
                                                        className="lessons-card fade-in"
                                                    >
                                                        <div className="lessons-card-author">
                                                            {lesson.authorName}
                                                        </div>
                                                        <div className="lessons-card-body">
                                                            {lesson.body}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                        <div className="step-fs-bottom">
                            <div
                                className="verse-nav"
                                style={{ visibility: "hidden" }}
                            >
                                <button className="verse-nav-arrow" disabled />
                                <button className="verse-nav-arrow" disabled />
                            </div>
                            <div className="ponder-instruction">
                                {selectedIdx == null
                                    ? loggedIn
                                        ? "Choose a verse to explore lessons from the community."
                                        : "Login with your Quran.com account to see lessons for these verses."
                                    : "Reflect on these lessons. Then continue to write your actions."}
                            </div>
                            <div
                                style={{
                                    display: "flex",
                                    gap: "12px",
                                    alignItems: "center",
                                }}
                            >
                                <button
                                    className="lessons-skip"
                                    onClick={onContinue}
                                >
                                    Skip
                                </button>
                                <button className="action" onClick={onContinue}>
                                    <span className="action-text">
                                        Continue
                                    </span>
                                    <span className="action-line" />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── WRITE STEP ─────────── */
            function WriteStep({ cs, DB, onBack, onSave }) {
                const [actions, setActions] = useState(() =>
                    cs.writeActions?.length ? cs.writeActions : [""],
                );
                useEffect(() => {
                    DB.setCurrentSessionField("writeActions", actions);
                }, [actions]);
                const update = (i, val) =>
                    setActions((prev) =>
                        prev.map((a, idx) => (idx === i ? val : a)),
                    );
                const addRow = () => setActions((prev) => [...prev, ""]);
                const removeRow = (i) =>
                    setActions((prev) => {
                        const next = prev.filter((_, idx) => idx !== i);
                        return next.length ? next : [""];
                    });
                return (
                    <div className="step-fs">
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Write</div>
                            <div className="step-fs-ref">
                                Surah {cs.surahName} · {cs.surah}:
                                {cs.verseKeys[0]?.split(":")[1]} –{" "}
                                {
                                    cs.verseKeys[
                                        cs.verseKeys.length - 1
                                    ]?.split(":")[1]
                                }
                            </div>
                        </div>
                        <div className="write-scroll">
                            <div className="write-intro">
                                The goal of every Muslim is to enter Paradise
                                and be saved from Hellfire. Life is a test, and
                                our limited time on earth is a precious gift
                                from Allah that we may use to that purpose.
                                Action and knowledge come together.
                                <strong>
                                    What practical actions or commitments can
                                    you implement in your life to benefit from
                                    this knowledge?
                                </strong>
                            </div>
                            <div className="write-list">
                                {actions.map((val, i) => (
                                    <div className="write-row" key={i}>
                                        <span className="write-row-num">
                                            {String(i + 1).padStart(2, "0")}
                                        </span>
                                        <input
                                            className="write-input"
                                            type="text"
                                            value={val}
                                            placeholder="An action you will take…"
                                            onChange={(e) =>
                                                update(i, e.target.value)
                                            }
                                        />
                                        <button
                                            className="write-remove"
                                            onClick={() => removeRow(i)}
                                            aria-label="Remove"
                                            tabIndex={-1}
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path d="M6 6l12 12M18 6L6 18" />
                                            </svg>
                                        </button>
                                    </div>
                                ))}
                                <button className="write-add" onClick={addRow}>
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 5v14M5 12h14" />
                                    </svg>
                                    Add another
                                </button>
                            </div>
                        </div>
                        <div className="step-fs-bottom">
                            <button
                                className="action"
                                onClick={() => onSave(actions)}
                            >
                                <span className="action-text">
                                    Save &amp; complete
                                </span>
                                <span className="action-line" />
                            </button>
                        </div>
                    </div>
                );
            }

            /* ─────────── TITLE STEP ─────────── */
            function TitleStep({ cs, onSubmit }) {
                const ref = useRef(null);
                const submittedRef = useRef(false);
                useEffect(() => {
                    if (ref.current) ref.current.value = cs.title || "";
                    setTimeout(() => ref.current?.focus(), 400);
                }, []);
                const submit = useCallback(() => {
                    if (submittedRef.current) return;
                    submittedRef.current = true;
                    onSubmit(ref.current?.value || "");
                }, [onSubmit]);
                return (
                    <div className="step-fs">
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Title</div>
                            <div className="step-fs-ref">
                                Surah {cs.surahName}
                            </div>
                        </div>
                        <div className="step-fs-body">
                            <div className="title-step">
                                <div className="title-step-prompt">
                                    Give this sitting a name.
                                </div>
                                <div className="title-step-hint">
                                    Something you'll recognize when you return
                                    to it. A theme. A reminder. A phrase from
                                    the verses.
                                </div>
                                <input
                                    ref={ref}
                                    className="title-step-input"
                                    type="text"
                                    placeholder="A sitting…"
                                    onKeyDown={(e) => {
                                        if (e.key === "Enter") submit();
                                    }}
                                    maxLength={80}
                                />
                            </div>
                        </div>
                        <div className="step-fs-bottom">
                            <button
                                className="action"
                                onClick={submit}
                                type="button"
                            >
                                <span className="action-text">Complete</span>
                                <span className="action-line" />
                            </button>
                        </div>
                    </div>
                );
            }

            /* ─────────── MEMORIZE STEP ─────────── */
            function MemorizeStep({
                DB,
                verseCacheRef,
                openTafsir,
                onBack,
                showToast,
                setConfirm,
            }) {
                const sittingId = DB.getLearningSittingId();
                const sessions = DB.sessions.toArray();
                const sitting = sessions.find((s) => s.id === sittingId);
                const learnedKeys = DB.getLearnedVerseKeys();
                const verseKeys = sitting?.ponderedKeys || [];
                const [idx, setIdx] = useState(() => {
                    const firstUnlearned = verseKeys.findIndex(
                        (k) => !learnedKeys.includes(k),
                    );
                    return firstUnlearned >= 0 ? firstUnlearned : 0;
                });
                const [loadedVerse, setLoadedVerse] = useState(
                    verseCacheRef.current[verseKeys[idx]] || null,
                );

                useEffect(() => {
                    const cached = verseCacheRef.current[verseKeys[idx]];
                    if (cached) {
                        setLoadedVerse(cached);
                        return;
                    }
                    if (verseKeys[idx]) {
                        fetchVerseDetails(verseKeys[idx]).then((d) => {
                            verseCacheRef.current[verseKeys[idx]] = d;
                            setLoadedVerse(d);
                        });
                    }
                }, [verseKeys[idx]]);

                const verse = loadedVerse;
                const total = verseKeys.length;
                const isLearned = learnedKeys.includes(verseKeys[idx]);
                const maxNavigable = (() => {
                    const firstUnlearned = verseKeys.findIndex(
                        (k) => !learnedKeys.includes(k),
                    );
                    if (firstUnlearned < 0) return verseKeys.length - 1;
                    return firstUnlearned;
                })();

                const handleConfirmLearned = () => {
                    setConfirm({
                        eyebrow: "Are you sure?",
                        message:
                            "You will be asked about this verse on the Day of Judgement. Only confirm if you have truly memorised it.",
                        onConfirm: () => {
                            DB.markVerseLearned(verseKeys[idx]);
                            setConfirm(null);
                            const nextUnlearned = verseKeys.findIndex(
                                (k, i) => i > idx && !learnedKeys.includes(k),
                            );
                            if (nextUnlearned >= 0) {
                                setIdx(nextUnlearned);
                            } else {
                                showToast("All verses learned", "");
                            }
                        },
                        onCancel: () => setConfirm(null),
                    });
                };

                if (!sitting || !verseKeys.length) {
                    return (
                        <div className="step-fs">
                            <BackButton onClick={onBack} />
                            <div className="step-fs-body">
                                <div className="title-step-prompt">
                                    No verses to memorise yet.
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="step-fs">
                        <BackButton onClick={onBack} />
                        <div className="step-fs-top">
                            <div className="step-fs-eyebrow">Memorise</div>
                            <VersePositionIndicator
                                idx={idx}
                                total={total}
                                reachedIdx={maxNavigable}
                            />
                            <div className="step-fs-ref">
                                Surah {sitting.surahName} · {verse?.surah}:
                                {verse?.verse}
                            </div>
                        </div>
                        <VerseBody verse={verse} />
                        <div className="step-fs-bottom">
                            <div className="verse-nav">
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() => setIdx(Math.max(0, idx - 1))}
                                    disabled={idx <= 0}
                                    aria-label="Previous verse"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M15 6l-6 6 6 6" />
                                    </svg>
                                </button>
                                <button
                                    className="verse-nav-arrow"
                                    onClick={() =>
                                        setIdx(Math.min(maxNavigable, idx + 1))
                                    }
                                    disabled={idx >= maxNavigable}
                                    aria-label="Next verse"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M9 6l6 6-6 6" />
                                    </svg>
                                </button>
                            </div>
                            <div className="ponder-instruction">
                                {isLearned
                                    ? "You have memorised this verse."
                                    : "Read it until it flows from your tongue without effort. Then confirm."}
                            </div>
                            <div className="verse-fs-actions">
                                <button
                                    className="action-soft"
                                    onClick={() => openTafsir(verse?.key)}
                                    disabled={!verse?.key}
                                >
                                    Tafsir
                                </button>
                                {!isLearned && (
                                    <button
                                        className="action"
                                        onClick={handleConfirmLearned}
                                    >
                                        <span className="action-text">
                                            I have memorised this verse
                                        </span>
                                        <span className="action-line" />
                                    </button>
                                )}
                                {isLearned && (
                                    <button
                                        className="action-soft"
                                        onClick={() => {
                                            DB.unmarkVerseLearned(
                                                verseKeys[idx],
                                            );
                                            showToast("Marked unlearned", "");
                                        }}
                                    >
                                        Mark unlearned
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── SUBSECTION ROUTER ─────────── */
            function SubsectionRouter({
                subView,
                DB,
                onClose,
                openHelp,
                onReplaySitting,
            }) {
                useYjsTick();
                const titles = {
                    sittings: "Sittings",
                    abodes: "Paradise & Fire",
                    resolutions: "Resolutions",
                    tomorrow: "Tomorrow",
                    provision: "Provision",
                    horizons: "Horizons",
                };
                return (
                    <div className="sub-fs">
                        <div className="sub-fs-top">
                            <button
                                className="step-fs-back"
                                style={{ position: "static" }}
                                onClick={onClose}
                                aria-label="Back"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M15 6l-6 6 6 6" />
                                </svg>
                            </button>
                            <div className="sub-fs-title">
                                {titles[subView]}
                            </div>
                            <button
                                className="step-fs-help"
                                style={{ position: "static" }}
                                onClick={() => openHelp(subView)}
                                aria-label="Help"
                            >
                                ?
                            </button>
                        </div>
                        <div className="sub-fs-body">
                            <div className="sub-fs-inner">
                                {subView === "sittings" && (
                                    <SittingsBody
                                        key="sittings"
                                        DB={DB}
                                        onReplaySitting={(s) =>
                                            onReplaySitting(s, subView)
                                        }
                                        onClose={onClose}
                                    />
                                )}
                                {subView === "abodes" && (
                                    <AbodesBody key="abodes" DB={DB} />
                                )}
                                {subView === "resolutions" && (
                                    <ResolutionsBody
                                        key="resolutions"
                                        DB={DB}
                                    />
                                )}
                                {subView === "tomorrow" && (
                                    <TomorrowBody key="tomorrow" DB={DB} />
                                )}
                                {subView === "provision" && (
                                    <ProvisionBody key="provision" DB={DB} />
                                )}
                                {subView === "horizons" && (
                                    <HorizonsBody key="horizons" DB={DB} />
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            /* ── Sittings Timeline ── */
            function SittingsBody({ DB, onReplaySitting, onClose }) {
                const sessions = DB.sessions.toArray();
                // Group sessions by surah
                const grouped = useMemo(() => {
                    const m = {};
                    sessions.forEach((s) => {
                        const keys = s.ponderedKeys || [];
                        if (!keys.length) return;
                        const sNum = parseKey(keys[0]).surah;
                        if (!m[sNum]) m[sNum] = [];
                        m[sNum].push(s);
                    });
                    return m;
                }, [sessions]);

                // Get chapters info from existing session data + API
                const [surahData, setSurahData] = useState({});
                useEffect(() => {
                    const nums = Object.keys(grouped).map(Number);
                    if (!nums.length) return;
                    Promise.all(
                        nums.map((n) => fetchSurahInfo(n).catch(() => null)),
                    ).then((infos) => {
                        const map = {};
                        infos.forEach((info, i) => {
                            map[nums[i]] = info || {
                                name: `Surah ${nums[i]}`,
                                verses_count: "—",
                            };
                        });
                        setSurahData(map);
                    });
                }, [grouped]);

                // Next session prediction
                const nextSessionInfo = useMemo(() => {
                    const furthest = computeFurthestPondered(DB);
                    const start = computeNextSessionStart(
                        furthest.surah,
                        furthest.verse,
                    );
                    return {
                        surah: start.surah,
                        startVerse: start.verse,
                        endVerse:
                            start.verse + window.SESSION_VERSES_TARGET - 1,
                    };
                }, [sessions]);

                if (!sessions.length)
                    return (
                        <div className="sit-empty">
                            No sittings yet. Complete your first cycle.
                        </div>
                    );

                const surahNumbers = Object.keys(grouped)
                    .map(Number)
                    .sort((a, b) => a - b);

                return (
                    <div className="timeline-wrap">
                        {surahNumbers.map((sNum) => {
                            const sittings = grouped[sNum].sort((a, b) => {
                                const fa = parseKey(
                                    (a.ponderedKeys || [])[0] || "1:0",
                                );
                                const fb = parseKey(
                                    (b.ponderedKeys || [])[0] || "1:0",
                                );
                                return fa.verse - fb.verse;
                            });
                            const name =
                                surahData[sNum]?.name || `Surah ${sNum}`;
                            const totalV = surahData[sNum]?.verses_count || "—";
                            const isPredicted = nextSessionInfo.surah === sNum;

                            return (
                                <div key={sNum} className="timeline-surah">
                                    <div className="timeline-surah-head">
                                        <span className="timeline-surah-num">
                                            {sNum}
                                        </span>
                                        <span className="timeline-surah-name">
                                            {name}
                                        </span>
                                        {totalV !== "—" && (
                                            <span className="timeline-surah-total">
                                                · {totalV} verses
                                            </span>
                                        )}
                                    </div>
                                    <div className="timeline-line">
                                        {sittings.map((s) => {
                                            const keys = s.ponderedKeys || [];
                                            const fk = parseKey(
                                                keys[0] || `${sNum}:1`,
                                            );
                                            const lk = parseKey(
                                                keys[keys.length - 1] ||
                                                    `${sNum}:1`,
                                            );
                                            return (
                                                <div
                                                    key={s.id}
                                                    className="timeline-point"
                                                    onClick={() => {
                                                        if (onClose) onClose();
                                                        if (onReplaySitting)
                                                            onReplaySitting(s);
                                                    }}
                                                >
                                                    <span className="timeline-dot" />
                                                    <span className="timeline-range">
                                                        {fk.verse} → {lk.verse}
                                                    </span>
                                                    <span className="timeline-title">
                                                        {s.title || "A sitting"}
                                                    </span>
                                                    <span className="timeline-date">
                                                        {s.date}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                        {isPredicted && (
                                            <div className="timeline-point predicted">
                                                <span
                                                    className="timeline-dot"
                                                    style={{
                                                        borderStyle: "dashed",
                                                        opacity: 0.5,
                                                    }}
                                                />
                                                <span className="timeline-range">
                                                    {nextSessionInfo.startVerse}{" "}
                                                    →{" "}
                                                    {Math.min(
                                                        nextSessionInfo.endVerse,
                                                        totalV === "—"
                                                            ? 999
                                                            : totalV,
                                                    )}
                                                </span>
                                                <span
                                                    className="timeline-title"
                                                    style={{
                                                        opacity: 0.5,
                                                        fontStyle: "italic",
                                                    }}
                                                >
                                                    Next sitting
                                                </span>
                                                <CountdownTimer />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            }

            function CountdownTimer() {
                const [t, setT] = useState(countdownToMidnight);
                useEffect(() => {
                    const i = setInterval(
                        () => setT(countdownToMidnight()),
                        1000,
                    );
                    return () => clearInterval(i);
                }, []);
                const ready = t.h === 0 && t.m === 0 && t.s === 0;
                return (
                    <span className="timeline-date">
                        {ready
                            ? "Ready"
                            : `${pad2(t.h)}:${pad2(t.m)}:${pad2(t.s)}`}
                    </span>
                );
            }

            /* ── Abodes (Paradise & Fire) ── */
            function AbodesBody({ DB }) {
                const [paradise, setParadise] = useState(
                    DB.getText("paradise"),
                );
                const [hellfire, setHellfire] = useState(
                    DB.getText("hellfire"),
                );
                const handleParadise = useCallback((e) => {
                    setParadise(e.target.value);
                    DB.setText("paradise", e.target.value);
                }, []);
                const handleHellfire = useCallback((e) => {
                    setHellfire(e.target.value);
                    DB.setText("hellfire", e.target.value);
                }, []);
                return (
                    <>
                        <div className="sub-section-label">Paradise</div>
                        <textarea
                            className="sub-textarea"
                            value={paradise}
                            placeholder="Jannah (paradise) has what no eye has ever seen, and no ear has ever heard, and no human heart has ever perceived. We can't imagine it, but try to write here the best atmosphere/sensation/scene/place you can picture. Keep refining it over time and read it in times of hardships, to motivate you for this greater purpose…"
                            onChange={handleParadise}
                        />
                        <div className="sub-section-label">Hellfire</div>
                        <textarea
                            className="sub-textarea"
                            value={hellfire}
                            placeholder="Picture it, soberly and with restraint, what you wish to be saved from. Write it so vividly that fleeing it becomes natural, inchaalah reading this will help you avoid sins and reaffirm you, write it in detail and keep refining it over time, concretise it in writing"
                            onChange={handleHellfire}
                        />
                    </>
                );
            }

            /* ── Resolutions ── */
            function ResolutionsBody({ DB }) {
                const rawAll = DB.getActionsSorted();
                const all = useMemo(() => {
                    const seen = new Set();
                    return rawAll.filter((a) => {
                        const t = (a.text || "").trim().toLowerCase();
                        if (!t || seen.has(t)) return false;
                        seen.add(t);
                        return true;
                    });
                }, [rawAll]);
                const [showAll, setShowAll] = useState(false);
                const [editingId, setEditingId] = useState(null);
                const visible = showAll ? all : all.slice(0, 3);
                if (!all.length)
                    return (
                        <div className="sit-empty">
                            No resolutions yet. They're added each time you
                            complete a sitting.
                        </div>
                    );
                const moveUp = (idx) => {
                    if (idx <= 0) return;
                    DB.swapActionRanking(all[idx].id, all[idx - 1].id);
                };
                const moveDown = (idx) => {
                    if (idx >= all.length - 1) return;
                    DB.swapActionRanking(all[idx].id, all[idx + 1].id);
                };
                const deleteAction = (id) => DB.deleteAction(id);
                const saveEdit = (id, text) => {
                    DB.updateAction(id, { text: text || "" });
                    setEditingId(null);
                };
                return (
                    <>
                        {visible.map((a, i) => (
                            <div key={a.id} className="res-row">
                                <div className="res-row-rank">{i + 1}</div>
                                {editingId === a.id ? (
                                    <input
                                        className="res-row-edit"
                                        type="text"
                                        defaultValue={a.text}
                                        autoFocus
                                        onBlur={(e) =>
                                            saveEdit(a.id, e.target.value)
                                        }
                                        onKeyDown={(e) => {
                                            if (e.key === "Enter")
                                                saveEdit(a.id, e.target.value);
                                            if (e.key === "Escape")
                                                setEditingId(null);
                                        }}
                                        style={{
                                            flex: 1,
                                            border: "none",
                                            borderBottom:
                                                "1px solid var(--accent)",
                                            background: "transparent",
                                            color: "var(--ink)",
                                            fontFamily:
                                                "'Cormorant Garamond', serif",
                                            fontStyle: "italic",
                                            fontSize: 15,
                                            padding: "4px 0",
                                            outline: "none",
                                        }}
                                    />
                                ) : (
                                    <div
                                        className="res-row-text"
                                        onClick={() => setEditingId(a.id)}
                                    >
                                        {a.text}
                                    </div>
                                )}
                                <div className="res-row-controls">
                                    <button
                                        className="res-delete"
                                        onClick={() => deleteAction(a.id)}
                                        aria-label="Delete"
                                        title="Delete"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M6 6l12 12M18 6L6 18" />
                                        </svg>
                                    </button>
                                    <button
                                        className="res-arrow"
                                        onClick={() => moveUp(i)}
                                        disabled={i === 0}
                                        aria-label="Move up"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M6 14l6-6 6 6" />
                                        </svg>
                                    </button>
                                    <button
                                        className="res-arrow"
                                        onClick={() => moveDown(i)}
                                        disabled={i === all.length - 1}
                                        aria-label="Move down"
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path d="M6 10l6 6 6-6" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        ))}
                        {!showAll && all.length > 3 && (
                            <button
                                className="sit-show-more"
                                onClick={() => setShowAll(true)}
                            >
                                Show all {all.length}
                            </button>
                        )}
                        <div className="res-meta">
                            Click to edit, delete with ×, reorder with arrows.
                        </div>
                    </>
                );
            }

            /* ── Tomorrow (timetable) ── */
            function BlockRow({
                b,
                i,
                list,
                toggleDone,
                updateLabel,
                remove,
                moveUp,
                moveDown,
            }) {
                const done = !!b.done;
                const type = b.type || "custom";
                const isPrayer = type === "prayer";
                const canReorder = type === "custom" || type === "learning";
                const canRemove = type === "custom" || type === "learning";
                return (
                    <div
                        key={b.id}
                        className="tt-row"
                        data-done={done ? "true" : "false"}
                        data-type={type}
                    >
                        <button
                            className="tt-check"
                            data-checked={done ? "true" : "false"}
                            onClick={() => toggleDone(b.id)}
                            aria-label={done ? "Mark undone" : "Mark done"}
                        >
                            {done && (
                                <svg viewBox="0 0 24 24">
                                    <path d="M5 12l5 5L20 7" />
                                </svg>
                            )}
                        </button>

                        <input
                            className="tt-label"
                            type="text"
                            value={b.label || ""}
                            placeholder={isPrayer ? "" : "What you’ll do…"}
                            onChange={(e) => updateLabel(b.id, e.target.value)}
                            readOnly={isPrayer}
                        />

                        <div className="tt-controls">
                            {canReorder && (
                                <>
                                    {i > 0 && (
                                        <button
                                            className="tt-arrow"
                                            onClick={() => moveUp(i)}
                                            aria-label="Move up"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path d="M6 14l6-6 6 6" />
                                            </svg>
                                        </button>
                                    )}
                                    {i < list.length - 1 && (
                                        <button
                                            className="tt-arrow"
                                            onClick={() => moveDown(i)}
                                            aria-label="Move down"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path d="M6 10l6 6 6-6" />
                                            </svg>
                                        </button>
                                    )}
                                </>
                            )}
                            {canRemove && (
                                <button
                                    className="tt-remove"
                                    onClick={() => remove(b.id)}
                                    aria-label="Remove"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M6 6l12 12M18 6L6 18" />
                                    </svg>
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            function TomorrowBody({ DB }) {
                useYjsTick();
                useEffect(() => {
                    DB.timetableEnsurePrayers();
                }, []);
                const all = DB.timetableArr();

                const prayerOrder = {
                    Fajr: 0,
                    Dhuhr: 1,
                    ʿAsr: 2,
                    Maghrib: 3,
                    ʿIshāʾ: 4,
                };
                const sorted = useMemo(() => {
                    const list = [...all];
                    list.sort((a, b) => {
                        if (a.type === "prayer" && b.type === "prayer") {
                            return (
                                (prayerOrder[a.label] || 0) -
                                (prayerOrder[b.label] || 0)
                            );
                        }
                        if (a.type === "prayer") return -1;
                        if (b.type === "prayer") return 1;
                        return (a.position ?? 0) - (b.position ?? 0);
                    });
                    return list;
                }, [all]);

                const total = sorted.length;
                const doneCount = sorted.filter((b) => b.done).length;

                const updateLabel = (id, label) =>
                    DB.timetableUpdate(id, { label });
                const toggleDone = (id) => DB.timetableToggleDone(id);
                const remove = (id) => DB.timetableRemove(id);
                const moveUp = (i) => {
                    const idxA = all.findIndex((b) => b.id === sorted[i].id);
                    const idxB = all.findIndex(
                        (b) => b.id === sorted[i - 1].id,
                    );
                    if (idxA >= 0 && idxB >= 0)
                        DB.timetableSwapPositions(idxA, idxB);
                };
                const moveDown = (i) => {
                    const idxA = all.findIndex((b) => b.id === sorted[i].id);
                    const idxB = all.findIndex(
                        (b) => b.id === sorted[i + 1].id,
                    );
                    if (idxA >= 0 && idxB >= 0)
                        DB.timetableSwapPositions(idxA, idxB);
                };

                const [newLabel, setNewLabel] = useState("");
                const addBlock = () => {
                    if (!newLabel.trim()) return;
                    DB.timetableAdd(newLabel.trim());
                    setNewLabel("");
                };

                return (
                    <>
                        <div className="tt-summary">
                            <span className="tt-summary-count">
                                {doneCount}
                            </span>
                            <span className="tt-summary-sep">/</span>
                            <span className="tt-summary-count">{total}</span>
                            <span className="tt-summary-label">
                                {doneCount === total && total > 0
                                    ? "All done"
                                    : "tasks"}
                            </span>
                        </div>

                        <div className="tt-list">
                            {sorted.map((b, i) => (
                                <BlockRow
                                    key={b.id}
                                    b={b}
                                    i={i}
                                    list={sorted}
                                    toggleDone={toggleDone}
                                    updateLabel={updateLabel}
                                    remove={remove}
                                    moveUp={moveUp}
                                    moveDown={moveDown}
                                />
                            ))}
                        </div>

                        {total === 0 && (
                            <div className="tt-empty">
                                <div className="tt-empty-text">
                                    Nothing planned yet.
                                </div>
                                <div className="tt-empty-hint">
                                    Add your prayers, tasks, or anything you
                                    want to accomplish.
                                </div>
                            </div>
                        )}

                        <div className="tt-add-row">
                            <div
                                className="tt-check"
                                data-checked="false"
                                style={{ opacity: 0.25, cursor: "default" }}
                            ></div>
                            <input
                                className="tt-label"
                                type="text"
                                value={newLabel}
                                placeholder="What you’ll do…"
                                onChange={(e) => setNewLabel(e.target.value)}
                                onKeyDown={(e) => {
                                    if (e.key === "Enter") addBlock();
                                }}
                            />
                            <button
                                className="tt-add-btn"
                                onClick={addBlock}
                                disabled={!newLabel.trim()}
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                            </button>
                        </div>
                    </>
                );
            }

            function ProvisionBody({ DB }) {
                const ref = useRef(null);
                const [words, setWords] = useState(0);
                useEffect(() => {
                    if (ref.current)
                        ref.current.value = DB.getText("provision");
                    setWords(wordCount(DB.getText("provision")));
                }, []);
                const handleChange = () => {
                    setWords(wordCount(ref.current.value));
                };
                const handleBlur = () => {
                    DB.setText("provision", ref.current.value);
                };
                useEffect(() => {
                    return () => {
                        if (ref.current)
                            DB.setText("provision", ref.current.value);
                    };
                }, []);
                const over = words > window.PROVISION_WORD_LIMIT;
                return (
                    <>
                        <textarea
                            ref={ref}
                            className="sub-textarea"
                            style={{ minHeight: 320 }}
                            placeholder="By pondering the Quran, the sunnah, the life of the Prophet peace be upon him and the Sahaba R.A, from your daily life, and from everything that happens around us, you will learn a lot. Write here the deep, dense truths you realise as you read the Quran and go through life, keep it short, but dense, read it everyday, and keep refining it as life goes by..."
                            onChange={handleChange}
                            onBlur={handleBlur}
                        />
                        <div className={`sub-counter ${over ? "over" : ""}`}>
                            {words} / {window.PROVISION_WORD_LIMIT} words
                        </div>
                    </>
                );
            }

            /* ── Horizons (goals) ── */
            function HorizonsBody({ DB }) {
                return (
                    <>
                        <div className="goal-field-pinned">
                            <div className="goal-field-pinned-label">
                                Above all
                            </div>
                            {window.HARDCODED_TOP_GOAL}
                        </div>
                        {window.GOAL_FIELDS.map((g) => (
                            <HorizonsField key={g.key} DB={DB} field={g} />
                        ))}
                    </>
                );
            }
            function HorizonsField({ DB, field }) {
                const ref = useRef(null);
                useEffect(() => {
                    if (ref.current) ref.current.value = DB.getGoal(field.key);
                }, []);
                const handleBlur = () => {
                    DB.setGoal(field.key, ref.current.value);
                };
                useEffect(() => {
                    return () => {
                        if (ref.current)
                            DB.setGoal(field.key, ref.current.value);
                    };
                }, []);
                return (
                    <div className="goal-field">
                        <div className="goal-field-label">{field.label}</div>
                        <input
                            ref={ref}
                            className="sub-textfield"
                            type="text"
                            placeholder={field.hint}
                            onBlur={handleBlur}
                        />
                    </div>
                );
            }

            /* ─────────── TAFSIR SHEET ─────────── */
            function TafsirSheet({ tafsirText, loading, verseKey, onClose }) {
                useEffect(() => {
                    const onKey = (e) => {
                        if (e.key === "Escape") onClose();
                    };
                    window.addEventListener("keydown", onKey);
                    return () => window.removeEventListener("keydown", onKey);
                }, [onClose]);
                return (
                    <>
                        <div
                            className="tafsir-backdrop"
                            onClick={onClose}
                            aria-hidden
                        />
                        <div
                            className="tafsir-sheet"
                            role="dialog"
                            aria-label="Tafsir"
                        >
                            <div className="tafsir-handle" />
                            <div className="tafsir-header">
                                <div className="tafsir-header-left">
                                    <div className="tafsir-era">
                                        {window.TAFSIR_ERA} · Tafsir
                                        {verseKey ? " · " + verseKey : ""}
                                    </div>
                                    <div className="tafsir-scholar">
                                        {window.TAFSIR_NAME}
                                    </div>
                                </div>
                                <button
                                    className="tafsir-close"
                                    onClick={onClose}
                                    aria-label="Close"
                                >
                                    <svg viewBox="0 0 24 24">
                                        <path d="M6 6l12 12M18 6L6 18" />
                                    </svg>
                                </button>
                            </div>
                            <div className="tafsir-divider" />
                            <div className="tafsir-body">
                                {loading || !tafsirText ? (
                                    <div className="tafsir-loading">
                                        <span className="loading-dots">
                                            <span />
                                            <span />
                                            <span />
                                        </span>
                                        <span>Loading tafsir</span>
                                    </div>
                                ) : (
                                    <div
                                        dangerouslySetInnerHTML={{
                                            __html: tafsirText,
                                        }}
                                    />
                                )}
                            </div>
                        </div>
                    </>

            /* ─────────── HELP MODAL ─────────── */
