<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirān</title>

<style>
/* Shared base styles for all three Quran pondering variations */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&family=Amiri+Quran&family=Cormorant:ital,wght@0,300;0,400;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Cardo:ital,wght@0,400;1,400&display=swap');

.v-root {
  font-family: 'Inter Tight', system-ui, sans-serif;
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--ink);
  background: var(--bg);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.v-root * {
  box-sizing: border-box;
}

.v-root::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 20;
}

.arabic-font {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
}

.serif {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
}

.fraunces {
  font-family: 'Fraunces', 'Cormorant Garamond', serif;
}

.cardo {
  font-family: 'Cardo', 'EB Garamond', serif;
}

/* Scrollbars */
.v-root .scroll::-webkit-scrollbar {
  width: 3px;
}
.v-root .scroll::-webkit-scrollbar-track {
  background: transparent;
}
.v-root .scroll::-webkit-scrollbar-thumb {
  background: var(--accent-soft);
  opacity: 0.3;
  border-radius: 2px;
}
.v-root .scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--accent-soft) transparent;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* Theme-button ring (same across variations; each variation can override shape) */
.theme-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 300ms;
  position: relative;
  border: none;
  padding: 0;
}

.theme-dot:hover {
  transform: scale(1.12);
}

.theme-dot.active::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid currentColor;
  opacity: 0.4;
}

@keyframes v-fade-rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes v-breathe {
  0%, 100% { transform: scale(0.88); opacity: 0.35; }
  50% { transform: scale(1); opacity: 0.7; }
}

@keyframes v-pulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

@keyframes v-spin-slow {
  to { transform: rotate(360deg); }
}

.fade-in {
  animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* Variation 1 — Orbit */

.orbit-root {
  background:
    radial-gradient(ellipse at center top, color-mix(in oklab, var(--accent) 8%, transparent) 0%, transparent 50%),
    radial-gradient(ellipse at center bottom, var(--bg-soft) 0%, var(--bg) 70%),
    var(--bg);
}

.orbit-backdrop {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.orbit-backdrop span.star {
  position: absolute;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 4px var(--accent);
  animation: v-twinkle var(--tw-dur, 4s) ease-in-out var(--tw-delay, 0s) infinite alternate;
}

@keyframes v-twinkle {
  0% { opacity: var(--tw-lo, 0.12); transform: scale(0.8); }
  100% { opacity: var(--tw-hi, 0.85); transform: scale(1.15); }
}

.orbit-backdrop span.star.bright {
  box-shadow: 0 0 8px 2px var(--accent);
}

.orbit-glow {
  position: absolute;
  inset: 10% 10%;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 60%);
  pointer-events: none;
}

/* Header */
.orbit-header {
  position: absolute;
  top: 32px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 5;
}

.orbit-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.orbit-brand-mark {
  color: var(--accent);
  font-size: 16px;
}

.orbit-brand-name {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--ink);
  font-style: italic;
}

.orbit-brand-sub {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* Stage */
.orbit-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  opacity: 0.15;
}
.orbit-ring.ring-1 { width: 240px; height: 240px; }
.orbit-ring.ring-2 { width: 480px; height: 480px; opacity: 0.12; }
.orbit-ring.ring-3 {
  width: 720px; height: 720px;
  opacity: 0.08;
  border-style: dashed;
  animation: v-spin-slow 240s linear infinite;
}

.orbit-corner {
  position: absolute;
  opacity: 0.5;
}
.orbit-corner.tl { top: 24px; left: 24px; }
.orbit-corner.tr { top: 24px; right: 24px; }
.orbit-corner.bl { bottom: 24px; left: 24px; }
.orbit-corner.br { bottom: 24px; right: 24px; }

/* Step markers */
.orbit-steps {
  position: absolute;
  width: 0;
  height: 0;
  top: 50%;
  left: 50%;
  pointer-events: none;
}

.orbit-step {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px;
  margin: -30px;
  width: 60px;
  background: none;
  color: var(--ink-faint);
  transition: color 300ms, transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
}

.orbit-step:hover {
  color: var(--ink-soft);
}

.orbit-step-glyph {
  font-size: 14px;
  opacity: 0.5;
  transition: all 400ms;
}

.orbit-step-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.6;
  font-style: italic;
}

.orbit-step.visited .orbit-step-glyph {
  color: var(--accent);
  opacity: 0.8;
}

.orbit-step.active {
  color: var(--ink);
}
.orbit-step.active .orbit-step-glyph {
  color: var(--accent);
  opacity: 1;
  font-size: 18px;
  text-shadow: 0 0 12px var(--accent);
}
.orbit-step.active .orbit-step-label {
  opacity: 1;
}

/* Center content */
.orbit-center {
  position: relative;
  z-index: 3;
  width: 420px;
  max-width: 90vw;
  text-align: center;
  padding: 32px;
}

.orbit-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.orbit-eyebrow {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-family: 'Inter Tight', sans-serif;
}

.orbit-title {
  font-size: 38px;
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.orbit-ref {
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
}

.orbit-hint {
  font-size: 14px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
  max-width: 320px;
}

.orbit-verse-box {
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.orbit-arabic {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
  font-size: 28px;
  line-height: 2;
  color: var(--ink);
  width: 100%;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.orbit-arabic-med {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
  font-size: 22px;
  line-height: 2;
  color: var(--ink);
  width: 100%;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.orbit-translation {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink-soft);
  font-style: italic;
  width: 100%;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* Action */
.orbit-action {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  color: var(--ink);
  transition: color 300ms;
}

.orbit-action-text {
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  font-family: 'Inter Tight', sans-serif;
}

.orbit-action-line {
  width: 24px;
  height: 1px;
  background: var(--accent);
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
}

.orbit-action:hover .orbit-action-line {
  width: 56px;
}

.orbit-action-soft {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 8px 12px;
}

.orbit-action-soft:hover {
  color: var(--ink-soft);
}

/* Waveform */
.orbit-wave {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 40px;
}
.orbit-wave span {
  display: block;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}

/* Breathing */
.orbit-breath {
  position: relative;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-breath-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--accent);
  animation: v-breathe 6s ease-in-out infinite;
}

.orbit-breath-ring.b2 {
  inset: -18px;
  border-color: var(--accent-soft);
  animation-duration: 6s;
  animation-delay: -0.2s;
  opacity: 0.4;
}

.orbit-breath-word {
  font-size: 14px;
  font-style: italic;
  letter-spacing: 0.4em;
  color: var(--ink-soft);
  z-index: 2;
  text-transform: lowercase;
}

/* Prompt + note */
.orbit-prompt {
  font-size: 26px;
  font-style: italic;
  line-height: 1.4;
  color: var(--ink);
  letter-spacing: -0.005em;
  max-width: 380px;
}

.orbit-note {
  width: 100%;
  max-width: 380px;
  min-height: 80px;
  background: color-mix(in oklab, var(--bg) 60%, var(--bg-soft));
  border: 1px solid var(--accent-soft);
  border-radius: 2px;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  padding: 14px;
  resize: none;
  font-style: italic;
  outline: none;
  transition: border-color 300ms;
}

.orbit-note:focus {
  border-color: var(--accent);
}

.orbit-note::placeholder {
  color: var(--ink-faint);
  opacity: 0.6;
}

/* Tafsir */
.orbit-tafsir-tabs {
  display: flex;
  gap: 24px;
  justify-content: center;
}
.orbit-tab {
  font-size: 13px;
  font-style: italic;
  color: var(--ink-faint);
  padding: 4px 0;
  position: relative;
  transition: color 300ms;
}
.orbit-tab.active {
  color: var(--ink);
}
.orbit-tab.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 1px;
  background: var(--accent);
}

.orbit-tafsir-body {
  max-height: 200px;
  overflow-y: auto;
  text-align: left;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-soft);
  padding-right: 8px;
  max-width: 400px;
}

.orbit-tafsir-body p + p {
  margin-top: 10px;
}

.orbit-tafsir-era {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
}

.orbit-ornament {
  font-size: 32px;
  color: var(--accent);
  opacity: 0.7;
}

.orbit-countdown {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--accent);
  opacity: 0.8;
  font-variant-numeric: tabular-nums;
}

/* Theme picker */
.orbit-themes {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 5;
}

.orbit-themes-label {
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
}

.orbit-themes-row {
  display: flex;
  gap: 14px;
  padding: 10px 20px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
  backdrop-filter: blur(12px);
}

.orbit-theme-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  position: relative;
  transition: transform 300ms;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
}

.orbit-theme-dot:hover {
  transform: scale(1.15);
}

.orbit-theme-dot.active {
  transform: scale(1.15);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 0 2px var(--ink), 0 0 16px var(--accent);
}

.orbit-theme-tooltip {
  position: absolute;
  bottom: 140%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}

.orbit-theme-dot:hover .orbit-theme-tooltip,
.orbit-theme-dot.active .orbit-theme-tooltip {
  opacity: 1;
}

/* Verse picker extras */
.picker-arrow {
  background: none;
  border: none;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 300ms, transform 300ms;
}
.picker-arrow:hover {
  color: var(--accent);
  transform: scale(1.2);
}
.picker-arrow:disabled {
  opacity: 0.15;
  cursor: not-allowed;
  transform: none;
}
.picker-arrow svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 1.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.player-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  transition: all 400ms;
}
.player-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 24px color-mix(in oklab, var(--accent) 40%, transparent);
  transform: scale(1.06);
}
.player-btn svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.loading-dots {
  display: inline-flex;
  gap: 6px;
}
.loading-dots span {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.5;
  animation: v-pulse 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

.screen { display: none; flex-direction: column; align-items: center; gap: 20px; }
.screen.active { display: flex; animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1); }

@media (max-width: 768px) {
  .orbit-ring.ring-3 { display: none; }
  .orbit-ring.ring-2 { width: 360px; height: 360px; }
  .orbit-ring.ring-1 { width: 200px; height: 200px; }
  .orbit-step { transform: scale(0.8); }
  .orbit-title { font-size: 28px; }
  .orbit-prompt { font-size: 22px; }
  .orbit-arabic { font-size: 22px; line-height: 1.8; }
  .orbit-arabic-med { font-size: 18px; line-height: 1.8; }
  .orbit-translation { font-size: 13px; line-height: 1.6; }
}

/* Verse-mode: full-screen blurred backdrop + centered large verse */
.orbit-stage.verse-mode .orbit-backdrop {
  filter: blur(24px);
  transform: scale(1.1);
  transition: filter 800ms ease, transform 800ms ease;
}
.orbit-stage.verse-mode .orbit-glow {
  opacity: 0.25;
  transition: opacity 800ms ease;
}
.orbit-stage.verse-mode .orbit-ring,
.orbit-stage.verse-mode .orbit-corner {
  opacity: 0.04;
  transition: opacity 800ms ease;
}

.verse-overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 48px 5vw;
  pointer-events: none;
}
.verse-overlay > * { pointer-events: auto; }

.verse-arabic {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
  font-size: clamp(22px, 4vw, 48px);
  line-height: 2;
  color: var(--ink);
  width: 100%;
  max-width: 90vw;
  word-wrap: break-word;
  overflow-wrap: break-word;
  text-align: center;
}

.verse-translation {
  font-size: clamp(13px, 1.8vw, 18px);
  line-height: 1.7;
  color: var(--ink-soft);
  font-style: italic;
  width: 100%;
  max-width: 800px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  text-align: center;
}

.verse-heartbeat {
  position: fixed;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, color-mix(in oklab, var(--accent) 0%, transparent) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 400ms ease;
}
.verse-heartbeat.active {
  opacity: 1;
  animation: v-heartbeat 1.4s ease-in-out infinite;
}

@keyframes v-heartbeat {
  0%, 100% { transform: scale(1); opacity: 0.25; }
  50% { transform: scale(1.08); opacity: 0.55; }
}

html, body { margin: 0; padding: 0; height: 100%; background: #070a14;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#orbit-mount { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<div id="orbit-mount"></div>

<script>
const THEMES = [
  {
    id: 'dusk', name: 'Dusk', subtitle: 'Plum horizon',
    bg: '#14101a', bgSoft: '#1e1726', ink: '#f0e3d5', inkSoft: '#bfa99a', inkFaint: '#6e5d6a',
    accent: '#d7826a', accentSoft: '#9a5540', light: false,
    ring: 'radial-gradient(circle at 30% 30%, #f3b6a2, #b25f46 55%, #3d1d18)',
  },
  {
    id: 'olive', name: 'Olive', subtitle: 'Garden, dim light',
    bg: '#0f1410', bgSoft: '#171e18', ink: '#e7e0cd', inkSoft: '#a9b099', inkFaint: '#5a6352',
    accent: '#a8b266', accentSoft: '#6d7840', light: false,
    ring: 'radial-gradient(circle at 30% 30%, #d6dc9a, #7a8840 55%, #2a3014)',
  },
];

const API_BASE = "https://api.quran.com/api/v4";
const AUDIO_BASE = "https://verses.quran.com/";
const TRANSLATION_ID = 20;
const RECITATION_ID = 7;
const TAFSIR_ID = 168;

const ORBIT_STEPS = [
  { id: 'arrive',  label: 'Arrive',  glyph: '✦', screens: ['arrive'] },
  { id: 'listen',  label: 'Listen',  glyph: '◉', screens: ['listen'] },
  { id: 'breathe', label: 'Breathe', glyph: '◯', screens: ['breathe'] },
  { id: 'recite',  label: 'Recite',  glyph: '✺', screens: ['recite'] },
  { id: 'reflect', label: 'Reflect', glyph: '◈', screens: ['reflect'] },
  { id: 'close',   label: 'Close',   glyph: '❋', screens: ['close'] },
];

let currentThemeIdx = 0;
let currentStep = 'arrive';
let verseMode = false;

const state = {
  surah: 0,
  verse: 0,
  surahName: "",
  surahVerseCount: 0,
  cache: {},
  currentAudio: null,
  playing: false,
  audioFinished: false,
  tafsirOpen: false,
};

function applyTheme(idx) {
  currentThemeIdx = idx;
  const t = THEMES[idx];
  const root = document.getElementById('orbit-mount');
  root.style.setProperty('--bg', t.bg);
  root.style.setProperty('--bg-soft', t.bgSoft);
  root.style.setProperty('--ink', t.ink);
  root.style.setProperty('--ink-soft', t.inkSoft);
  root.style.setProperty('--ink-faint', t.inkFaint);
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--accent-soft', t.accentSoft);
  buildConstellation(t.light);
  renderThemePicker();
}

function renderThemePicker() {
  const wrap = document.getElementById('themePicker');
  let html = '<div class="orbit-themes-label">style</div>';
  html += '<div class="orbit-themes-row">';
  THEMES.forEach((t, i) => {
    html += `<button class="orbit-theme-dot ${i === currentThemeIdx ? 'active' : ''}" data-action="set-theme" data-theme-idx="${i}" style="background:${t.ring}">
      <span class="orbit-theme-tooltip">${t.name}</span>
    </button>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function setStep(stepId) {
  currentStep = stepId;
  const isVerse = (stepId === 'listen' || stepId === 'recite');
  setVerseMode(isVerse);
  renderContent();
  updateStepHighlight();
}

function setVerseMode(active) {
  verseMode = active;
  const stage = document.getElementById('orbitStage');
  const overlay = document.getElementById('verseOverlay');
  if (!stage || !overlay) return;
  stage.classList.toggle('verse-mode', active);
  if (active) {
    const v = state.cache[verseKey(state.surah, state.verse)] || null;
    const content = document.getElementById('verseOverlayContent');
    if (content && v) {
      content.innerHTML = `
        <div class="verse-arabic">${v.arabic || ''}</div>
        <div class="verse-translation serif">${v.translation || ''}</div>
      `;
    }
    overlay.style.display = 'flex';
  } else {
    overlay.style.display = 'none';
    document.getElementById('verseHeartbeat').classList.remove('active');
  }
}

function setHeartbeat(active) {
  const hb = document.getElementById('verseHeartbeat');
  if (hb) hb.classList.toggle('active', active && verseMode);
}

function renderContent() {
  const wrap = document.getElementById('centerContent');
  const v = state.cache[verseKey(state.surah, state.verse)] || null;
  const key = verseKey(state.surah, state.verse);
  const stepIdx = ORBIT_STEPS.findIndex(s => s.id === currentStep);
  const nextStep = ORBIT_STEPS[stepIdx + 1];

  let html = `<div class="orbit-content fade-in" key="${currentStep}">`;

  if (currentStep === 'arrive') {
    html += `
      <div class="orbit-eyebrow">Mirān</div>
      <div class="orbit-title serif">Listen &amp; Reflect.</div>
      <div class="orbit-ref">One random verse</div>
      <div class="orbit-hint">Five minutes. No more today. <br/>Welcome back.</div>
      <button class="orbit-action" data-action="go-listen">
        <span class="orbit-action-text">Begin</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  else if (currentStep === 'listen') {
    const tafsirData = v && v.tafsirLoaded ? v.tafsir : null;
    html += `
      <div class="orbit-eyebrow">Listen</div>
      <div class="orbit-verse-box">
        <div class="orbit-arabic arabic-font">${v ? (v.arabic || '\u2026') : '\u2026'}</div>
        <div class="orbit-translation serif">${v ? (v.translation || '\u2026') : '\u2026'}</div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;align-items:center;">
        <button class="picker-arrow" data-action="prev-verse" ${state.verse <= 1 ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        ${buildPlayArea()}
        <button class="picker-arrow" data-action="next-verse" ${state.verse >= state.surahVerseCount ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;">
        ${state.audioFinished ? '<button class="orbit-action-soft" data-action="replay">Repeat</button>' : ''}
        <button class="orbit-action-soft" data-action="toggle-tafsir">${state.tafsirOpen ? 'Close tafsir' : 'Tafsir'}</button>
        <button class="orbit-action" data-action="go-next">
          <span class="orbit-action-text">Continue</span>
          <span class="orbit-action-line"></span>
        </button>
      </div>
      ${state.tafsirOpen ? `
        <div class="orbit-tafsir-body scroll serif" style="text-align:left;">
          <div class="orbit-tafsir-era">Maʿārif al-Qurʾān</div>
          ${tafsirData ? tafsirData : '<span class="loading-dots"><span></span><span></span><span></span></span>'}
        </div>` : ''}`;
  }

  else if (currentStep === 'breathe') {
    html += `
      <div class="orbit-eyebrow">Rest here</div>
      <div class="orbit-breath">
        <div class="orbit-breath-ring"></div>
        <div class="orbit-breath-ring b2"></div>
        <div class="orbit-breath-word serif">breathe</div>
      </div>
      <button class="orbit-action" data-action="go-next">
        <span class="orbit-action-text">Continue</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  else if (currentStep === 'recite') {
    html += `
      <div class="orbit-eyebrow">Say it with your own voice</div>
      <div class="orbit-verse-box">
        <div class="orbit-arabic-med arabic-font">${v ? (v.arabic || '\u2026') : '\u2026'}</div>
        <div class="orbit-translation serif">${v ? (v.translation || '\u2026') : '\u2026'}</div>
      </div>
      <button class="orbit-action" data-action="go-next">
        <span class="orbit-action-text">I have recited</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  else if (currentStep === 'reflect') {
    const prompts = [
      'What did Allah just tell you?',
      'What in your day contradicts this verse?',
      'One thing — one — for the next six hours.',
    ];
    html += `
      <div class="orbit-eyebrow">Sit with this</div>
      <div class="orbit-prompt serif">${prompts[0]}</div>
      <button class="orbit-action" data-action="go-next">
        <span class="orbit-action-text">Next</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  else if (currentStep === 'close') {
    html += `
      <div class="orbit-ornament">❋</div>
      <div class="orbit-title serif" style="font-size:28px">You have sat with this verse.</div>
      <div class="orbit-hint">Another is waiting.</div>
      <button class="orbit-action" data-action="restart">
        <span class="orbit-action-text">Another verse</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  else if (currentStep === 'error') {
    html += `
      <div class="orbit-eyebrow">A moment</div>
      <div class="orbit-hint">
        Your verse is waiting. The connection is quiet — try again.
      </div>
      <button class="orbit-action" data-action="retry">
        <span class="orbit-action-text">Try again</span>
        <span class="orbit-action-line"></span>
      </button>`;
  }

  html += '</div>';
  wrap.innerHTML = html;
}

function buildPlayArea() {
  if (state.playing) {
    return buildWaveformInline();
  }
  const data = state.cache[verseKey(state.surah, state.verse)];
  if (data?.audioUrl) {
    return `<button class="player-btn" data-action="toggle-play" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>`;
  }
  return `<div style="font-size:12px;letter-spacing:0.15em;color:var(--ink-faint);font-style:italic;">No audio</div>`;
}

function buildWaveformInline() {
  let bars = '';
  for (let i = 0; i < 28; i++) {
    const h = 10 + Math.abs(Math.sin(i * 0.7)) * 26;
    const op = i < 12 ? 0.9 : 0.3;
    bars += `<span style="height:${h}px;opacity:${op};animation-delay:${i * 60}ms"></span>`;
  }
  return `<div class="orbit-wave">${bars}</div>`;
}

function buildSteps() {
  const wrap = document.getElementById('steps');
  wrap.innerHTML = '';
  ORBIT_STEPS.forEach((s, i) => {
    const angle = (i / ORBIT_STEPS.length) * 2 * Math.PI - Math.PI / 2;
    const radius = 240;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    const btn = document.createElement('button');
    btn.className = 'orbit-step';
    btn.dataset.stepId = s.id;
    btn.style.transform = `translate(${x}px, ${y}px)`;
    btn.innerHTML = `<span class="orbit-step-glyph">${s.glyph}</span><span class="orbit-step-label serif">${s.label}</span>`;
    btn.addEventListener('click', () => {
      if (s.id === 'listen' && state.surah === 0) return;
      setStep(s.id);
    });
    wrap.appendChild(btn);
  });
}

function updateStepHighlight() {
  const activeIdx = ORBIT_STEPS.findIndex(s => s.id === currentStep);
  document.querySelectorAll('.orbit-step').forEach(el => {
    const idx = ORBIT_STEPS.findIndex(s => s.id === el.dataset.stepId);
    el.classList.toggle('active', idx === activeIdx);
    el.classList.toggle('visited', idx < activeIdx);
  });
}

function buildConstellation(isLight) {
  const wrap = document.getElementById('backdrop');
  const existing = wrap.querySelectorAll('span.star');
  existing.forEach(s => s.remove());
  if (isLight) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 100; i++) {
    const x = (i * 37 + i * i * 7) % 100;
    const y = (i * 53 + i * i * 3) % 100;
    const s = 0.6 + ((i * 13) % 5) / 4;
    const oLo = (0.08 + ((i * 7) % 4) / 12).toFixed(2);
    const oHi = (0.45 + ((i * 11) % 5) / 8).toFixed(2);
    const dur = (3.5 + (i % 7) * 0.9).toFixed(1);
    const delay = (0 - (i % 11) * 0.4).toFixed(1);
    const bright = i % 19 === 0;
    const span = document.createElement('span');
    span.className = `star${bright ? ' bright' : ''}`;
    span.style.cssText = `left:${x}%;top:${y}%;width:${s}px;height:${s}px;--tw-lo:${oLo};--tw-hi:${oHi};--tw-dur:${dur}s;--tw-delay:${delay}s;animation-delay:${delay}s;`;
    frag.appendChild(span);
  }
  wrap.appendChild(frag);
}

function stripHtml(str) {
  if (!str) return "";
  const t = document.createElement("div");
  t.innerHTML = str;
  return t.textContent || t.innerText || "";
}

function cleanTafsirHtml(rawHtml) {
  if (!rawHtml.trim()) return "";
  const doc = new DOMParser().parseFromString(rawHtml, "text/html");
  const allowed = new Set(["P", "H1", "H2", "H3", "H4", "EM", "STRONG", "B", "I", "BR", "SPAN"]);
  function walk(node) {
    const out = [];
    for (const child of node.childNodes) {
      if (child.nodeType === 3) out.push(child.textContent);
      else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (allowed.has(tag)) {
          const inner = walk(child);
          if (tag === "BR") out.push("<br>");
          else if (tag === "SPAN") out.push(inner);
          else out.push(`<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`);
        } else {
          out.push(walk(child));
        }
      }
    }
    return out.join("");
  }
  return walk(doc.body);
}

function verseKey(s, v) {
  return `${s}:${v}`;
}

async function fetchSurahInfo(surahNum) {
  const res = await fetch(`${API_BASE}/chapters/${surahNum}`);
  if (!res.ok) return null;
  const json = await res.json();
  const ch = json.chapter;
  if (!ch) return null;
  return { name: ch.name_simple || "", verses_count: ch.verses_count || 0, bismillah_pre: ch.bismillah_pre !== false };
}

async function fetchVerseDetails(vKey) {
  const data = { key: vKey, arabic: "", translation: "", audioUrl: "", tafsir: "", tafsirLoaded: false };
  try {
    const vRes = await fetch(`${API_BASE}/verses/by_key/${vKey}?fields=text_uthmani,verse_number,chapter_id`);
    if (vRes.ok) { const vJson = await vRes.json(); data.arabic = vJson.verse?.text_uthmani || ""; }
  } catch (e) {}
  try {
    const tRes = await fetch(`${API_BASE}/quran/translations/${TRANSLATION_ID}?verse_key=${vKey}`);
    if (tRes.ok) { const tJson = await tRes.json(); data.translation = stripHtml(tJson.translations?.[0]?.text || ""); }
  } catch (e) {}
  try {
    const aRes = await fetch(`${API_BASE}/recitations/${RECITATION_ID}/by_ayah/${vKey}`);
    if (aRes.ok) {
      const aJson = await aRes.json();
      const rawUrl = aJson.audio_files?.[0]?.url || "";
      data.audioUrl = rawUrl.startsWith("http") ? rawUrl : AUDIO_BASE + rawUrl;
    }
  } catch (e) {}
  return data;
}

async function fetchTafsir(vKey) {
  const res = await fetch(`${API_BASE}/tafsirs/${TAFSIR_ID}/by_ayah/${vKey}`);
  if (!res.ok) return "";
  const json = await res.json();
  return cleanTafsirHtml(json.tafsir?.text || "");
}

async function ensureVerse(surah, verseNum) {
  const key = verseKey(surah, verseNum);
  if (state.cache[key] && state.cache[key].translation && state.cache[key].arabic) return state.cache[key];
  const data = await fetchVerseDetails(key);
  state.cache[key] = data;
  return data;
}

async function loadRandomVerse() {
  state.tafsirOpen = false;
  stopAudio();
  const rRes = await fetch(`${API_BASE}/verses/random?fields=text_uthmani`);
  if (!rRes.ok) throw new Error("API unavailable");
  const rJson = await rRes.json();
  const verse = rJson.verse;
  if (!verse) throw new Error("No verse returned");
  const parts = verse.verse_key.split(":");
  state.surah = parseInt(parts[0], 10);
  state.verse = parseInt(parts[1], 10);
  const info = await fetchSurahInfo(state.surah);
  if (info) { state.surahName = info.name; state.surahVerseCount = info.verses_count; }
  await ensureVerse(state.surah, state.verse);
  setStep('listen');
  loadTafsirIfNeeded();
}

function loadTafsirIfNeeded() {
  const key = verseKey(state.surah, state.verse);
  const data = state.cache[key];
  if (!data || data.tafsirLoaded) return;
  fetchTafsir(key).then(text => {
    data.tafsir = text;
    data.tafsirLoaded = true;
    if (currentStep === 'listen' && state.tafsirOpen) renderContent();
  });
}

function stopAudio() {
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  state.playing = false;
  state.audioFinished = false;
}

function setupAudio(url) {
  if (!url) return;
  const audio = new Audio(url);
  audio.preload = "auto";
  state.currentAudio = audio;
  audio.onended = () => { state.playing = false; state.audioFinished = true; setHeartbeat(false); if (currentStep === 'listen') { renderContent(); } };
  audio.onplay = () => { state.playing = true; state.audioFinished = false; setHeartbeat(true); if (currentStep === 'listen') { renderContent(); } };
  audio.onpause = () => { if (audio.currentTime > 0 && audio.currentTime < audio.duration - 0.1) { state.playing = false; setHeartbeat(false); if (currentStep === 'listen') { renderContent(); } } };
}

function togglePlay() {
  if (!state.currentAudio) return;
  if (state.playing) state.currentAudio.pause();
  else state.currentAudio.play().catch(() => {});
}

async function selectVerse(surah, verseNum) {
  if (surah === state.surah && verseNum === state.verse) return;
  state.surah = surah;
  state.verse = verseNum;
  state.tafsirOpen = false;
  stopAudio();
  await ensureVerse(surah, verseNum);
  if (currentStep === 'listen') renderContent();
}

function prevVerse() { if (state.verse > 1) selectVerse(state.surah, state.verse - 1); }
function nextVerse() { if (state.verse < state.surahVerseCount) selectVerse(state.surah, state.verse + 1); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const stepIdx = ORBIT_STEPS.findIndex(s => s.id === currentStep);

  switch (action) {
    case 'go-listen':
      loadRandomVerse().catch(() => setStep('error'));
      break;
    case 'go-next': {
      const next = ORBIT_STEPS[stepIdx + 1];
      if (next) setStep(next.id);
      break;
    }
    case 'toggle-play':
      togglePlay();
      break;
    case 'replay':
      if (state.currentAudio) {
        state.audioFinished = false;
        state.currentAudio.currentTime = 0;
        state.currentAudio.play().catch(() => {});
        renderContent();
      }
      break;
    case 'toggle-tafsir':
      state.tafsirOpen = !state.tafsirOpen;
      if (state.tafsirOpen) loadTafsirIfNeeded();
      if (currentStep === 'listen') renderContent();
      break;
    case 'prev-verse':
      prevVerse();
      break;
    case 'next-verse':
      nextVerse();
      break;
    case 'set-theme': {
      const idx = parseInt(el.dataset.themeIdx, 10);
      if (!isNaN(idx)) applyTheme(idx);
      break;
    }
    case 'restart':
      loadRandomVerse().catch(() => setStep('error'));
      break;
    case 'retry':
      loadRandomVerse().catch(() => setStep('error'));
      break;
  }
});

function boot() {
  const mount = document.getElementById('orbit-mount');
  mount.innerHTML = `
    <div class="orbit-backdrop" id="backdrop" aria-hidden>
      <div class="orbit-glow"></div>
    </div>

    <div class="orbit-header">
      <div class="orbit-brand">
        <span class="orbit-brand-mark">✦</span>
        <span class="orbit-brand-name serif">Mirān</span>
      </div>
      <div class="orbit-brand-sub">Listen · Reflect</div>
    </div>

    <div class="orbit-stage" id="orbitStage">
      <div class="orbit-ring ring-1"></div>
      <div class="orbit-ring ring-2"></div>
      <div class="orbit-ring ring-3"></div>

      <div class="orbit-corner tl" aria-hidden>
        <svg viewBox="0 0 80 80" width="80" height="80"><g stroke="var(--accent)" stroke-width="0.5" fill="none" opacity="0.45"><path d="M0 40 L40 0 L80 40 L40 80 Z"/><path d="M20 40 L40 20 L60 40 L40 60 Z"/><circle cx="40" cy="40" r="4" fill="var(--accent)" opacity="0.6"/></g></svg>
      </div>
      <div class="orbit-corner tr" aria-hidden>
        <svg viewBox="0 0 80 80" width="80" height="80"><g stroke="var(--accent)" stroke-width="0.5" fill="none" opacity="0.45"><path d="M0 40 L40 0 L80 40 L40 80 Z"/><path d="M20 40 L40 20 L60 40 L40 60 Z"/><circle cx="40" cy="40" r="4" fill="var(--accent)" opacity="0.6"/></g></svg>
      </div>
      <div class="orbit-corner bl" aria-hidden>
        <svg viewBox="0 0 80 80" width="80" height="80"><g stroke="var(--accent)" stroke-width="0.5" fill="none" opacity="0.45"><path d="M0 40 L40 0 L80 40 L40 80 Z"/><path d="M20 40 L40 20 L60 40 L40 60 Z"/><circle cx="40" cy="40" r="4" fill="var(--accent)" opacity="0.6"/></g></svg>
      </div>
      <div class="orbit-corner br" aria-hidden>
        <svg viewBox="0 0 80 80" width="80" height="80"><g stroke="var(--accent)" stroke-width="0.5" fill="none" opacity="0.45"><path d="M0 40 L40 0 L80 40 L40 80 Z"/><path d="M20 40 L40 20 L60 40 L40 60 Z"/><circle cx="40" cy="40" r="4" fill="var(--accent)" opacity="0.6"/></g></svg>
      </div>

      <div class="orbit-steps" id="steps" aria-hidden></div>

      <div class="orbit-center">
        <div id="centerContent"></div>
      </div>
    </div>

    <div class="verse-heartbeat" id="verseHeartbeat"></div>

    <div class="verse-overlay" id="verseOverlay" style="display:none;">
      <div id="verseOverlayContent"></div>
    </div>

    <div class="orbit-themes" id="themePicker"></div>
  `;

  buildSteps();
  renderThemePicker();
  applyTheme(currentThemeIdx);
  setStep('arrive');
}

boot();
</script>
