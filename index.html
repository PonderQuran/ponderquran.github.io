<script type="text/babel" data-presets="react">
/* global React, ReactDOM */
const { useState, useEffect, useRef, useCallback, useMemo, useReducer } = React;

const STEPS = [
  { id: 'listen',    label: 'Listen' },
  { id: 'select',    label: 'Select' },
  { id: 'ponder',    label: 'Ponder' },
  { id: 'questions', label: 'Questions' },
  { id: 'write',     label: 'Write' },
];

/* ─────────── helpers ─────────── */
function uuid() {
  return 'x-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function verseKey(s, v) { return `${s}:${v}`; }
function parseKey(k) { const [s, v] = k.split(':').map(Number); return { surah: s, verse: v }; }
function stripHtml(str) {
  if (!str) return "";
  const t = document.createElement("div");
  t.innerHTML = str;
  return t.textContent || t.innerText || "";
}
function cleanTafsirHtml(rawHtml) {
  if (!rawHtml || !rawHtml.trim()) return "";
  const doc = new DOMParser().parseFromString(rawHtml, "text/html");
  const allowed = new Set(["P","H1","H2","H3","H4","EM","STRONG","B","I","BR","SPAN"]);
  function walk(node) {
    const out = [];
    for (const child of node.childNodes) {
      if (child.nodeType === 3) out.push(child.textContent);
      else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (allowed.has(tag)) {
          const inner = walk(child);
          if (tag === "BR") out.push("<br>");
          else if (tag === "SPAN") out.push(inner);
          else out.push(`<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`);
        } else out.push(walk(child));
      }
    }
    return out.join("");
  }
  return walk(doc.body);
}
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function wordCount(str) {
  if (!str) return 0;
  return str.trim().split(/\s+/).filter(Boolean).length;
}
function countdownToMidnight() {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setHours(24, 0, 0, 0);
  const ms = tomorrow.getTime() - now.getTime();
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return { h, m, s, ms };
}
function pad2(n) { return String(n).padStart(2, '0'); }

// ── simple compression helpers for sync codes ──
function compressForSync(str) {
  try {
    // compress via deflate-like approach: repeat chars
    return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  } catch(e) { return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
}
function decompressForSync(s) {
  try {
    return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
  } catch(e) { return atob(s.replace(/-/g,'+').replace(/_/g,'/')); }
}

async function fetchSurahInfo(n) {
  try {
    const r = await fetch(`${window.API_BASE}/chapters/${n}`);
    if (!r.ok) return null;
    const ch = (await r.json()).chapter;
    if (!ch) return null;
    return { name: ch.name_simple || "", verses_count: ch.verses_count || 0 };
  } catch (e) { return null; }
}
async function fetchVerseDetails(vk) {
  const data = { key: vk, arabic: "", translation: "", audioUrl: "" };
  const translationId = (window.DB && window.DB.getTranslationId) ? window.DB.getTranslationId() : window.TRANSLATION_ID;
  const recitationId = (window.DB && window.DB.getRecitationId) ? window.DB.getRecitationId() : window.RECITATION_ID;
  try {
    const r = await fetch(`${window.API_BASE}/verses/by_key/${vk}?fields=text_uthmani`);
    if (r.ok) data.arabic = (await r.json()).verse?.text_uthmani || "";
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/quran/translations/${translationId}?verse_key=${vk}`);
    if (r.ok) data.translation = stripHtml((await r.json()).translations?.[0]?.text || "");
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/recitations/${recitationId}/by_ayah/${vk}`);
    if (r.ok) {
      const url = (await r.json()).audio_files?.[0]?.url || "";
      data.audioUrl = url.startsWith("http") ? url : window.AUDIO_BASE + url;
    }
  } catch (e) {}
  return data;
}
async function fetchTafsir(vk) {
  const tafsirId = (window.DB && window.DB.getTafsirId) ? window.DB.getTafsirId() : window.TAFSIR_ID;
  try {
    const r = await fetch(`${window.API_BASE}/tafsirs/${tafsirId}/by_ayah/${vk}`);
    if (!r.ok) return "";
    return cleanTafsirHtml((await r.json()).tafsir?.text || "");
  } catch (e) { return ""; }
}
async function fetchVersesForSession(surah, startVerse, maxInSurah) {
  const target = window.SESSION_VERSES_TARGET;
  const remainingInSurah = Math.max(0, maxInSurah - startVerse + 1);
  const count = Math.min(target, remainingInSurah);
  if (count <= 0) return [];
  const promises = [];
  for (let i = 0; i < count; i++) {
    const v = startVerse + i;
    promises.push(fetchVerseDetails(verseKey(surah, v)).then(d => ({
      ...d, surah, verse: v, key: verseKey(surah, v),
    })));
  }
  return Promise.all(promises);
}
function computeNextSessionStart(lastSurah, lastVerse) {
  // Given the LAST pondered verse, return the NEXT session's start.
  // Default: lastSurah=1, lastVerse=7 → start at 2:1.
  let s = lastSurah;
  let v = lastVerse + 1;
  return { surah: s, verse: v };
}
function computeFurthestPondered(DB) {
  // Scan all sittings and return the furthest verse ever pondered
  const sessions = DB.sessions.toArray();
  if (!sessions.length) return { surah: 2, verse: 0 }; // start at 2:1
  let maxSurah = 2, maxVerse = 0;
  sessions.forEach(s => {
    const keys = s.ponderedKeys || s.verseKeys || [];
    keys.forEach(k => {
      const { surah, verse } = parseKey(k);
      if (surah > maxSurah || (surah === maxSurah && verse > maxVerse)) {
        maxSurah = surah;
        maxVerse = verse;
      }
    });
  });
  return { surah: maxSurah, verse: maxVerse };
}

/* ─────────── force-update on Y.Doc updates ─────────── */
function useYjsTick() {
  const [, tick] = useReducer(x => (x + 1) | 0, 0);
  useEffect(() => {
    if (!window.YDOC) return;
    const handler = () => tick();
    window.YDOC.on('update', handler);
    return () => window.YDOC.off('update', handler);
  }, []);
}

/* ─────────── DB API (built on top of window.YDOC) ─────────── */
function buildDB(ydoc) {
  const DB = {
    ydoc,
    meta: ydoc.getMap('meta'),
    currentSession: ydoc.getMap('currentSession'),
    sessions: ydoc.getArray('sessions'),
    actions: ydoc.getArray('actions'),
    texts: ydoc.getMap('texts'),
    goals: ydoc.getMap('goals'),
    timetable: ydoc.getArray('timetable'),
  };
  DB.getTheme = () => DB.meta.get('themeIdx') ?? 0;
  DB.setTheme = (i) => DB.meta.set('themeIdx', i);
  DB.getHideIntro = () => DB.meta.get('hideIntro') ?? false;
  DB.setHideIntro = (v) => DB.meta.set('hideIntro', !!v);
  DB.getLangCode = () => DB.meta.get('langCode') ?? 'en';
  DB.setLangCode = (c) => DB.meta.set('langCode', c);
  DB.getTranslationId = () => DB.meta.get('translationId') ?? window.LANG_DEFAULTS.translationId;
  DB.setTranslationId = (id) => DB.meta.set('translationId', id);
  DB.getTafsirId = () => DB.meta.get('tafsirId') ?? window.LANG_DEFAULTS.tafsirId;
  DB.setTafsirId = (id) => DB.meta.set('tafsirId', id);
  DB.getRecitationId = () => DB.meta.get('recitationId') ?? window.LANG_DEFAULTS.recitationId;
  DB.setRecitationId = (id) => DB.meta.set('recitationId', id);
  DB.getLastPondered = () => ({
    surah: DB.meta.get('lastPonderedSurah') ?? 1,
    verse: DB.meta.get('lastPonderedVerse') ?? 7,
  });
  DB.setLastPondered = (s, v) => {
    ydoc.transact(() => {
      DB.meta.set('lastPonderedSurah', s);
      DB.meta.set('lastPonderedVerse', v);
    });
  };
  DB.getLastSessionDate = () => DB.meta.get('lastSessionDate') ?? null;
  DB.setLastSessionDate = (d) => DB.meta.set('lastSessionDate', d);

  DB.getCurrentSession = () => {
    if (!DB.currentSession.has('id')) return null;
    const o = {};
    DB.currentSession.forEach((v, k) => { o[k] = v; });
    return o;
  };
  DB.setCurrentSessionField = (key, val) => DB.currentSession.set(key, val);
  DB.replaceCurrentSession = (data) => {
    ydoc.transact(() => {
      DB.currentSession.forEach((_, k) => DB.currentSession.delete(k));
      if (data) Object.entries(data).forEach(([k, v]) => DB.currentSession.set(k, v));
    });
  };
  DB.clearCurrentSession = () => DB.replaceCurrentSession(null);

  DB.addAction = (text, sessionId) => {
    const existing = DB.actions.toArray();
    const maxRanking = existing.length
      ? Math.max(...existing.map(a => (typeof a.ranking === 'number' ? a.ranking : 0)))
      : -1;
    const action = {
      id: uuid(),
      text: text.trim(),
      ranking: maxRanking + 1,
      sessionId,
      createdAt: Date.now(),
    };
    DB.actions.push([action]);
    return action.id;
  };
  DB.deleteActionsForSession = (sessionId) => {
    const arr = DB.actions.toArray();
    ydoc.transact(() => {
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i].sessionId === sessionId) DB.actions.delete(i, 1);
      }
    });
  };
  DB.updateAction = (id, patch) => {
    const arr = DB.actions.toArray();
    const idx = arr.findIndex(a => a.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.actions.delete(idx, 1);
      DB.actions.insert(idx, [{ ...arr[idx], ...patch }]);
    });
  };
  DB.swapActionRanking = (idA, idB) => {
    const arr = DB.actions.toArray();
    const iA = arr.findIndex(a => a.id === idA);
    const iB = arr.findIndex(a => a.id === idB);
    if (iA < 0 || iB < 0) return;
    const rA = arr[iA].ranking, rB = arr[iB].ranking;
    DB.updateAction(idA, { ranking: rB });
    DB.updateAction(idB, { ranking: rA });
  };
  DB.getActionsSorted = () => {
    return DB.actions.toArray().slice().sort((a, b) => (a.ranking ?? 0) - (b.ranking ?? 0));
  };
  DB.deleteAction = (id) => {
    const arr = DB.actions.toArray();
    const idx = arr.findIndex(a => a.id === id);
    if (idx < 0) return;
    DB.actions.delete(idx, 1);
  };

  DB.addSession = (sessionData) => {
    DB.sessions.push([sessionData]);
  };
  DB.updateSessionTitle = (id, title) => {
    const arr = DB.sessions.toArray();
    const idx = arr.findIndex(s => s.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.sessions.delete(idx, 1);
      DB.sessions.insert(idx, [{ ...arr[idx], title }]);
    });
  };
  DB.deleteSession = (id) => {
    const arr = DB.sessions.toArray();
    const idx = arr.findIndex(s => s.id === id);
    if (idx >= 0) DB.sessions.delete(idx, 1);
  };

  DB.getText = (key) => DB.texts.get(key) ?? '';
  DB.setText = (key, val) => DB.texts.set(key, val);

  DB.getGoal = (key) => DB.goals.get(key) ?? '';
  DB.setGoal = (key, val) => DB.goals.set(key, val);

  DB.timetableArr = () => DB.timetable.toArray();
  DB.timetableEnsurePrayers = () => {
    const existing = DB.timetable.toArray();
    const hasPrayer = (name) => existing.some(b => b.isPrayer && b.label === name);
    const missing = window.PRAYER_BLOCKS.filter(n => !hasPrayer(n));
    if (!missing.length) return;
    ydoc.transact(() => {
      missing.forEach(n => DB.timetable.push([{ id: uuid(), label: n, time: '', isPrayer: true }]));
    });
  };
  DB.timetableAdd = (time, label) => {
    const existing = DB.timetable.toArray();
    const maxPos = existing.length ? Math.max(...existing.map(b => (typeof b.position === 'number' ? b.position : 0))) : -1;
    DB.timetable.push([{ id: uuid(), label, time, isPrayer: false, position: maxPos + 1 }]);
  };
  DB.timetableUpdate = (id, patch) => {
    const arr = DB.timetable.toArray();
    const idx = arr.findIndex(b => b.id === id);
    if (idx < 0) return;
    ydoc.transact(() => {
      DB.timetable.delete(idx, 1);
      DB.timetable.insert(idx, [{ ...arr[idx], ...patch }]);
    });
  };
  DB.timetableRemove = (id) => {
    const arr = DB.timetable.toArray();
    const idx = arr.findIndex(b => b.id === id);
    if (idx >= 0) DB.timetable.delete(idx, 1);
  };
  DB.timetableSwapPositions = (i, j) => {
    const arr = DB.timetable.toArray();
    if (i < 0 || i >= arr.length || j < 0 || j >= arr.length) return;
    const posI = arr[i].position ?? i;
    const posJ = arr[j].position ?? j;
    DB.timetableUpdate(arr[i].id, { position: posJ });
    DB.timetableUpdate(arr[j].id, { position: posI });
  };

  return DB;
}

/* ─────────── ROOT (mounted by startApp) ─────────── */
function MiranRoot() {
  useYjsTick();
  const DB = window.DB;
  const themeIdx = DB.getTheme();
  const theme = window.THEMES[themeIdx];

  /* update browser theme color */
  useEffect(() => {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme.bg);
  }, [theme.bg]);

  const cs = DB.getCurrentSession();
  const lastSessionDate = DB.getLastSessionDate();
  const sessionInProgress = !!cs;
  const dailyDoneToday = !sessionInProgress && lastSessionDate === todayStr();

  /* in-memory verse cache (re-fetched on session start; ephemeral) */
  const verseCacheRef = useRef({}); // { 'S:V': details }
  const [verseCacheVersion, bumpCache] = useReducer(x => x + 1, 0);

  /* loading verses for the active session */
  const [versesLoading, setVersesLoading] = useState(false);
  const [versesError, setVersesError] = useState(null);
  useEffect(() => {
    if (!cs || !cs.verseKeys || cs.verseKeys.length === 0) return;
    // any missing verse details? fetch all in parallel
    const missing = cs.verseKeys.filter(k => !verseCacheRef.current[k]);
    if (missing.length === 0) return;
    setVersesLoading(true);
    setVersesError(null);
    let cancelled = false;
    (async () => {
      try {
        const results = await Promise.all(missing.map(k => fetchVerseDetails(k)));
        results.forEach((d, i) => { verseCacheRef.current[missing[i]] = d; });
        if (!cancelled) { setVersesLoading(false); bumpCache(); }
      } catch (e) {
        if (!cancelled) { setVersesError(String(e)); setVersesLoading(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [cs?.id, cs?.verseKeys?.join(',')]);

  /* view: which screen is showing */
  const [view, setView] = useState('home'); // 'home' | 'listen' | 'select' | 'ponder' | 'questions' | 'write' | 'title' | sub-sections
  const [subView, setSubView] = useState(null); // dashboard subsection key
  const [helpKey, setHelpKey] = useState(null);
  const [showIntro, setShowIntro] = useState(!DB.getHideIntro());
  const [showSettings, setShowSettings] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [showDashboardFromSession, setShowDashboardFromSession] = useState(false);

  /* toast & confirm */
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);
  const showToast = useCallback((message, time) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ id: Date.now(), message, time, leaving: false });
    toastTimerRef.current = setTimeout(() => {
      setToast(t => t ? { ...t, leaving: true } : null);
      setTimeout(() => setToast(null), 400);
    }, 2600);
  }, []);
  const [confirm, setConfirm] = useState(null);

  /* tafsir sheet */
  const [tafsirOpen, setTafsirOpen] = useState(false);
  const [tafsirVerseKey, setTafsirVerseKey] = useState(null);
  const [tafsirText, setTafsirText] = useState('');
  const [tafsirLoading, setTafsirLoading] = useState(false);
  const tafsirCacheRef = useRef({}); // { key: html }
  const openTafsir = useCallback((vk) => {
    setTafsirOpen(true);
    setTafsirVerseKey(vk);
    if (tafsirCacheRef.current[vk]) {
      setTafsirText(tafsirCacheRef.current[vk]);
      return;
    }
    setTafsirText('');
    setTafsirLoading(true);
    fetchTafsir(vk).then(t => {
      tafsirCacheRef.current[vk] = t;
      setTafsirText(t);
      setTafsirLoading(false);
    }).catch(() => setTafsirLoading(false));
  }, []);

  /* theme switch */
  const setTheme = useCallback((i) => DB.setTheme(i), []);

  /* start a new session */
  const startNewSession = useCallback(async () => {
    if (sessionInProgress) return;
    const furthest = computeFurthestPondered(DB);
    const start = computeNextSessionStart(furthest.surah, furthest.verse);
    setVersesLoading(true);
    let surahInfo = await fetchSurahInfo(start.surah);
    if (!surahInfo) {
      setVersesLoading(false);
      showToast('Could not load surah', '');
      return;
    }
    let surah = start.surah;
    let startVerse = start.verse;
    if (startVerse > surahInfo.verses_count) {
      surah = surah + 1;
      startVerse = 1;
      if (surah > 114) { surah = 2; startVerse = 1; }
      surahInfo = await fetchSurahInfo(surah);
      if (!surahInfo) { setVersesLoading(false); showToast('Could not load surah', ''); return; }
    }
    const verses = await fetchVersesForSession(surah, startVerse, surahInfo.verses_count);
    if (!verses.length) { setVersesLoading(false); showToast('No verses to load', ''); return; }
    verses.forEach(v => { verseCacheRef.current[v.key] = v; });
    bumpCache();
    DB.replaceCurrentSession({
      id: uuid(),
      startedAt: Date.now(),
      surah,
      surahName: surahInfo.name,
      surahVersesCount: surahInfo.verses_count,
      verseKeys: verses.map(v => v.key),
      completedSteps: 0,
      listenIdx: 0,
      listenReached: 0,
      selectedEndIdx: 0,
      ponderIdx: 0,
      qIdx: 0,
      writeActions: [''],
      title: '',
    });
    setVersesLoading(false);
    setView('listen');
  }, [sessionInProgress, showToast]);

  /* ─ helper: merge overlapping sittings ─ */
  const mergeOverlappingSittings = useCallback((newSittingId, ponderedKeys, finalTitle) => {
    const allSittings = DB.sessions.toArray();
    const allActions = DB.actions.toArray();
    const firstKey = ponderedKeys[0];
    const lastKey = ponderedKeys[ponderedKeys.length - 1];
    const fk = parseKey(firstKey), lk = parseKey(lastKey);
    const surah = fk.surah, startV = fk.verse, endV = lk.verse;

    const sessionsToDelete = [];
    const sessionsToTrim = []; // { id, newKeys }
    const actionsToReassign = []; // { id, newSessionId }
    const actionsToCreate = []; // { text, sessionId }
    let mergedActionIds = [];

    allSittings.forEach(s => {
      if (s.id === newSittingId) return;
      if (!s.ponderedKeys || !s.ponderedKeys.length) return;
      const sFirst = parseKey(s.ponderedKeys[0]);
      const sLast = parseKey(s.ponderedKeys[s.ponderedKeys.length - 1]);
      if (sFirst.surah !== surah) return;
      const overlapStart = Math.max(startV, sFirst.verse);
      const overlapEnd = Math.min(endV, sLast.verse);
      if (overlapStart > overlapEnd) return;

      const fullyContained = sFirst.verse >= startV && sLast.verse <= endV;
      const linked = allActions.filter(a => a.sessionId === s.id);

      if (fullyContained) {
        linked.forEach(a => actionsToReassign.push({ id: a.id, newSessionId: newSittingId }));
        mergedActionIds.push(...linked.map(a => a.id));
        sessionsToDelete.push(s.id);
      } else {
        linked.forEach(a => actionsToCreate.push({ text: a.text, sessionId: newSittingId }));
        const newKeys = [];
        s.ponderedKeys.forEach(k => {
          const { verse } = parseKey(k);
          if (verse < startV || verse > endV) newKeys.push(k);
        });
        if (newKeys.length > 0) {
          sessionsToTrim.push({ id: s.id, newKeys });
        } else {
          sessionsToDelete.push(s.id);
        }
      }
    });

    // Execute all in a single transact (no nested transacts)
    window.YDOC.transact(() => {
      // Create duplicated actions
      actionsToCreate.forEach(a => {
        const maxRank = allActions.length
          ? Math.max(...allActions.map(x => (typeof x.ranking === 'number' ? x.ranking : 0)))
          : -1;
        const newAction = {
          id: uuid(),
          text: a.text.trim(),
          ranking: maxRank + 1,
          sessionId: a.sessionId,
          createdAt: Date.now(),
        };
        DB.actions.push([newAction]);
        mergedActionIds.push(newAction.id);
      });

      // Reassign actions to new sitting
      const arrA = DB.actions.toArray();
      actionsToReassign.forEach(ra => {
        const ai = arrA.findIndex(x => x.id === ra.id);
        if (ai >= 0) {
          DB.actions.delete(ai, 1);
          DB.actions.insert(ai, [{ ...arrA[ai], sessionId: ra.newSessionId }]);
        }
      });

      // Trim sessions
      sessionsToTrim.forEach(t => {
        const arrS = DB.sessions.toArray();
        const idx = arrS.findIndex(x => x.id === t.id);
        if (idx >= 0) {
          const old = arrS[idx];
          DB.sessions.delete(idx, 1);
          DB.sessions.insert(idx, [{ ...old, ponderedKeys: t.newKeys }]);
        }
      });

      // Delete sessions (sorted descending)
      const arrS = DB.sessions.toArray();
      const deleteIndices = sessionsToDelete
        .map(sid => arrS.findIndex(x => x.id === sid))
        .filter(i => i >= 0)
        .sort((a, b) => b - a);
      deleteIndices.forEach(i => DB.sessions.delete(i, 1));
    });

    return mergedActionIds;
  }, []);

  /* replay a past sitting */
  const replaySitting = useCallback(async (sitting) => {
    const verseKeys = sitting.verseKeys || [];
    if (!verseKeys.length) { showToast('Nothing to replay', ''); return; }
    setVersesLoading(true);
    try {
      const verses = await Promise.all(verseKeys.map(k => fetchVerseDetails(k)));
      verses.forEach(v => { verseCacheRef.current[v.key] = v; });
      bumpCache();
      const first = parseKey(verseKeys[0]);
      let surahInfo = await fetchSurahInfo(first.surah);
      if (!surahInfo) surahInfo = { name: '', verses_count: 999 };
      // Pre-fill old resolutions
      const oldActions = DB.getActionsSorted().filter(a => a.sessionId === sitting.id);
      const prefillActions = oldActions.length > 0
        ? oldActions.map(a => a.text || '')
        : [''];
      // Pre-fill old title
      const prefillTitle = sitting.title || '';
      DB.replaceCurrentSession({
        id: uuid(),
        startedAt: Date.now(),
        surah: first.surah,
        surahName: surahInfo.name,
        surahVersesCount: surahInfo.verses_count,
        verseKeys,
        completedSteps: 0,
        listenIdx: 0,
        listenReached: 0,
        selectedEndIdx: verseKeys.length - 1,
        ponderIdx: 0,
        qIdx: 0,
        writeActions: prefillActions,
        title: prefillTitle,
        isReplay: true,
        replaySittingId: sitting.id,
      });
      setVersesLoading(false);
      setView('listen');
    } catch (e) {
      setVersesLoading(false);
      showToast('Failed to load sitting', '');
    }
  }, [sessionInProgress, showToast]);

  /* continue an existing session by entering its current step */
  const enterCurrentStep = useCallback(() => {
    if (!cs) return;
    const stepId = STEPS[cs.completedSteps]?.id;
    if (stepId) setView(stepId);
  }, [cs]);

  /* enter a completed step (revisit) */
  const revisitStep = useCallback((stepIdx) => {
    if (!cs) return;
    if (stepIdx >= cs.completedSteps) return;
    setView(STEPS[stepIdx].id);
  }, [cs]);

  /* mark a step complete and return to home */
  const completeStep = useCallback((stepIdx) => {
    if (!cs) return;
    const next = Math.max(cs.completedSteps, stepIdx + 1);
    DB.setCurrentSessionField('completedSteps', next);
    setView('home');
  }, [cs]);

  /* save Write step → save actions → ask for title */
  const submitWrite = useCallback((writeActions) => {
    DB.setCurrentSessionField('writeActions', writeActions);
    DB.setCurrentSessionField('completedSteps', 5);
    setView('title');
  }, []);

  /* finalize session with a title */
  const finalizeSession = useCallback((title) => {
    if (!cs) return;
    const finalTitle = (title || '').trim() || 'A sitting';
    const today = todayStr();
    const ponderedKeys = cs.verseKeys.slice(0, (cs.selectedEndIdx ?? 0) + 1);

    if (cs.isReplay && cs.replaySittingId) {
      // Delete old actions for this sitting, then add new ones
      const oldActions = DB.getActionsSorted().filter(a => a.sessionId === cs.replaySittingId);
      oldActions.forEach(a => DB.deleteAction(a.id));
      const actionIds = [];
      (cs.writeActions || []).map(s => s.trim()).filter(Boolean).forEach(txt => {
        actionIds.push(DB.addAction(txt, cs.replaySittingId));
      });
      // Overwrite the sitting
      const arr = DB.sessions.toArray();
      const idx = arr.findIndex(s => s.id === cs.replaySittingId);
      if (idx >= 0) {
        window.YDOC.transact(() => {
          DB.sessions.delete(idx, 1);
          DB.sessions.insert(idx, [{
            id: cs.replaySittingId,
            title: finalTitle,
            date: today,
            verseKeys: cs.verseKeys,
            ponderedKeys,
            actionIds,
          }]);
        });
      }
      const furthest = computeFurthestPondered(DB);
      DB.setLastPondered(furthest.surah, furthest.verse);
      DB.setLastSessionDate(today);
      DB.clearCurrentSession();
      setShowDashboardFromSession(false);
      setView('home');
      setTimeout(() => setSubView('sittings'), 50);
      return;
    }

    // Normal: finalize session with a title
    const actionIds = [];
    (cs.writeActions || []).map(s => s.trim()).filter(Boolean).forEach(txt => {
      actionIds.push(DB.addAction(txt, cs.id));
    });
    const lastKey = ponderedKeys[ponderedKeys.length - 1];
    const { surah: lastS, verse: lastV } = parseKey(lastKey);
    DB.addSession({
      id: cs.id,
      title: finalTitle,
      date: today,
      verseKeys: cs.verseKeys,
      ponderedKeys,
      actionIds,
    });
    DB.setLastPondered(lastS, lastV);
    DB.setLastSessionDate(today);
    DB.timetableEnsurePrayers();
    DB.clearCurrentSession();
    setView('home');
  }, [cs]);

  /* back from a step to home */
  const goHome = useCallback(() => {
    if (cs && cs.replaySittingId) {
      setSubView('sittings');
      setShowDashboardFromSession(true);
    } else if (cs) {
      setShowDashboardFromSession(true);
    }
    setView('home');
  }, [cs]);

  /* abandon current session — not exposed in UI by default */

  /* style vars */
  const styleVars = {
    '--bg': theme.bg, '--bg-soft': theme.bgSoft,
    '--ink': theme.ink, '--ink-soft': theme.inkSoft, '--ink-faint': theme.inkFaint,
    '--accent': theme.accent, '--accent-soft': theme.accentSoft,
  };
  const fullscreen = view !== 'home' || !!subView;

  /* current verse details from cache */
  const getVerse = useCallback((idx) => {
    if (!cs?.verseKeys?.[idx]) return null;
    return verseCacheRef.current[cs.verseKeys[idx]] || null;
  }, [cs?.verseKeys, verseCacheVersion]);
  const sessionVerses = useMemo(() => {
    if (!cs?.verseKeys) return [];
    return cs.verseKeys.map(k => verseCacheRef.current[k] || { key: k });
  }, [cs?.verseKeys, verseCacheVersion]);

  return (
    <div className="v-root orbit-root" style={styleVars} data-fullscreen={fullscreen} data-theme={theme.id}>
      <PlasmaLayer />
      <OrbitBackdrop />

      {/* Settings button — only on home */}
      {view === 'home' && !subView && !showIntro && !showSettings && !showSync && (
        <SettingsButton onClick={() => setShowSettings(true)} />
      )}

      {view === 'home' && !subView && (
        <HomeView
          DB={DB}
          cs={cs}
          dailyDoneToday={dailyDoneToday}
          versesLoading={versesLoading}
          startNewSession={startNewSession}
          enterCurrentStep={enterCurrentStep}
          revisitStep={revisitStep}
          openSection={(key) => setSubView(key)}
          openHelp={(key) => setHelpKey(key)}
          themeIdx={themeIdx}
          setTheme={setTheme}
          showDashboardFromSession={showDashboardFromSession}
        />
      )}

      {view === 'listen' && cs && (
        <ListenStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          versesLoading={versesLoading}
          onBack={goHome}
          onContinue={() => completeStep(0)}
          openTafsir={openTafsir}
        />
      )}

      {view === 'select' && cs && (
        <SelectionStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onContinue={() => completeStep(1)}
        />
      )}

      {view === 'ponder' && cs && (
        <PonderStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onContinue={() => completeStep(2)}
          openTafsir={openTafsir}
          showToast={showToast}
        />
      )}

      {view === 'questions' && cs && (
        <QuestionsStep
          cs={cs}
          DB={DB}
          verses={sessionVerses}
          onBack={goHome}
          onComplete={() => completeStep(3)}
          openTafsir={openTafsir}
          showToast={showToast}
        />
      )}

      {view === 'write' && cs && (
        <WriteStep
          cs={cs}
          DB={DB}
          onBack={goHome}
          onSave={submitWrite}
        />
      )}

      {view === 'title' && cs && (
        <TitleStep
          cs={cs}
          onSubmit={finalizeSession}
        />
      )}

      {subView && (
        <SubsectionRouter
          subView={subView}
          DB={DB}
          onClose={() => setSubView(null)}
          openHelp={(key) => setHelpKey(key)}
          onReplaySitting={replaySitting}
        />
      )}

      {/* Intro overlay */}
      {showIntro && (
        <IntroOverlay
          DB={DB}
          onDismiss={() => setShowIntro(false)}
        />
      )}

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          DB={DB}
          onClose={() => setShowSettings(false)}
          onOpenSync={() => { setShowSettings(false); setShowSync(true); }}
        />
      )}

      {/* Sync panel */}
      {showSync && (
        <SyncPanel
          DB={DB}
          onClose={() => setShowSync(false)}
        />
      )}

      {tafsirOpen && !showIntro && (
        <TafsirSheet
          tafsirText={tafsirText}
          loading={tafsirLoading}
          verseKey={tafsirVerseKey}
          onClose={() => setTafsirOpen(false)}
        />
      )}

      {helpKey && (
        <HelpModal
          help={window.HELP_TEXTS[helpKey]}
          onClose={() => setHelpKey(null)}
        />
      )}

      {toast && <Toast {...toast} />}
      {confirm && <ConfirmModal {...confirm} />}

      <OrbitThemePicker themeIdx={themeIdx} setThemeIdx={setTheme} />
    </div>
  );
}

/* ─────────── PLASMA ─────────── */
function PlasmaLayer() {
  return (
    <div className="plasma-layer" aria-hidden>
      <div className="plasma-blob a" />
      <div className="plasma-blob b" />
      <div className="plasma-blob c" />
    </div>
  );
}

/* ─────────── STARS (bigger variety, some luminous) ─────────── */
function OrbitBackdrop() {
  const stars = useMemo(() => {
    return Array.from({ length: 110 }, (_, i) => {
      const lum = (i % 5 === 0); // ~20% are luminous & bigger
      const baseSize = lum
        ? 1.6 + ((i * 13) % 11) / 7   // 1.6 – 3.2px
        : 0.5 + ((i * 17) % 8) / 6;   // 0.5 – 1.8px
      return {
        x: (i * 37 + (i * i * 7) % 31) % 100,
        y: (i * 53 + (i * i * 3) % 41) % 100,
        s: baseSize,
        lum,
        lo: lum ? 0.35 + ((i * 7) % 4) / 18 : 0.08 + ((i * 7) % 4) / 18,
        hi: lum ? 0.85 + ((i * 11) % 4) / 25 : 0.35 + ((i * 11) % 6) / 18,
        dur: 4 + (i % 11) * 0.7,
        delay: (i % 13) * 0.5,
      };
    });
  }, []);
  return (
    <div className="orbit-backdrop" aria-hidden>
      {stars.map((s, i) => (
        <span key={i} data-lum={s.lum ? '1' : '0'} style={{
          left: `${s.x}%`, top: `${s.y}%`,
          width: `${s.s}px`, height: `${s.s}px`,
          '--star-lo': s.lo, '--star-hi': s.hi,
          '--star-dur': `${s.dur}s`,
          animationDelay: `${s.delay}s`,
        }} />
      ))}
      <div className="orbit-glow" />
    </div>
  );
}

/* ─────────── HOME ─────────── */
function HomeView({ DB, cs, dailyDoneToday, versesLoading, startNewSession, enterCurrentStep, revisitStep, openSection, openHelp, themeIdx, setTheme, showDashboardFromSession }) {
  // During a session: only the center button + pills, unless user hit back
  if (cs && !showDashboardFromSession) {
    return (
      <div className="home-scroll">
        <div className="home-center">
          <InSessionCenter
            cs={cs}
            versesLoading={versesLoading}
            startNewSession={startNewSession}
            enterCurrentStep={enterCurrentStep}
            revisitStep={revisitStep}
          />
        </div>
      </div>
    );
  }

  // No session in progress, or user is session but chose to see dashboard
  return (
    <div className="home-scroll">
      {cs && showDashboardFromSession && (
        <div className="return-banner">
          <span className="return-banner-text">You are in a sitting — {STEPS[cs.completedSteps]?.label || 'Listen'}</span>
          <button className="action-soft" onClick={enterCurrentStep}>Return to sitting</button>
        </div>
      )}
      <Dashboard DB={DB} openSection={openSection} openHelp={openHelp} dailyDoneToday={cs ? false : dailyDoneToday} startNewSession={cs ? null : startNewSession} inSession={!!cs} />
    </div>
  );
}

function InSessionCenter({ cs, versesLoading, startNewSession, enterCurrentStep, revisitStep }) {
  const completedCount = cs?.completedSteps ?? 0;
  const completedSteps = STEPS.slice(0, completedCount);
  const isStarting = !cs;
  const nextStep = STEPS[completedCount];
  const label = isStarting ? 'Listen' : (nextStep ? nextStep.label : 'Listen');
  const onClick = () => {
    if (versesLoading) return;
    if (isStarting) startNewSession();
    else enterCurrentStep();
  };
  return (
    <>
      <div className="center-pills">
        {completedSteps.map((s, i) => (
          <button key={s.id} className="center-pill" onClick={() => revisitStep(i)}>
            <span className="center-pill-dot" />
            <span>{s.label}</span>
          </button>
        ))}
      </div>
      <div className="center-hub-button-wrap">
        <button className="center-button" onClick={onClick} aria-label={`Begin ${label}`} disabled={versesLoading}>
          <span className="center-button-label">
            {versesLoading ? <span className="loading-dots"><span/><span/><span/></span> : label}
          </span>
        </button>
      </div>
    </>
  );
}

/* ─────────── DASHBOARD (card grid) ─────────── */
function Dashboard({ DB, openSection, openHelp, dailyDoneToday, startNewSession, inSession }) {
  useYjsTick();
  const sessions = DB.sessions.toArray();
  const actions = DB.getActionsSorted();
  const tomorrow = DB.timetable.toArray();
  const paradise = DB.getText('paradise');
  const hellfire = DB.getText('hellfire');
  const provision = DB.getText('provision');
  const provisionWords = wordCount(provision);

  const sittingsPreview = sessions.length
    ? (sessions.slice(-2).reverse().map(s => s.title).filter(Boolean).join(' · ') || `${sessions.length} sitting${sessions.length > 1 ? 's' : ''}`)
    : 'Complete your first cycle';
  const abodesPreview = paradise || hellfire
    ? (paradise ? wordCount(paradise) + ' words on Paradise' : 'Paradise empty') + (hellfire ? ' · ' + wordCount(hellfire) + ' words on Fire' : '')
    : 'Picture both abodes';
  const resolutionsPreview = actions.length
    ? (actions[0]?.text?.slice(0, 70) || '—') + (actions.length > 1 ? ` +${actions.length - 1} more` : '')
    : 'No commitments yet';
  const tomorrowPreview = tomorrow.length
    ? (`${tomorrow.length} blocks for the day`)
    : 'Plan tomorrow tonight';
  const provisionPreview = provision
    ? (provision.slice(0, 80) + (provision.length > 80 ? '…' : ''))
    : 'Write what you carry daily';
  const goalsAny = window.GOAL_FIELDS.some(g => (DB.getGoal(g.key) || '').trim());
  const horizonsPreview = goalsAny ? 'Your aims are set' : 'Set your horizons';

  const cards = [
    { key: 'sittings',    icon: '📜', title: 'Sittings',       eyebrow: `${sessions.length} past`,   preview: sittingsPreview,    empty: !sessions.length, helpKey: 'sittings' },
    { key: 'abodes',      icon: '🌿', title: 'Paradise & Fire',eyebrow: 'Two writings',              preview: abodesPreview,      empty: !(paradise || hellfire), helpKey: 'abodes' },
    { key: 'resolutions', icon: '⚡', title: 'Resolutions',    eyebrow: `${actions.length} active`,  preview: resolutionsPreview, empty: !actions.length, helpKey: 'resolutions' },
    { key: 'tomorrow',    icon: '🌙', title: 'Tomorrow',       eyebrow: 'The day ahead',             preview: tomorrowPreview,    empty: !tomorrow.length, helpKey: 'tomorrow' },
    { key: 'provision',   icon: '📖', title: 'Provision',      eyebrow: `${provisionWords} / ${window.PROVISION_WORD_LIMIT} words`, preview: provisionPreview, empty: !provision, helpKey: 'provision' },
    { key: 'horizons',    icon: '🎯', title: 'Horizons',       eyebrow: 'Your aims',                 preview: horizonsPreview,    empty: !goalsAny, helpKey: 'horizons' },
  ];

  function DashLockedBanner() {
    const [t, setT] = useState(countdownToMidnight);
    const ready = t.h === 0 && t.m === 0 && t.s === 0;
    useEffect(() => {
      const i = setInterval(() => setT(countdownToMidnight()), 1000);
      return () => clearInterval(i);
    }, []);

    // Compute next session verse range
    const nextRange = useMemo(() => {
      const furthest = computeFurthestPondered(DB);
      const start = computeNextSessionStart(furthest.surah, furthest.verse);
      const endVerse = start.verse + window.SESSION_VERSES_TARGET - 1;
      return { surah: start.surah, startVerse: start.verse, endVerse };
    }, [sessions]);

    const handleClick = () => {
      if (ready) startNewSession();
      else openHelp('nextSession');
    };
    return (
      <div className="dash-locked-card" onClick={handleClick}>
        <div className="dash-locked-icon">
          {ready ? (
            <svg viewBox="0 0 24 24" style={{ stroke: 'var(--accent)' }}><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
          ) : (
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          )}
        </div>
        <div className="dash-locked-info">
          <div className="dash-locked-label">{ready ? 'Your sitting is ready' : 'Next sitting opens in'}</div>
          <div className="dash-locked-time">{ready ? 'Begin' : `${pad2(t.h)}:${pad2(t.m)}:${pad2(t.s)}`}</div>
          <div className="dash-locked-verses">{nextRange.surah}:{nextRange.startVerse} – {nextRange.surah}:{nextRange.endVerse}</div>
        </div>
      </div>
    );
  }

  return (
    <>
      {!inSession && dailyDoneToday && <DashLockedBanner />}
      {!inSession && !dailyDoneToday && (
        <div className="home-center">
          <div className="center-hub-button-wrap">

/* ─────────── SYNC PANEL (WebRTC + Yjs) ─────────── */
function SyncPanel({ DB, onClose }) {
  useYjsTick();
  const [mode, setMode] = useState(null); // null | 'host' | 'guest'
  const [step, setStep] = useState(0); // 0 = offer/exchange, 1 = answer/exchange
  const [hostCode, setHostCode] = useState('');
  const [guestCode, setGuestCode] = useState('');
  const [pasteInput, setPasteInput] = useState('');
  const [status, setStatus] = useState('idle');
  const [statusMessage, setStatusMessage] = useState('');
  const [copied, setCopied] = useState({ host: false, guest: false });

  const iceServers = useMemo(() => [{ urls: 'stun:stun.l.google.com:19302' }], []);

  // Shared: set up Yjs sync over a given data channel
  const attachDataChannel = useCallback((dc) => {
    const sendUpdate = (update, origin) => {
      if (origin === 'remote') return;
      if (dc.readyState === 'open') {
        dc.send(JSON.stringify({ type: 'sync-update', data: Array.from(update) }));
      }
    };
    window.YDOC.on('update', sendUpdate);

    dc.onopen = () => {
      setStatus('connected');
      setStatusMessage('Connected — syncing your data.');
      const state = window.Y.encodeStateAsUpdate(window.YDOC);
      dc.send(JSON.stringify({ type: 'sync-init', state: Array.from(state) }));
      dc.send(JSON.stringify({ type: 'sync-ready' }));
    };
    dc.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'sync-init') {
          window.Y.applyUpdate(window.YDOC, new Uint8Array(msg.state), 'remote');
        } else if (msg.type === 'sync-update') {
          window.Y.applyUpdate(window.YDOC, new Uint8Array(msg.data), 'remote');
        } else if (msg.type === 'sync-ready') {
          setStatus('connected');
          setStatusMessage('Connected — syncing your data.');
        }
      } catch(e) {}
    };
    dc.onerror = () => {
      setStatus('error');
      setStatusMessage('Data channel error.');
    };

    return () => { window.YDOC.off('update', sendUpdate); };
  }, []);

  // Host: create offer
  const startHost = useCallback(async () => {
    setMode('host');
    setStep(0);
    setStatus('generating');
    setStatusMessage('Preparing connection…');
    try {
      const pc = new RTCPeerConnection({ iceServers });
      window.__miranSyncPC = pc;
      const dc = pc.createDataChannel('miran-sync', { ordered: true });

      attachDataChannel(dc);

      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected') {
          setStep(1);
        } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          setStatus('error');
          setStatusMessage('Peer disconnected or unreachable.');
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.addEventListener('icegatheringstatechange', () => {
          if (pc.iceGatheringState === 'complete') resolve();
        });
      });

      const code = compressForSync(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
      setHostCode(code);
      setStatus('waiting');
      setStatusMessage('Copy your code and send it to the other device.');
    } catch(e) {
      setStatus('error');
      setStatusMessage('Failed: ' + String(e).slice(0, 60));
    }
  }, [iceServers, attachDataChannel]);

  // Guest: apply offer and create answer
  const applyOffer = useCallback(async () => {
    if (!pasteInput.trim()) return;
    try {
      const data = JSON.parse(decompressForSync(pasteInput.trim()));
      if (data.type !== 'offer') { setStatus('error'); setStatusMessage('Not a valid host code.'); return; }

      setStatus('connecting');
      setStatusMessage('Creating connection…');

      const pc = new RTCPeerConnection({ iceServers });

      pc.ondatachannel = (evt) => {
        attachDataChannel(evt.channel);
      };

      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected') {
          setStep(1);
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.addEventListener('icegatheringstatechange', () => {
          if (pc.iceGatheringState === 'complete') resolve();
        });
      });

      const code = compressForSync(JSON.stringify({ type: 'answer', sdp: pc.localDescription.sdp }));
      setGuestCode(code);
      setStep(1);
      setStatus('waiting');
      setStatusMessage('Send this answer code back to the host device.');
    } catch(e) {
      setStatus('error');
      setStatusMessage('Failed: ' + String(e).slice(0, 60));
    }
  }, [pasteInput, iceServers, attachDataChannel]);

  // Host: apply answer from guest
  const applyAnswer = useCallback(async () => {
    if (!pasteInput.trim()) return;
    setStatus('connecting');
    setStatusMessage('Establishing connection…');
    try {
      const data = JSON.parse(decompressForSync(pasteInput.trim()));
      if (data.type === 'answer') {
        // We need the stored pc — store it on window temporarily
        if (window.__miranSyncPC) {
          await window.__miranSyncPC.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
          setStep(1);
        } else {
          setStatus('error');
          setStatusMessage('Connection lost. Please restart sync.');
        }
      }
    } catch(e) {
      setStatus('error');
      setStatusMessage('Invalid answer code.');
    }
  }, [pasteInput]);

  const copyToClipboard = (text, key) => {
    navigator.clipboard.writeText(text).catch(() => {});
    setCopied(prev => ({ ...prev, [key]: true }));
    setTimeout(() => setCopied(prev => ({ ...prev, [key]: false })), 2000);
  };

  const startGuest = useCallback(() => {
    setMode('guest');
    setStep(0);
    setStatus('idle');
    setStatusMessage('Paste the host code below…');
  }, []);

  const reset = () => {
    if (window.__miranSyncPC) { window.__miranSyncPC.close(); delete window.__miranSyncPC; }
    setMode(null); setStep(0);
    setHostCode(''); setGuestCode(''); setPasteInput('');
    setStatus('idle'); setStatusMessage('');
    setCopied({ host: false, guest: false });
  };

  const statusDotClass = status === 'connected' ? 'connected' : (status === 'connecting' || status === 'generating' || status === 'waiting' ? 'connecting' : 'disconnected');

  if (!mode) {
    return (
      <div className="sync-backdrop" onClick={onClose}>
        <div className="sync-panel" onClick={(e) => e.stopPropagation()}>
          <div className="sync-title">Sync devices</div>
          <p className="sync-step-hint" style={{ textAlign: 'center' }}>
            Connect your phone and computer so your sittings, resolutions, and writings stay in sync — no account needed.
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center', marginTop: 8 }}>
            <button className="action" onClick={startHost}>
              <span className="action-text">Start sync → get a code</span>
              <span className="action-line" />
            </button>
            <span style={{ fontSize: 12, color: 'var(--ink-faint)', fontStyle: 'italic' }}>or</span>
            <button className="action-soft" onClick={startGuest}>I have a code → join</button>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', marginTop: 12 }}>
            <button className="action-soft" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="sync-backdrop" onClick={onClose}>
      <div className="sync-panel" onClick={(e) => e.stopPropagation()}>
        <div className="sync-title">{mode === 'host' ? 'Hosting sync' : 'Joining sync'}</div>

        <div className="sett-sync-status">
          <span className={`sett-sync-dot ${statusDotClass}`} />
          <span>{statusMessage || status}</span>
        </div>

        {mode === 'host' && step === 0 && (
          <>
            <div className="sync-step">
              <div className="sync-step-label">1. Your code</div>
              <div className="sync-step-hint">Copy this code. Send it to the other device — paste it in Messages, AirDrop, or any messenger.</div>
              {hostCode ? (
                <>
                  <div className="sync-code-area" onClick={() => copyToClipboard(hostCode, 'host')}>{hostCode}</div>
                  <button className="sync-copy-btn" onClick={() => copyToClipboard(hostCode, 'host')}>
                    {copied.host ? 'Copied' : 'Copy'}
                  </button>
                </>
              ) : (
                <div className="sync-code-area" style={{ opacity: 0.4 }}>Generating…</div>
              )}
            </div>
            <div className="sync-step">
              <div className="sync-step-label">2. Paste their answer</div>
              <div className="sync-step-hint">Once you get a code back from the other device, paste it here.</div>
              <input className="sync-code-area" type="text" value={pasteInput} placeholder="Paste the answer code…" onChange={(e) => setPasteInput(e.target.value)} />
            </div>
            <div className="sync-actions">
              <button className="action-soft" onClick={reset}>Cancel</button>
              <button className="action" onClick={applyAnswer} disabled={!pasteInput.trim()}>
                <span className="action-text">Connect</span>
                <span className="action-line" />
              </button>
            </div>
          </>
        )}

        {mode === 'guest' && step === 0 && (
          <>
            <div className="sync-step">
              <div className="sync-step-label">1. Paste the host code</div>
              <div className="sync-step-hint">Copy the code from the host device and paste it below.</div>
              <input className="sync-code-area" type="text" value={pasteInput} placeholder="Paste the host code…" onChange={(e) => setPasteInput(e.target.value)} />
            </div>
            <div className="sync-actions">
              <button className="action-soft" onClick={reset}>Cancel</button>
              <button className="action" onClick={applyOffer} disabled={!pasteInput.trim()}>
                <span className="action-text">Connect</span>
                <span className="action-line" />
              </button>
            </div>
          </>
        )}

        {mode === 'guest' && step === 1 && (
          <>
            <div className="sync-step">
              <div className="sync-step-label">2. Send this code back</div>
              <div className="sync-step-hint">Copy this answer code and send it back to the host. The host will paste it on their device.</div>
              {guestCode ? (
                <>
                  <div className="sync-code-area" onClick={() => copyToClipboard(guestCode, 'guest')}>{guestCode}</div>
                  <button className="sync-copy-btn" onClick={() => copyToClipboard(guestCode, 'guest')}>
                    {copied.guest ? 'Copied' : 'Copy'}
                  </button>
                </>
              ) : (
                <div className="sync-code-area" style={{ opacity: 0.4 }}>Generating…</div>
              )}
            </div>
            <div className="sync-actions">
              <button className="action-soft" onClick={reset}>Cancel</button>
            </div>
          </>
        )}

        {mode === 'host' && step === 1 && (
          <>
            <div className="sync-step">
              <div className="sync-step-label">Connected</div>
              <div className="sync-step-hint">Your devices are syncing. Data will merge automatically.</div>
            </div>
            <div className="sync-actions">
              <button className="action-soft" onClick={reset}>Disconnect</button>
            </div>
          </>
        )}

        {status === 'error' && (
          <div className="sync-actions">
            <button className="action-soft" onClick={reset}>Try again</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─────────── VERSE BODY (shared) ─────────── */
function VerseBody({ verse, loading }) {
  const arabicRef = useRef(null);
  const transRef = useRef(null);
  useEffect(() => {
    const check = (el) => { if (!el) return; el.dataset.overflowing = el.scrollHeight > el.clientHeight + 2 ? 'true' : 'false'; };
    const a = arabicRef.current, t = transRef.current;
    check(a); check(t);
    const obs = [];
    [a, t].forEach(el => {
      if (!el || typeof ResizeObserver === 'undefined') return;
      const ro = new ResizeObserver(() => check(el));
      ro.observe(el);
      if (el.firstChild) ro.observe(el.firstChild);
      obs.push(ro);
    });
    const onR = () => { check(a); check(t); };
    window.addEventListener('resize', onR);
    return () => { obs.forEach(o => o.disconnect()); window.removeEventListener('resize', onR); };
  }, [verse?.arabic, verse?.translation]);
  return (
    <div className="step-fs-body">
      <div className="verse-fs-arabic-wrap" ref={arabicRef}>
        {verse?.arabic ? (
          <div className="verse-fs-arabic arabic-font">{verse.arabic}</div>
        ) : (
          <div className="verse-skeleton">···</div>
        )}
      </div>
      <div className="verse-fs-translation-wrap" ref={transRef}>
        <div className="verse-fs-translation">
          {verse?.translation || (loading ? <span className="loading-dots"><span/><span/><span/></span> : '')}
        </div>
      </div>
    </div>
  );
}

/* ─────────── LISTEN STEP (multi-verse) ─────────── */
function ListenStep({ cs, DB, verses, versesLoading, onBack, onContinue, openTafsir }) {
  const total = verses.length;
  const [idx, setIdx] = useState(cs.listenIdx ?? 0);
  const [reachedIdx, setReachedIdx] = useState(cs.listenReached ?? 0);
  useEffect(() => { DB.setCurrentSessionField('listenIdx', idx); }, [idx]);
  useEffect(() => { DB.setCurrentSessionField('listenReached', reachedIdx); }, [reachedIdx]);

  const verse = verses[idx];
  const audioRef = useRef(null);
  const autoPlayNextRef = useRef(true);
  const [audioState, setAudioState] = useState({ playing: false, finished: false, current: 0, duration: 0 });

  // Set up audio for current verse
  useEffect(() => {
    if (!verse?.audioUrl) {
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      setAudioState({ playing: false, finished: false, current: 0, duration: 0 });
      return;
    }
    const a = new Audio(verse.audioUrl);
    a.preload = 'auto';
    audioRef.current = a;

    const onPlay = () => setAudioState(s => ({ ...s, playing: true, finished: false }));
    const onPause = () => { setAudioState(s => ({ ...s, playing: false })); };
    const onEnded = () => {
      setAudioState(s => ({ ...s, playing: false, finished: true }));
      if (idx < total - 1) {
        autoPlayNextRef.current = true;
        setIdx(i => i + 1);
        setReachedIdx(r => Math.max(r, idx + 1));
      } else {
        setReachedIdx(total - 1);
      }
    };
    const onTime = () => setAudioState(s => ({ ...s, current: a.currentTime, duration: a.duration || s.duration }));
    const onMeta = () => setAudioState(s => ({ ...s, duration: a.duration || 0 }));
    a.addEventListener('play', onPlay);
    a.addEventListener('pause', onPause);
    a.addEventListener('ended', onEnded);
    a.addEventListener('timeupdate', onTime);
    a.addEventListener('loadedmetadata', onMeta);

    if (autoPlayNextRef.current) { a.play().catch(() => { autoPlayNextRef.current = false; }); }

    return () => {
      a.pause();
      a.removeEventListener('play', onPlay);
      a.removeEventListener('pause', onPause);
      a.removeEventListener('ended', onEnded);
      a.removeEventListener('timeupdate', onTime);
      a.removeEventListener('loadedmetadata', onMeta);
    };
  }, [verse?.audioUrl, idx, total]);

  const togglePlay = useCallback(() => {
    const a = audioRef.current;
    if (!a) return;
    if (!audioState.playing) {
      autoPlayNextRef.current = true;
      a.play().catch(() => {});
    } else {
      autoPlayNextRef.current = false;
      a.pause();
    }
  }, [audioState.playing]);
  const replayCurrent = useCallback(() => {
    const a = audioRef.current;
    if (!a) return;
    a.currentTime = 0;
    autoPlayNextRef.current = true;
    a.play().catch(() => {});
  }, []);
  const goPrev = useCallback(() => {
    if (idx <= 0) return;
    if (audioRef.current) audioRef.current.pause();
    autoPlayNextRef.current = false; // don't auto-play when manually navigating
    setIdx(i => i - 1);
  }, [idx]);
  const goNext = useCallback(() => {
    if (idx >= total - 1) return;
    if (audioRef.current) audioRef.current.pause();
    autoPlayNextRef.current = false; // don't auto-play when manually navigating
    setIdx(i => i + 1);
    setReachedIdx(r => Math.max(r, idx + 1));
  }, [idx, total]);
  const repeatAll = useCallback(() => {
    setIdx(0);
    setReachedIdx(0);
    autoPlayNextRef.current = true;
    setTimeout(() => {
      if (audioRef.current) {
        audioRef.current.currentTime = 0;
        audioRef.current.play().catch(() => {});
      }
    }, 200);
  }, []);

  const playing = audioState.playing;
  const atEnd = reachedIdx >= total - 1;
  const surahRef = `Surah ${cs.surahName} · ${cs.surah}:${verse?.verse ?? '—'}`;

/* ─────────── PONDER STEP (multi-verse, no audio, n/2 min timer, tafsir) ─────────── */
function PonderStep({ cs, DB, verses, onBack, onContinue, openTafsir, showToast }) {
  const selectedCount = (cs.selectedEndIdx ?? 0) + 1;
  const total = selectedCount;
  const [idx, setIdx] = useState(Math.min(cs.ponderIdx ?? 0, total - 1));
  useEffect(() => { DB.setCurrentSessionField('ponderIdx', idx); }, [idx]);

  const totalSeconds = Math.max(30, (selectedCount / 2) * 60);
  const startedAtRef = useRef(Date.now() - (cs.ponderElapsedMs || 0));
  const [remaining, setRemaining] = useState(() => {
    const elapsed = (Date.now() - startedAtRef.current) / 1000;
    return Math.max(0, totalSeconds - elapsed);
  });
  useEffect(() => {
    const t = setInterval(() => {
      const elapsed = (Date.now() - startedAtRef.current) / 1000;
      const rem = Math.max(0, totalSeconds - elapsed);
      setRemaining(rem);
      DB.setCurrentSessionField('ponderElapsedMs', Math.floor(elapsed * 1000));
      if (rem <= 0) clearInterval(t);
    }, 500);
    return () => clearInterval(t);
  }, [totalSeconds]);

  const ready = remaining <= 0;
  const verse = verses[idx];
  const tryContinue = () => {
    if (!ready) { showToast('Sit a little longer', formatTime(remaining)); return; }
    onContinue();
  };

  return (
    <div className="step-fs">
      <BackButton onClick={onBack} />
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Ponder</div>
        <VersePositionIndicator idx={idx} total={total} reachedIdx={total - 1} />
        <div className="step-fs-ref">Surah {cs.surahName} · {cs.surah}:{verse?.verse ?? '—'}</div>
      </div>
      <VerseBody verse={verse} />
      <div className="step-fs-bottom">
        <div className="verse-nav">
          <button className="verse-nav-arrow" onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx <= 0} aria-label="Previous verse">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button className="verse-nav-arrow" onClick={() => setIdx(i => Math.min(total - 1, i + 1))} disabled={idx >= total - 1} aria-label="Next verse">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div className="ponder-instruction">
          {selectedCount === 1 ? 'Sit with this verse.' : `Sit with these ${selectedCount} verses.`} Let them move through you.
          {' '}{Math.ceil(selectedCount / 2)} minute{selectedCount > 2 ? 's' : ''} — no less.
        </div>
        <div className="verse-fs-actions">
          <button className="action-soft" onClick={() => openTafsir(verse.key)} disabled={!verse?.key}>Tafsir</button>
          <button className="action" data-blocked={!ready} onClick={tryContinue}>
            <span className="action-text">Continue</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

  const [remaining, setRemaining] = useState(() => {
    const elapsed = (Date.now() - startedAtRef.current) / 1000;
    return Math.max(0, totalSeconds - elapsed);
  });
  useEffect(() => {
    const t = setInterval(() => {
      const elapsed = (Date.now() - startedAtRef.current) / 1000;
      const rem = Math.max(0, totalSeconds - elapsed);
      setRemaining(rem);
      DB.setCurrentSessionField('qsElapsedMs', Math.floor(elapsed * 1000));

/* ── Sittings Timeline ── */
function SittingsBody({ DB, onReplaySitting, onClose }) {
  const sessions = DB.sessions.toArray();
  // Group sessions by surah
  const grouped = useMemo(() => {
    const m = {};
    sessions.forEach(s => {
      const keys = s.ponderedKeys || [];
      if (!keys.length) return;
      const sNum = parseKey(keys[0]).surah;
      if (!m[sNum]) m[sNum] = [];
      m[sNum].push(s);
    });
    return m;
  }, [sessions]);

  // Get chapters info from existing session data + API
  const [surahData, setSurahData] = useState({});
  useEffect(() => {
    const nums = Object.keys(grouped).map(Number);
    if (!nums.length) return;
    Promise.all(nums.map(n => fetchSurahInfo(n).catch(() => null))).then(infos => {
      const map = {};
      infos.forEach((info, i) => {
        map[nums[i]] = info || { name: `Surah ${nums[i]}`, verses_count: '—' };
      });
      setSurahData(map);
    });
  }, [grouped]);

  // Next session prediction
  const nextSessionInfo = useMemo(() => {
    const furthest = computeFurthestPondered(DB);
    const start = computeNextSessionStart(furthest.surah, furthest.verse);
    return {
      surah: start.surah,
      startVerse: start.verse,
      endVerse: start.verse + window.SESSION_VERSES_TARGET - 1,
    };
  }, [sessions]);

  if (!sessions.length) return <div className="sit-empty">No sittings yet. Complete your first cycle.</div>;

  const surahNumbers = Object.keys(grouped).map(Number).sort((a, b) => a - b);

  return (
    <div className="timeline-wrap">
      {surahNumbers.map(sNum => {
        const sittings = grouped[sNum].sort((a, b) => {
          const fa = parseKey((a.ponderedKeys || [])[0] || '1:0');
          const fb = parseKey((b.ponderedKeys || [])[0] || '1:0');
          return fa.verse - fb.verse;
        });
        const name = surahData[sNum]?.name || `Surah ${sNum}`;
        const totalV = surahData[sNum]?.verses_count || '—';
        const isPredicted = nextSessionInfo.surah === sNum;

        return (
          <div key={sNum} className="timeline-surah">
            <div className="timeline-surah-head">
              <span className="timeline-surah-num">{sNum}</span>
              <span className="timeline-surah-name">{name}</span>
              {totalV !== '—' && <span className="timeline-surah-total">· {totalV} verses</span>}
            </div>
            <div className="timeline-line">
              {sittings.map(s => {
                const keys = s.ponderedKeys || [];
                const fk = parseKey(keys[0] || `${sNum}:1`);
                const lk = parseKey(keys[keys.length - 1] || `${sNum}:1`);
                return (
                  <div key={s.id} className="timeline-point" onClick={() => { if (onClose) onClose(); if (onReplaySitting) onReplaySitting(s); }}>
                    <span className="timeline-dot" />
                    <span className="timeline-range">{fk.verse} → {lk.verse}</span>
                    <span className="timeline-title">{s.title || 'A sitting'}</span>
                    <span className="timeline-date">{s.date}</span>
                  </div>
                );
              })}
              {isPredicted && (
                <div className="timeline-point predicted">
                  <span className="timeline-dot" style={{ borderStyle: 'dashed', opacity: 0.5 }} />
                  <span className="timeline-range">{nextSessionInfo.startVerse} → {Math.min(nextSessionInfo.endVerse, totalV === '—' ? 999 : totalV)}</span>
                  <span className="timeline-title" style={{ opacity: 0.5, fontStyle: 'italic' }}>Next sitting</span>
                  <CountdownTimer />
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CountdownTimer() {
  const [t, setT] = useState(countdownToMidnight);
  useEffect(() => {
    const i = setInterval(() => setT(countdownToMidnight()), 1000);
    return () => clearInterval(i);
  }, []);
  const ready = t.h === 0 && t.m === 0 && t.s === 0;
  return (
    <span className="timeline-date">{ready ? 'Ready' : `${pad2(t.h)}:${pad2(t.m)}:${pad2(t.s)}`}</span>
  );
}

/* ── Resolutions ── */
function ResolutionsBody({ DB }) {
  const all = DB.getActionsSorted();
  const [showAll, setShowAll] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const visible = showAll ? all : all.slice(0, 3);
  if (!all.length) return <div className="sit-empty">No resolutions yet. They're added each time you complete a sitting.</div>;
  const moveUp = (idx) => {
    if (idx <= 0) return;
    DB.swapActionRanking(all[idx].id, all[idx - 1].id);
  };
  const moveDown = (idx) => {
    if (idx >= all.length - 1) return;
    DB.swapActionRanking(all[idx].id, all[idx + 1].id);
  };
  const deleteAction = (id) => DB.deleteAction(id);
  const saveEdit = (id, text) => {
    DB.updateAction(id, { text: text || '' });
    setEditingId(null);
  };
  return (
    <>
      {visible.map((a, i) => (
        <div key={a.id} className="res-row">
          <div className="res-row-rank">{i + 1}</div>
          {editingId === a.id ? (
            <input
              className="res-row-edit"
              type="text"
              defaultValue={a.text}
              autoFocus
              onBlur={(e) => saveEdit(a.id, e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') saveEdit(a.id, e.target.value);
                if (e.key === 'Escape') setEditingId(null);
              }}
              style={{ flex: 1, border: 'none', borderBottom: '1px solid var(--accent)', background: 'transparent', color: 'var(--ink)', fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic', fontSize: 15, padding: '4px 0', outline: 'none' }}
            />
          ) : (
            <div className="res-row-text" onClick={() => setEditingId(a.id)}>{a.text}</div>
          )}
          <div className="res-row-controls">
            <button className="res-delete" onClick={() => deleteAction(a.id)} aria-label="Delete" title="Delete">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <button className="res-arrow" onClick={() => moveUp(i)} disabled={i === 0} aria-label="Move up">
              <svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>
            </button>
            <button className="res-arrow" onClick={() => moveDown(i)} disabled={i === all.length - 1} aria-label="Move down">
              <svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      ))}
      {!showAll && all.length > 3 && (
        <button className="sit-show-more" onClick={() => setShowAll(true)}>Show all {all.length}</button>
      )}
      <div className="res-meta">Click to edit, delete with ×, reorder with arrows.</div>
    </>
  );
}

/* ── Tomorrow (timetable) ── */
function TomorrowBody({ DB }) {
  useEffect(() => { DB.timetableEnsurePrayers(); }, []);
  const all = DB.timetable.toArray();

  // Timed blocks sort by time ascending, then untimed blocks by position
  const sorted = useMemo(() => {
    const timed = all.filter(b => b.time && b.time.trim());
    const untimed = all.filter(b => !b.time || !b.time.trim());
    timed.sort((a, b) => a.time.localeCompare(b.time));
    untimed.sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
    return [...timed, ...untimed];
  }, [all]);

  const updateTime = (id, time) => DB.timetableUpdate(id, { time });
  const updateLabel = (id, label) => DB.timetableUpdate(id, { label });
  const remove = (id) => DB.timetableRemove(id);
  const swapAdjacent = (i) => {
    // Swap untimed block at position i with neighbor below (i+1)
    const untimedList = sorted.filter(b => !b.time || !b.time.trim());
    const idxA = all.findIndex(b => b.id === sorted[i].id);
    const idxB = all.findIndex(b => b.id === sorted[i + 1].id);
    if (idxA < 0 || idxB < 0) return;
    DB.timetableSwapPositions(idxA, idxB);
  };
  const moveUp = (i) => { if (i > 0) swapAdjacent(i - 1); };
  const moveDown = (i) => swapAdjacent(i);

  const [newTime, setNewTime] = useState('06:00');
  const [newLabel, setNewLabel] = useState('');
  const addBlock = () => {
    if (!newLabel.trim()) return;
    DB.timetableAdd(newTime, newLabel.trim());
    setNewTime('06:00'); setNewLabel('');
  };

  // Check if a given block is untimed (so we show reorder arrows + can move it)
  const isUntimed = (b) => !b.time || !b.time.trim();

  return (
    <>
      <div className="tt-list">
        {sorted.map((b, i) => {
          const untimed = isUntimed(b);
          return (
            <div key={b.id} className="tt-row" data-prayer={b.isPrayer ? 'true' : 'false'}>
              <input className="tt-time" type="time" value={b.time || ''} placeholder="--:--" onChange={(e) => updateTime(b.id, e.target.value)} />
              <input
                className="tt-label"
                type="text"
                value={b.label || ''}
                placeholder={b.isPrayer ? '' : 'What you\'ll do…'}
                onChange={(e) => updateLabel(b.id, e.target.value)}
                readOnly={b.isPrayer}
              />
              <div className="tt-controls">
                {b.isPrayer && (
                  <button className="tt-remove tt-prayer-lock" style={{ display: 'inline-flex', opacity: 0.35, cursor: 'default' }} disabled aria-label="Locked">
                    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                  </button>
                )}
                {untimed && (
                  <>
                    {i > 0 && isUntimed(sorted[i - 1]) && (
                      <button className="tt-arrow" style={{ display: 'inline-flex', opacity: 0.7, padding: '0 2px' }} onClick={() => moveUp(i)} aria-label="Move up">
                        <svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>
                      </button>
                    )}
                    {i < sorted.length - 1 && isUntimed(sorted[i + 1]) && (
                      <button className="tt-arrow" style={{ display: 'inline-flex', opacity: 0.7, padding: '0 2px' }} onClick={() => moveDown(i)} aria-label="Move down">
                        <svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>
                      </button>
                    )}
                  </>
                )}
                {!b.isPrayer && (
                  <button className="tt-remove" style={{ display: 'inline-flex', opacity: 1, marginLeft: 4 }} onClick={() => remove(b.id)} aria-label="Remove">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div className="sub-section-label" style={{ marginTop: 12 }}>Add a block</div>
      <div className="tt-row" style={{ background: 'transparent' }}>
        <input className="tt-time" type="time" value={newTime} onChange={(e) => setNewTime(e.target.value)} />
        <input className="tt-label" type="text" value={newLabel} placeholder="What you’ll do…" onChange={(e) => setNewLabel(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addBlock(); }} />
      </div>
      <button className="action" onClick={addBlock} style={{ alignSelf: 'center', marginTop: 6 }}>
        <span className="action-text">Add</span>
        <span className="action-line" />
      </button>
      <div className="res-meta">Set times to order blocks chronologically. Untimed blocks can be reordered freely with the arrows.</div>
    </>
  );
}

/* ── Provision ── */
function ProvisionBody({ DB }) {
  const [text, setText] = useState(DB.getText('provision'));
  useEffect(() => { const t = setTimeout(() => DB.setText('provision', text), 300); return () => clearTimeout(t); }, [text]);
  const words = wordCount(text);
  const over = words > window.PROVISION_WORD_LIMIT;
  return (
    <>
      <textarea
        className="sub-textarea"
        style={{ minHeight: 320 }}
        value={text}
        placeholder="The dense, refined text you read every day. Distill. Cut. Refine again…"
        onChange={(e) => setText(e.target.value)}
      />
      <div className={`sub-counter ${over ? 'over' : ''}`}>{words} / {window.PROVISION_WORD_LIMIT} words</div>
    </>
  );
}

/* ── Horizons (goals) ── */
function HorizonsBody({ DB }) {
  return (
    <>
      <div className="goal-field-pinned">
        <div className="goal-field-pinned-label">Above all</div>
        {window.HARDCODED_TOP_GOAL}
      </div>
      {window.GOAL_FIELDS.map(g => (
        <HorizonsField key={g.key} DB={DB} field={g} />
      ))}
    </>
  );
}
function HorizonsField({ DB, field }) {
  const [val, setVal] = useState(DB.getGoal(field.key));
  useEffect(() => { const t = setTimeout(() => DB.setGoal(field.key, val), 300); return () => clearTimeout(t); }, [val]);
  return (
    <div className="goal-field">
      <div className="goal-field-label">{field.label}</div>
      <input className="sub-textfield" type="text" value={val} placeholder={field.hint} onChange={(e) => setVal(e.target.value)} />
    </div>
  );
}

/* ─────────── TAFSIR SHEET ─────────── */
function TafsirSheet({ tafsirText, loading, verseKey, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <>
      <div className="tafsir-backdrop" onClick={onClose} aria-hidden />
      <div className="tafsir-sheet" role="dialog" aria-label="Tafsir">
        <div className="tafsir-handle" />
        <div className="tafsir-header">
          <div className="tafsir-header-left">
            <div className="tafsir-era">{window.TAFSIR_ERA} · Tafsir{verseKey ? ' · ' + verseKey : ''}</div>
            <div className="tafsir-scholar">{window.TAFSIR_NAME}</div>
          </div>
          <button className="tafsir-close" onClick={onClose} aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div className="tafsir-divider" />
        <div className="tafsir-body">
          {loading || !tafsirText ? (
            <div className="tafsir-loading">
              <span className="loading-dots"><span/><span/><span/></span>
              <span>Loading tafsir</span>
            </div>
          ) : (
            <div dangerouslySetInnerHTML={{ __html: tafsirText }} />
          )}
        </div>
      </div>
    </>
  );
}

/* ─────────── HELP MODAL ─────────── */
function HelpModal({ help, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!help) return null;
  return (
    <div className="confirm-backdrop" onClick={onClose}>
      <div className="help-card" onClick={(e) => e.stopPropagation()}>
        <div className="help-title">{help.title}</div>
        <div className="help-body"><p>{help.body}</p></div>
        <div className="confirm-buttons" style={{ justifyContent: 'center' }}>
          <button className="action" onClick={onClose}>
            <span className="action-text">Close</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── TOAST ─────────── */
function Toast({ message, time, leaving }) {
  return (
    <div className={`toast ${leaving ? 'leaving' : 'entering'}`} role="status">
      <span>{message}</span>
      {time && <span className="toast-time">{time}</span>}
    </div>
  );
}

/* ─────────── CONFIRM MODAL ─────────── */
function ConfirmModal({ eyebrow, message, time, onConfirm, onCancel }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
  return (
    <div className="confirm-backdrop" onClick={onCancel}>
      <div className="confirm-card" onClick={(e) => e.stopPropagation()}>
        <div className="confirm-eyebrow">{eyebrow}</div>
        <div className="confirm-msg">{message}</div>
        {time && <div className="confirm-time">{time} remaining</div>}
        <div className="confirm-buttons">
          <button className="action-soft" onClick={onCancel}>Wait</button>
          <button className="action" onClick={onConfirm}>
            <span className="action-text">Continue anyway</span>
            <span className="action-line" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── THEME PICKER ─────────── */
function OrbitThemePicker({ themeIdx, setThemeIdx }) {
  return (
    <div className="orbit-themes">
      <div className="orbit-themes-row">
        {window.THEMES.map((t, i) => (
          <button
            key={t.id}
            className={`orbit-theme-dot ${i === themeIdx ? 'active' : ''}`}
            style={{ background: t.ring }}
            onClick={() => setThemeIdx(i)}
            title={t.name}
            aria-label={`${t.name} theme`}
          />
        ))}
      </div>
    </div>
  );
}

/* ─────────── BOOT ─────────── */
async function startApp() {
  // wait for Yjs to be loaded (it loads via type=module, async)
  let waitedMs = 0;
  while (!window.Y || !window.IndexeddbPersistence) {
    await new Promise(r => setTimeout(r, 50));
    waitedMs += 50;
    if (waitedMs > 8000) { console.error('Yjs failed to load after 8s'); break; }
  }
  if (!window.Y || !window.IndexeddbPersistence) {
    document.getElementById('orbit-mount').innerHTML =
      '<div style="color:#bfa99a;font-family:Cormorant Garamond,serif;font-style:italic;font-size:18px;text-align:center;padding:40px">Could not load the database. Please check your connection and reload.</div>';
    return;
  }
  const ydoc = new window.Y.Doc();
  window.YDOC = ydoc;
  // IndexedDB persistence
  try {
    const persistence = new window.IndexeddbPersistence('miran-v3', ydoc);
    await persistence.whenSynced;
  } catch (e) {
    console.warn('IndexeddbPersistence failed, continuing in-memory:', e);
  }
  window.DB = buildDB(ydoc);
  ReactDOM.createRoot(document.getElementById('orbit-mount')).render(<MiranRoot />);
}
startApp();
</script>
