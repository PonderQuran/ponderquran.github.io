                useEffect(() => {
                    const onKey = (e) => {
                        if (e.key === "Escape") onClose();
                    };
                    window.addEventListener("keydown", onKey);
                    return () => window.removeEventListener("keydown", onKey);
                }, [onClose]);
                if (!help) return null;
                return (
                    <div className="confirm-backdrop" onClick={onClose}>
                        <div
                            className="help-card"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="help-title">{help.title}</div>
                            <div className="help-body">
                                <p>{help.body}</p>
                            </div>
                            <div
                                className="confirm-buttons"
                                style={{ justifyContent: "center" }}
                            >
                                <button className="action" onClick={onClose}>
                                    <span className="action-text">Close</span>
                                    <span className="action-line" />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─────────── TOAST ─────────── */
            function Toast({ message, time, leaving }) {
                return (
                    <div
                        className={`toast ${leaving ? "leaving" : "entering"}`}
                        role="status"
                    >
                        <span>{message}</span>
                        {time && <span className="toast-time">{time}</span>}
                    </div>
                );
            }

            /* ─────────── CONFIRM MODAL ─────────── */
            function ConfirmModal({
                eyebrow,
                message,
                time,
                onConfirm,
                onCancel,
            }) {
                useEffect(() => {
                    const onKey = (e) => {
                        if (e.key === "Escape") onCancel();
                    };
                    window.addEventListener("keydown", onKey);
                    return () => window.removeEventListener("keydown", onKey);
                }, [onCancel]);
                return (
                    <div className="confirm-backdrop" onClick={onCancel}>
                        <div
                            className="confirm-card"
                            onClick={(e) => e.stopPropagation()}
                        >

                            <div className="confirm-msg">{message}</div>
                            {time && (
                                <div className="confirm-time">
                                    {time} remaining
                                </div>
                            )}
                            <div className="confirm-buttons">
                                <button
                                    className="action-soft"
                                    onClick={onCancel}
                                >
                                    Wait
                                </button>
                                <button className="action" onClick={onConfirm}>
                                    <span className="action-text">
                                        Continue anyway
                                    </span>
                                    <span className="action-line" />
                                </button>

            /* ─────────── THEME PICKER ─────────── */
            function OrbitThemePicker({ themeIdx, setThemeIdx }) {
                return (
                    <div className="orbit-themes">
                        <div className="orbit-themes-row">
                            {window.THEMES.map((t, i) => (
                                <button
                                    key={t.id}
                                    className={`orbit-theme-dot ${i === themeIdx ? "active" : ""}`}
                                    style={{ background: t.ring }}
                                    onClick={() => setThemeIdx(i)}
                                    title={t.name}
                                    aria-label={`${t.name} theme`}
                                />
                            ))}
                        </div>
                    </div>
                );
            }

            /* ─────────── BOOT ──────────-─ */
            async function startApp() {
                // wait for Yjs to be loaded (it loads via type=module, async)
                let waitedMs = 0;
                while (!window.Y || !window.IndexeddbPersistence) {
                    await new Promise((r) => setTimeout(r, 50));
                    waitedMs += 50;
                    if (waitedMs > 8000) {
                        console.error("Yjs failed to load after 8s");
                        break;
                    }
                }
                if (!window.Y || !window.IndexeddbPersistence) {
                    document.getElementById("orbit-mount").innerHTML =
                        '<div style="color:#bfa99a;font-family:Cormorant Garamond,serif;font-style:italic;font-size:18px;text-align:center;padding:40px">Could not load the database. Please check your connection and reload.</div>';
                    return;
                }
                const ydoc = new window.Y.Doc();
                window.YDOC = ydoc;
                // IndexedDB persistence
                try {
                    const persistence = new window.IndexeddbPersistence(
                        "miran-v3",
                        ydoc,
                    );
                    await persistence.whenSynced;
                } catch (e) {
                    console.warn(
                        "IndexeddbPersistence failed, continuing in-memory:",
                        e,
                    );
                }
                window.DB = buildDB(ydoc);
                ReactDOM.createRoot(
                    document.getElementById("orbit-mount"),
                ).render(<MiranRoot />);
            }
            handleCallback().then(startApp);
        </script>
    </body>
</html>
