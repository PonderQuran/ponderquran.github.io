<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14101a">
<title>Mirān</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&family=Amiri+Quran&display=swap');

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: #14101a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
#orbit-mount { width: 100vw; height: 100vh; height: 100dvh; }

.v-root {
  font-family: 'Inter Tight', system-ui, sans-serif;
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  color: var(--ink);
  background: var(--bg);
  user-select: none;
  -webkit-font-smoothing: antialiased;
  transition: background 1200ms ease;
}
.v-root * { box-sizing: border-box; }
.v-root::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 20;
}
.arabic-font {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
}
.serif { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; }
button {
  font: inherit; color: inherit;
  background: none; border: none;
  cursor: pointer; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
input, textarea {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

/* ───────── Animations ───────── */
@keyframes v-fade-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes v-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes v-heartbeat {
  0%, 70%, 100% { transform: scale(1); }
  14% { transform: scale(1.022); }
  28% { transform: scale(1); }
  42% { transform: scale(1.014); }
}
@keyframes v-glow-pulse {
  0%, 100% { text-shadow: 0 0 18px color-mix(in oklab, var(--accent) 8%, transparent); }
  50%      { text-shadow: 0 0 36px color-mix(in oklab, var(--accent) 32%, transparent),
                          0 0 72px color-mix(in oklab, var(--accent) 14%, transparent); }
}
@keyframes v-translation-pulse {
  0%, 100% { opacity: 0.85; }
  50%      { opacity: 1; }
}
@keyframes v-center-pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 24%, transparent),
                0 0 30px color-mix(in oklab, var(--accent) 12%, transparent);
  }
  50% {
    box-shadow: 0 0 0 14px color-mix(in oklab, var(--accent) 0%, transparent),
                0 0 60px color-mix(in oklab, var(--accent) 28%, transparent);
  }
}
@keyframes v-aura-breathe {
  0%, 100% { opacity: 0.5; transform: scale(0.94); }
  50%      { opacity: 1;   transform: scale(1.06); }
}
@keyframes v-slide-up {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes v-slide-up-md {
  from { transform: translate(-50%, 40px); opacity: 0; }
  to   { transform: translate(-50%, 0);    opacity: 1; }
}
@keyframes v-step-in {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes v-plasma-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-40px, -30px) scale(1.1); }
}
@keyframes v-plasma-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(50px, -40px) scale(1.15); }
}
@keyframes v-plasma-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-20px, 50px) scale(0.95); }
}
@keyframes v-toast-in {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes v-toast-out {
  from { opacity: 1; transform: translate(-50%, 0); }
  to   { opacity: 0; transform: translate(-50%, -8px); }
}
@keyframes v-twinkle {
  0%, 100% { opacity: var(--star-lo, 0.2); }
  50%      { opacity: var(--star-hi, 0.8); }
}
@keyframes v-twinkle-bright {
  0%, 100% { opacity: var(--star-lo, 0.5); transform: scale(1); }
  50%      { opacity: var(--star-hi, 1); transform: scale(1.18); }
}
.fade-in { animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both; }

.orbit-root {
  background:
    radial-gradient(ellipse at center top, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 50%),
    radial-gradient(ellipse at center bottom, var(--bg-soft) 0%, var(--bg) 70%),
    var(--bg);
}
.orbit-backdrop {
  position: absolute; inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.orbit-backdrop .star {
  position: absolute;
  border-radius: 50%;
  background: var(--ink);
  animation: v-twinkle var(--star-dur, 6s) ease-in-out infinite;
}
.orbit-backdrop .star.bright {
  background: var(--ink);
  box-shadow: 0 0 4px color-mix(in oklab, var(--ink) 80%, transparent),
              0 0 10px color-mix(in oklab, var(--accent) 50%, transparent);
  animation: v-twinkle-bright var(--star-dur, 6s) ease-in-out infinite;
}
.orbit-backdrop .star.extra-bright {
  background: #fff;
  box-shadow: 0 0 6px #fff,
              0 0 14px color-mix(in oklab, var(--accent) 70%, transparent),
              0 0 28px color-mix(in oklab, var(--accent) 30%, transparent);
  animation: v-twinkle-bright var(--star-dur, 6s) ease-in-out infinite;
}
.v-root[data-theme="space"] .orbit-backdrop .star { background: #cdd9f5; }
.v-root[data-theme="space"] .orbit-backdrop .star.bright {
  background: #e8eeff;
  box-shadow: 0 0 6px #e8eeff,
              0 0 14px color-mix(in oklab, var(--accent) 75%, transparent);
}
.v-root[data-theme="space"] .orbit-backdrop .star.extra-bright {
  background: #fff;
  box-shadow: 0 0 10px #fff,
              0 0 20px color-mix(in oklab, var(--accent) 95%, transparent),
              0 0 40px color-mix(in oklab, var(--accent) 55%, transparent);
}
.orbit-glow {
  position: absolute;
  inset: 10% 10%;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 60%);
  pointer-events: none;
}

.plasma-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1500ms ease;
  overflow: hidden;
}
.v-root[data-theme="space"] .plasma-layer { opacity: 1; }
.plasma-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  will-change: transform;
}
.plasma-blob.a {
  width: 60%; height: 60%;
  top: -10%; left: -10%;
  background: radial-gradient(circle, color-mix(in oklab, #6a90ff 25%, transparent) 0%, transparent 65%);
  animation: v-plasma-a 90s ease-in-out infinite;
}
.plasma-blob.b {
  width: 70%; height: 70%;
  bottom: -15%; right: -15%;
  background: radial-gradient(circle, color-mix(in oklab, #8a5fc9 22%, transparent) 0%, transparent 65%);
  animation: v-plasma-b 120s ease-in-out infinite;
}
.plasma-blob.c {
  width: 50%; height: 50%;
  bottom: 10%; left: 30%;
  background: radial-gradient(circle, color-mix(in oklab, #3aa9d6 18%, transparent) 0%, transparent 65%);
  animation: v-plasma-c 150s ease-in-out infinite;
}

/* ───────── Menu / center hub ───────── */
.orbit-stage {
  position: absolute; inset: 0;
  display: flex;
  align-items: center; justify-content: center;
  transition: filter 800ms cubic-bezier(0.22, 1, 0.36, 1),
              opacity 800ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
}
.v-root[data-fullscreen="true"] .orbit-stage {
  filter: blur(28px);
  opacity: 0.22;
  transform: scale(1.1);
  pointer-events: none;
}
.v-root[data-fullscreen="true"] .orbit-themes,
.v-root[data-fullscreen="true"] .menu-toolbar { opacity: 0; pointer-events: none; }
.center-hub {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding: 0 24px;
}
.menu-step-trail {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 90vw;
  margin-bottom: 4px;
  animation: v-fade-rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.menu-step-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 8px 14px;
  border-radius: 100px;
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  background: color-mix(in oklab, var(--bg) 55%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 320ms cubic-bezier(0.22, 1, 0.36, 1);
}
.menu-step-pill:hover {
  color: var(--ink);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 4px 18px color-mix(in oklab, var(--accent) 20%, transparent);
}
.menu-step-pill .mp-check {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  flex-shrink: 0;
}
.center-aura {
  position: absolute;
  top: 0; left: 50%;
  width: 240px; height: 240px;
  margin-top: -8px;
  margin-left: -120px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 14%, transparent) 0%, transparent 65%);
  animation: v-aura-breathe 4.8s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}
.center-button {
  position: relative;
  width: 184px; height: 184px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent);
  background: radial-gradient(circle at 30% 25%, color-mix(in oklab, var(--accent) 14%, var(--bg)) 0%, color-mix(in oklab, var(--bg) 92%, var(--accent)) 65%, color-mix(in oklab, var(--bg) 98%, var(--accent)) 100%);
  display: flex;
  align-items: center; justify-content: center;
  color: var(--ink);
  cursor: pointer;
  z-index: 2;
  animation: v-center-pulse 3.6s ease-in-out infinite;
  transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1), border-color 400ms ease, opacity 500ms ease;
}
.center-button:hover { transform: scale(1.035); border-color: var(--accent); }
.center-button:active { transform: scale(0.98); }
.center-button-label {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 30px;
  letter-spacing: 0.005em;
  color: var(--ink);
  line-height: 1;
}
.menu-toolbar {
  position: absolute;
  top: max(env(safe-area-inset-top), 18px);
  right: 18px;
  display: flex;
  gap: 8px;
  z-index: 5;
  transition: opacity 400ms ease;
}
.menu-toolbar-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 18%, transparent);
  color: var(--ink-soft);
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  transition: all 280ms;
}
.menu-toolbar-btn:hover { color: var(--ink); border-color: var(--accent); }
.menu-toolbar-btn svg {
  width: 14px; height: 14px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}

.orbit-themes {
  position: absolute;
  bottom: max(28px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 5;
  transition: opacity 500ms ease;
}
.orbit-themes-row {
  display: flex;
  gap: 14px;
  padding: 10px 20px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.orbit-theme-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  position: relative;
  transition: transform 300ms;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
}
.orbit-theme-dot:hover { transform: scale(1.15); }
.orbit-theme-dot.active {
  transform: scale(1.15);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 0 2px var(--ink), 0 0 16px var(--accent);
}
.orbit-theme-tooltip {
  position: absolute;
  bottom: 140%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}
.orbit-theme-dot:hover .orbit-theme-tooltip,
.orbit-theme-dot.active .orbit-theme-tooltip { opacity: 1; }

/* ───────── Step container ───────── */
.step-fs {
  position: absolute; inset: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 32px);
  animation: v-step-in 700ms cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.step-fs > * { pointer-events: auto; }
.step-fs-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 18px);
  left: 18px;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  color: var(--ink-soft);
  display: flex;
  align-items: center; justify-content: center;
  transition: all 300ms;
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2;
}
.step-fs-back:hover { color: var(--ink); border-color: var(--accent); transform: translateX(-2px); }
.step-fs-back svg {
  width: 16px; height: 16px;
  stroke: currentColor; stroke-width: 1.5;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.step-fs-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: clamp(16px, 3.5vh, 28px);
}
.step-fs-eyebrow {
  font-size: 10px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.78;
  font-family: 'Inter Tight', sans-serif;
}
.step-fs-ref {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-family: 'Inter Tight', sans-serif;
}
.step-fs-body {
  flex: 1 1 auto;
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 3vh, 30px);
  min-height: 0;
}
.step-fs-bottom {
  width: 100%;
  max-width: 760px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 2.4vh, 22px);
  margin-top: clamp(14px, 2.6vh, 24px);
}
.action {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  color: var(--ink);
  transition: color 300ms, opacity 300ms;
}
.action-text {
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  font-family: 'Inter Tight', sans-serif;
}
.action-line {
  width: 24px; height: 1px;
  background: var(--accent);
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
}
.action:hover .action-line { width: 56px; }
.action:disabled { opacity: 0.35; cursor: not-allowed; }
.action:disabled:hover .action-line { width: 24px; }
.action[data-blocked="true"] .action-line { background: var(--ink-faint); width: 16px; }
.action-soft {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 8px 12px;
  transition: color 300ms;
}
.action-soft:hover { color: var(--ink-soft); }

/* ───────── Verse body ───────── */
.verse-fs-arabic-wrap {
  width: 100%;
  max-width: 1080px;
  display: flex;
  align-items: center; justify-content: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  max-height: 50vh;
  padding: 6px 4px;
  scrollbar-width: none;
}
.verse-fs-arabic-wrap::-webkit-scrollbar { display: none; }
.verse-fs-arabic-wrap[data-overflowing="true"] {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
}
.verse-fs-arabic {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
  font-size: clamp(22px, 3.4vw + 4px, 44px);
  line-height: 2.1;
  color: var(--ink);
  text-align: center;
  word-wrap: break-word;
  overflow-wrap: break-word;
  width: 100%;
  text-shadow: 0 0 30px color-mix(in oklab, var(--accent) 8%, transparent);
  transition: text-shadow 600ms ease;
}
.verse-fs-translation-wrap {
  width: 100%;
  max-width: 720px;
  max-height: 28vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 8px;
  scrollbar-width: none;
}
.verse-fs-translation-wrap::-webkit-scrollbar { display: none; }
.verse-fs-translation-wrap[data-overflowing="true"] {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 91%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 91%, transparent 100%);
}
.verse-fs-translation {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  font-size: clamp(15px, 1.1vw + 8px, 19px);
  line-height: 1.65;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
  letter-spacing: 0.005em;
}
.step-fs.playing .verse-fs-arabic {
  animation: v-heartbeat 1.2s ease-in-out infinite, v-glow-pulse 2.4s ease-in-out infinite;
}
.step-fs.playing .verse-fs-translation {
  animation: v-translation-pulse 2.4s ease-in-out infinite;
}

/* ───────── Listen phase ───────── */
.verse-fs-audio { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.verse-fs-audio-row { display: flex; align-items: center; gap: 18px; }
.player-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center; justify-content: center;
  color: var(--accent);
  transition: all 400ms;
}
.player-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 28px color-mix(in oklab, var(--accent) 35%, transparent);
  transform: scale(1.05);
}
.player-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.player-btn svg { width: 24px; height: 24px; fill: currentColor; }
.player-btn-small {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  background: color-mix(in oklab, var(--bg) 50%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-soft);
  transition: all 320ms;
}
.player-btn-small:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.player-btn-small:disabled { opacity: 0.25; cursor: not-allowed; }
.player-btn-small svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.verse-fs-wave {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 28px;
  width: 110px;
  justify-content: center;
}
.verse-fs-wave span {
  display: block;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  transition: height 120ms ease, opacity 120ms ease;
}
.verse-fs-meta {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-faint);
  font-style: italic;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.verse-fs-meta .reciter { color: var(--ink-soft); }

/* ───────── Select range phase ───────── */

}
.select-list-wrap {
  width: 100%;

  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 6px 24px;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
}
.select-list-wrap::-webkit-scrollbar { display: none; }
.select-list {
  display: flex; flex-direction: column;

}
.select-verse {

}

  content: "first";

  text-transform: uppercase;

  background: var(--bg);
  padding: 0 8px;
  font-family: 'Inter Tight', sans-serif;
}
.select-verse[data-pivot="true"]:not([data-anchor="true"])::after {
  content: "stop here";
  position: absolute;
  bottom: -8px; right: 14px;
  font-size: 8px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--bg);
  padding: 0 8px;
  font-family: 'Inter Tight', sans-serif;
}
.select-verse-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.select-verse-num {
  font-family: 'Inter Tight', sans-serif;

}

}

}
.select-counter {

}

/* ───────── Ponder ───────── */

/* ───────── Questions ───────── */
.q-pill {

}

}

}

.question-hint {
  font-family: 'Cormorant Garamond', serif;

}
.qverse-panel { width: 100%; max-width: 680px; margin-top: 4px; }
.qverse-panel-toggle {
  width: 100%;

  gap: 12px;
  padding: 10px 16px;
  border-radius: 100px;
  border: 1px solid color-mix(in oklab, var(--accent) 18%, transparent);
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter: blur(8px);
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;

}

.qverse-panel-toggle .chev {
  width: 8px; height: 8px;

  transform: rotate(45deg);
  transition: transform 300ms;
  margin-top: -3px;
}

}
.qverse-panel-body {

  transition: max-height 600ms cubic-bezier(0.22, 1, 0.36, 1);
}
.qverse-panel[data-open="true"] .qverse-panel-body { max-height: 60vh; }
.qverse-scroller {
  max-height: 56vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 6px 8px;
  display: flex; flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 25%, transparent) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
}

}
.qverse-item {
  padding: 14px 16px;
  border-radius: 14px;

}
.qverse-item-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.qverse-item-num {
  font-family: 'Inter Tight', sans-serif;
  font-size: 8px;
  letter-spacing: 0.35em;
  text-transform: uppercase;

}
.qverse-item-tafsir {
  font-family: 'Inter Tight', sans-serif;
  font-size: 8px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);

}

.qverse-item-arabic {

}
.qverse-item-trans {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;

}

/* ───────── Write ───────── */
.write-scroll {
  width: 100%;

  overflow-y: auto;

}
.write-scroll::-webkit-scrollbar { width: 3px; }
.write-scroll::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 2px;
}
.write-intro {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(15px, 0.5vw + 13px, 17px);

  color: var(--ink-soft);

.write-intro strong {

}

}

.write-remove {
  width: 22px; height: 22px;

}

}

/* ───────── Name session ───────── */
.name-body {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 26px;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding: 20px;
}

  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(16px, 0.6vw + 13px, 19px);

}

.name-ref {
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.85;
  text-align: center;
}
.name-input {
  width: 100%;
  border: none;
  border-bottom: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);

  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-faint);
  text-align: center;
  opacity: 0.8;
}

/* ───────── Tafsir / Help sheet ───────── */
.tafsir-backdrop {
  position: fixed; inset: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  animation: v-fade-in 400ms ease;
}
.tafsir-sheet {
  position: fixed;
  z-index: 51;
  left: 0; right: 0; bottom: 0;
  max-height: 88dvh;
  background:
    radial-gradient(ellipse at top, color-mix(in oklab, var(--accent) 5%, transparent) 0%, transparent 50%),
    color-mix(in oklab, var(--bg) 92%, var(--bg-soft));
  border-top: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 28px 28px 0 0;

  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 2px;
}

.tafsir-body {
  flex: 1 1 auto;

  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;

  line-height: 1.75;
  color: var(--ink-soft);
  letter-spacing: 0.003em;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 96%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 96%, transparent 100%);

  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
}
.tafsir-body::-webkit-scrollbar { width: 3px; }

.tafsir-body h1, .tafsir-body h2, .tafsir-body h3, .tafsir-body h4 {

    border-radius: 24px;
    border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
    animation: v-slide-up-md 560ms cubic-bezier(0.22, 1, 0.36, 1);
  }
}
.help-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 22px 28px 36px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink-soft);
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--accent) 30%, transparent) transparent;
}
.help-body p { margin: 0 0 14px; }
.help-body p:last-child { margin-bottom: 0; }
.help-body strong { color: var(--ink); font-weight: 400; font-style: italic; }
.help-body em { color: var(--ink); font-style: italic; }

.loading-dots { display: inline-flex; gap: 6px; align-items: center; }
.loading-dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.5;
  animation: v-twinkle 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
.verse-skeleton {
  font-size: clamp(22px, 3.4vw + 4px, 44px);
  color: var(--ink-faint);
  opacity: 0.4;
  letter-spacing: 0.2em;
}

/* ───────── Toast / Confirm ───────── */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 110px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  z-index: 60;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.toast.entering { animation: v-toast-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
.toast.leaving  { animation: v-toast-out 360ms ease both; }
.toast-time {
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  opacity: 0.9;
  font-family: 'Inter Tight', sans-serif;
  font-style: normal;
  font-size: 13px;
  letter-spacing: 0.06em;
}
.confirm-backdrop {
  position: fixed; inset: 0;
  z-index: 70;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center; justify-content: center;
  padding: 24px;
  animation: v-fade-in 300ms ease;
}
.confirm-card {
  width: min(420px, 100%);
  background: color-mix(in oklab, var(--bg) 92%, var(--bg-soft));
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 22px;
  padding: 32px 28px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  text-align: center;
  animation: v-step-in 400ms cubic-bezier(0.22, 1, 0.36, 1);
}
.confirm-eyebrow {
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
  font-family: 'Inter Tight', sans-serif;
}
.confirm-msg {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  margin-bottom: 8px;
}
.confirm-time {
  font-family: 'Inter Tight', sans-serif;
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.8;
  margin-bottom: 28px;
  font-variant-numeric: tabular-nums;
}
.confirm-buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
}

.boot {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  background: #14101a;
  color: #bfa99a;
  z-index: 100;
  pointer-events: none;
}
.boot .b-mark {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 36px;
  color: #f0e3d5;
  opacity: 0.92;
}
.boot .b-sub {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  opacity: 0.55;
}

/* ───────── Dashboard ───────── */
.dashboard {
  position: absolute;
  inset: 0;
  z-index: 4;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 110px);
  scrollbar-width: none;
  animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.dashboard::-webkit-scrollbar { display: none; }
.dash-inner {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  display: flex; flex-direction: column;
  gap: 56px;
}
.dash-header {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  padding: 14px 0 0;
}
.dash-header-mark {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--accent);
  font-size: 20px;
  opacity: 0.78;
}
.dash-header-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(24px, 1.4vw + 18px, 32px);
  line-height: 1.25;
  color: var(--ink);
  letter-spacing: -0.005em;
  max-width: 480px;
}
.dash-header-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-soft);
  opacity: 0.85;
  max-width: 440px;
  line-height: 1.55;
}
.dash-lock {
  margin-top: 6px;
  padding: 22px 24px;
  border-radius: 22px;
  background:
    radial-gradient(ellipse at top, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 60%),
    color-mix(in oklab, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
  display: flex; flex-direction: column; align-items: center;
  gap: 12px;
  text-align: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.dash-lock-icon {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  opacity: 0.85;
}
.dash-lock-icon svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dash-lock-label {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.85;
}
.dash-lock-time {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(26px, 2vw + 14px, 36px);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.dash-lock-hint {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
  opacity: 0.78;
  max-width: 420px;
  line-height: 1.5;
}
.dash-lock-help-btn {
  margin-top: 4px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 8px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 6px 12px;
  border: 1px solid color-mix(in oklab, var(--accent) 15%, transparent);
  border-radius: 100px;
  transition: all 280ms;
}
.dash-lock-help-btn:hover { color: var(--accent); border-color: var(--accent); }

.dash-section { display: flex; flex-direction: column; gap: 18px; }
.dash-section-head {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.dash-section-divider {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
}
.dash-section-divider .ds-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, color-mix(in oklab, var(--accent) 25%, transparent), transparent);
  max-width: 120px;
}
.dash-section-divider .ds-mark { color: var(--accent); font-size: 9px; opacity: 0.7; }
.dash-section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(20px, 0.8vw + 16px, 24px);
  color: var(--ink);
  letter-spacing: -0.005em;
}
.dash-section-help {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  color: var(--ink-faint);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  line-height: 1;
  transition: all 280ms;
  flex-shrink: 0;
}
.dash-section-help:hover { color: var(--accent); border-color: var(--accent); }
.dash-section-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
  opacity: 0.78;
  max-width: 440px;
  line-height: 1.5;
}
.dash-section-body { display: flex; flex-direction: column; gap: 10px; }
.dash-empty {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-faint);
  text-align: center;
  padding: 16px;
  opacity: 0.75;
}
.dash-more {
  align-self: center;
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 10px 18px;
  border-radius: 100px;
  border: 1px solid color-mix(in oklab, var(--accent) 14%, transparent);
  transition: all 280ms;
  margin-top: 4px;
}
.dash-more:hover { color: var(--accent); border-color: var(--accent); }

.session-row {
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid color-mix(in oklab, var(--accent) 10%, transparent);
  background: color-mix(in oklab, var(--bg) 65%, transparent);
  cursor: pointer;
  transition: all 320ms;
  display: flex; flex-direction: column; gap: 6px;
  text-align: left;
}
.session-row:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 6px 22px color-mix(in oklab, var(--accent) 18%, transparent);
}
.session-row-head {
  display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
}
.session-row-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--ink);
  letter-spacing: -0.005em;
  line-height: 1.3;
}
.session-row-date {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  flex-shrink: 0;
  white-space: nowrap;
}
.session-row-ref {
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
}

.action-row {
  display: flex; align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-radius: 14px;
  background: color-mix(in oklab, var(--bg) 65%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 8%, transparent);
  transition: all 300ms;
}
.action-row:hover { border-color: color-mix(in oklab, var(--accent) 30%, transparent); }
.action-row-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: color-mix(in oklab, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  color: var(--accent);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.action-row-text {
  flex: 1;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  min-width: 0;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.action-row-ctrls {
  display: flex; gap: 4px;
  opacity: 0.45;
  transition: opacity 280ms;
  flex-shrink: 0;
}
.action-row:hover .action-row-ctrls,
.action-row:focus-within .action-row-ctrls { opacity: 1; }
.action-row-arrow {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  transition: all 220ms;
}
.action-row-arrow:hover:not(:disabled) { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
.action-row-arrow:disabled { opacity: 0.25; cursor: not-allowed; }
.action-row-arrow svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.horizon-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 640px) {
  .horizon-pair { grid-template-columns: 1fr; }
}
.horizon-card {
  position: relative;
  padding: 22px 20px 20px;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at top, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 70%),
    color-mix(in oklab, var(--bg) 65%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 14%, transparent);
  display: flex; flex-direction: column;
  gap: 10px;
  min-height: 220px;
  transition: border-color 280ms;
}
.horizon-card:focus-within { border-color: color-mix(in oklab, var(--accent) 50%, transparent); }
.horizon-card.hellfire {
  background:
    radial-gradient(ellipse at bottom, color-mix(in oklab, #c44a32 8%, transparent) 0%, transparent 70%),
    color-mix(in oklab, var(--bg) 65%, transparent);
}
.horizon-card-label {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.8;
}
.horizon-card.hellfire .horizon-card-label { color: #c46c52; opacity: 0.85; }
.horizon-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--ink);
}
.horizon-card textarea {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.6;
  resize: none;
  outline: none;
  width: 100%;
  min-height: 100px;
  padding: 0;
}
.horizon-card textarea::placeholder { color: var(--ink-faint); opacity: 0.55; font-style: italic; }

.provision-card {
  position: relative;
  padding: 22px 22px 18px;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at top right, color-mix(in oklab, var(--accent) 5%, transparent) 0%, transparent 60%),
    color-mix(in oklab, var(--bg) 65%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 14%, transparent);
  display: flex; flex-direction: column;
  gap: 14px;
  transition: border-color 280ms;
}
.provision-card:focus-within { border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
.provision-card textarea {
  border: none;
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.7;
  resize: none;
  outline: none;
  width: 100%;
  min-height: 200px;
  padding: 0;
}
.provision-card textarea::placeholder { color: var(--ink-faint); opacity: 0.55; }
.provision-meter {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.provision-meter[data-warn="true"] { color: #d77f5e; }
.provision-meter[data-over="true"] { color: #d04d2c; }
.provision-meter-bar {
  flex: 1;
  height: 2px;
  background: color-mix(in oklab, var(--ink-faint) 30%, transparent);
  border-radius: 1px;
  overflow: hidden;
  max-width: 260px;
}
.provision-meter-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 360ms cubic-bezier(0.22, 1, 0.36, 1);
}
.provision-meter[data-warn="true"] .provision-meter-bar-fill { background: #d77f5e; }
.provision-meter[data-over="true"] .provision-meter-bar-fill { background: #d04d2c; }

.tt-card {
  padding: 18px 16px;
  border-radius: 16px;
  background: color-mix(in oklab, var(--bg) 65%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 10%, transparent);
  display: flex; flex-direction: column; gap: 6px;
}
.tt-row {
  display: grid;
  grid-template-columns: 64px 1fr 26px;
  gap: 12px;
  align-items: center;
  padding: 8px 4px;
  border-radius: 8px;
  transition: background 240ms;
}
.tt-row:hover { background: color-mix(in oklab, var(--accent) 4%, transparent); }
.tt-row.prayer { background: color-mix(in oklab, var(--accent) 6%, transparent); }
.tt-row.prayer .tt-time { color: var(--accent); }
.tt-time {
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.tt-time input {
  width: 60px;
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  outline: none;
  border-bottom: 1px dashed color-mix(in oklab, var(--ink-faint) 50%, transparent);
  padding: 4px 0;
  text-align: center;
}
.tt-time input:focus { border-bottom-color: var(--accent); }
.tt-title-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  outline: none;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: border-color 240ms;
  width: 100%;
  min-width: 0;
}
.tt-title-input:focus { border-bottom-color: color-mix(in oklab, var(--accent) 30%, transparent); }
.tt-row.prayer .tt-title-input {
  font-style: normal;
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  cursor: default;
  pointer-events: none;
}
.tt-remove {
  width: 22px; height: 22px;
  border-radius: 50%;
  color: var(--ink-faint);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 240ms, color 240ms;
}
.tt-row:hover .tt-remove,
.tt-row:focus-within .tt-remove { opacity: 0.55; }
.tt-remove:hover { color: var(--accent); opacity: 1; }
.tt-remove svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; }
.tt-add {
  margin-top: 6px;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 9px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 8px 0;
  font-style: italic;
  align-self: center;
  transition: color 280ms;
}
.tt-add:hover { color: var(--accent); }
.tt-add svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.5; fill: none; }

.goal-row {
  display: flex; flex-direction: column;
  gap: 6px;
  padding: 12px 16px;
  border-radius: 12px;
  background: color-mix(in oklab, var(--bg) 60%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 8%, transparent);
  transition: border-color 280ms;
}
.goal-row.locked {
  background:
    radial-gradient(ellipse at top, color-mix(in oklab, var(--accent) 10%, transparent) 0%, transparent 70%),
    color-mix(in oklab, var(--bg) 60%, transparent);
  border-color: color-mix(in oklab, var(--accent) 30%, transparent);
}
.goal-row:focus-within { border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
.goal-row-label {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 8px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.goal-row.locked .goal-row-label { color: var(--accent); opacity: 0.85; }
.goal-row-label .gl-lock svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.goal-row textarea, .goal-row .goal-readonly {
  border: none;
  background: transparent;
  color: var(--ink);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  outline: none;
  width: 100%;
  min-height: 22px;
  padding: 0;
}

<script type="text/babel" data-presets="react">
/* global React, ReactDOM */
const { useState, useEffect, useRef, useCallback, useMemo, useLayoutEffect } = React;

/* ═══════════════════════════════════════════════════
   STORAGE: Yjs Y.Doc + IndexedDB persistence
   ═══════════════════════════════════════════════════ */
class MiranDB {
  constructor() {
    this.doc = new window.Y.Doc();
    this.persistence = new window.IndexeddbPersistence(window.YDOC_NAME, this.doc);
    this.ready = new Promise(res => this.persistence.once('synced', res));

    this.meta      = this.doc.getMap('meta');
    this.sessions  = this.doc.getArray('sessions');   /* array of Y.Map */
    this.actions   = this.doc.getArray('actions');    /* array of Y.Map */
    this.pondered  = this.doc.getMap('pondered');     /* "S:V" -> true */
    this.horizons  = this.doc.getMap('horizons');     /* paradise, hellfire */
    this.provision = this.doc.getMap('provision');    /* text */
    this.timetable = this.doc.getMap('timetable');    /* { blocks } */
    this.goals     = this.doc.getMap('goals');

    this.listeners = new Set();
    this.doc.on('update', () => this._emit());
  }
  _emit() {
    const snap = this.snapshot();
    for (const fn of this.listeners) fn(snap);
  }
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  snapshot() {
    return {
      meta: this.meta.toJSON(),
      sessions: this.sessions.toArray().map(m => (m && m.toJSON) ? m.toJSON() : m),
      actions: this.actions.toArray().map(m => (m && m.toJSON) ? m.toJSON() : m),
      pondered: this.pondered.toJSON(),
      horizons: this.horizons.toJSON(),
      provision: this.provision.toJSON(),
      timetable: this.timetable.toJSON(),
      goals: this.goals.toJSON(),
    };
  }
  transact(fn) { this.doc.transact(fn); }

  setMeta(patch) {
    this.transact(() => { for (const k in patch) this.meta.set(k, patch[k]); });
  }
  addSession(session) {
    const m = new window.Y.Map();
    this.transact(() => {
      for (const k in session) m.set(k, session[k]);
      this.sessions.push([m]);
    });
    return session.id;
  }
  updateSession(id, patch) {
    this.transact(() => {
      for (let i = 0; i < this.sessions.length; i++) {
        const m = this.sessions.get(i);
        if (m && m.get && m.get('id') === id) {
          for (const k in patch) m.set(k, patch[k]);
          return;
        }
      }
    });
  }
  addAction(action) {
    const m = new window.Y.Map();
    this.transact(() => {
      for (const k in action) m.set(k, action[k]);
      this.actions.push([m]);
    });
    return action.id;
  }
  removeAction(id) {
    this.transact(() => {
      for (let i = 0; i < this.actions.length; i++) {
        const m = this.actions.get(i);
        if (m && m.get && m.get('id') === id) {
          this.actions.delete(i, 1);
          return;
        }
      }
    });
  }
  updateAction(id, patch) {
    this.transact(() => {
      for (let i = 0; i < this.actions.length; i++) {
        const m = this.actions.get(i);
        if (m && m.get && m.get('id') === id) {
          for (const k in patch) m.set(k, patch[k]);
          return;
        }
      }
    });
  }
  /* Reorder by writing new ranking to each id in given order (0..n-1). */
  reorderActions(orderedIds) {
    this.transact(() => {
      orderedIds.forEach((id, idx) => {
        for (let i = 0; i < this.actions.length; i++) {
          const m = this.actions.get(i);
          if (m && m.get && m.get('id') === id) {
            m.set('ranking', idx);
            break;
          }
        }
      });
    });
  }
  /* Per spec: new ranking = (max existing) + 1. New actions go to the bottom. */
  nextRanking() {
    const arr = this.actions.toArray();
    if (arr.length === 0) return 0;
    let max = -1;
    for (const m of arr) {
      const r = (m && m.get) ? (m.get('ranking') ?? 0) : 0;
      if (r > max) max = r;
    }
    return max + 1;
  }
  markPondered(verses) {
    this.transact(() => {
      for (const v of verses) this.pondered.set(`${v.s}:${v.v}`, true);
    });
  }
  setHorizon(side, text) { this.transact(() => this.horizons.set(side, text)); }
  setProvision(text) { this.transact(() => this.provision.set('text', text)); }
  setTimetable(blocks) { this.transact(() => this.timetable.set('blocks', blocks)); }
  setGoal(key, text) { this.transact(() => this.goals.set(key, text)); }

  exportBinary() { return window.Y.encodeStateAsUpdate(this.doc); }
  importBinary(update) { this.transact(() => window.Y.applyUpdate(this.doc, update)); }
}

/* ═══════════════════════════════════════════════════
   QURAN API
   ═══════════════════════════════════════════════════ */
const surahInfoCache = new Map();
async function fetchSurahInfo(n) {
  if (surahInfoCache.has(n)) return surahInfoCache.get(n);
  const r = await fetch(`${window.API_BASE}/chapters/${n}`);
  if (!r.ok) return null;
  const ch = (await r.json()).chapter;
  if (!ch) return null;
  const out = { name: ch.name_simple || "", verses_count: ch.verses_count || 0 };
  surahInfoCache.set(n, out);
  return out;
}
function stripHtml(str) {
  if (!str) return "";
  const t = document.createElement("div");
  t.innerHTML = str;
  return t.textContent || t.innerText || "";
}
function cleanTafsirHtml(rawHtml) {
  if (!rawHtml || !rawHtml.trim()) return "";
  const doc = new DOMParser().parseFromString(rawHtml, "text/html");
  const allowed = new Set(["P","H1","H2","H3","H4","EM","STRONG","B","I","BR","SPAN"]);
  function walk(node) {
    const out = [];
    for (const child of node.childNodes) {
      if (child.nodeType === 3) out.push(child.textContent);
      else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (allowed.has(tag)) {
          const inner = walk(child);
          if (tag === "BR") out.push("<br>");
          else if (tag === "SPAN") out.push(inner);
          else out.push(`<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`);
        } else out.push(walk(child));
      }
    }
    return out.join("");
  }
  return walk(doc.body);
}
async function fetchVerse(surah, ayah) {
  const vk = `${surah}:${ayah}`;
  const data = { surah, ayah, key: vk, arabic: "", translation: "", audioUrl: "" };
  try {
    const r = await fetch(`${window.API_BASE}/verses/by_key/${vk}?fields=text_uthmani`);
    if (r.ok) data.arabic = (await r.json()).verse?.text_uthmani || "";
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/quran/translations/${window.TRANSLATION_ID}?verse_key=${vk}`);
    if (r.ok) data.translation = stripHtml((await r.json()).translations?.[0]?.text || "");
  } catch (e) {}
  try {
    const r = await fetch(`${window.API_BASE}/recitations/${window.RECITATION_ID}/by_ayah/${vk}`);
    if (r.ok) {
      const url = (await r.json()).audio_files?.[0]?.url || "";
      data.audioUrl = url.startsWith("http") ? url : window.AUDIO_BASE + url;
    }
  } catch (e) {}
  return data;
}
async function fetchVerseRange(surah, startAyah, count) {
  const info = await fetchSurahInfo(surah);
  const surahName = info?.name || `Sūrah ${surah}`;
  const versesCount = info?.verses_count || 0;
  const endAyah = Math.min(startAyah + count - 1, versesCount);
  const ayahs = [];
  for (let a = startAyah; a <= endAyah; a++) ayahs.push(a);
  const verses = await Promise.all(ayahs.map(a => fetchVerse(surah, a)));
  return { surah, surahName, versesCount, startAyah, endAyah, verses };
}
const tafsirCache = new Map();
async function fetchTafsir(surah, ayah) {
  const vk = `${surah}:${ayah}`;
  if (tafsirCache.has(vk)) return tafsirCache.get(vk);
  try {
    const r = await fetch(`${window.API_BASE}/tafsirs/${window.TAFSIR_ID}/by_ayah/${vk}`);
    if (!r.ok) return "";
    const txt = cleanTafsirHtml((await r.json()).tafsir?.text || "");
    tafsirCache.set(vk, txt);
    return txt;
  } catch (e) { return ""; }
}

/* ═══════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════ */
function uid() { return 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function formatCountdown(ms) {
  if (ms <= 0) return "0:00:00";
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function nextMidnightMs() {
  const d = new Date();
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0);
  return t.getTime();
}
function wordCount(s) {
  if (!s) return 0;
  return s.trim().split(/\s+/).filter(Boolean).length;
}
function formatSessionDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function refLabel(s) {
  if (!s) return '';
  if (s.startAyah === s.endAyah) return `${s.surahName} · ${s.startSurah}:${s.startAyah}`;
  return `${s.surahName} · ${s.startSurah}:${s.startAyah}–${s.endAyah}`;
}
function defaultPrayerBlocks() {
  return window.PRAYERS.map(p => ({ id: p.id, kind: 'prayer', prayerId: p.id, title: p.label, time: '' }));
}

/* ═══════════════════════════════════════════════════
   Backdrop — varied stars + plasma
   ═══════════════════════════════════════════════════ */
function OrbitBackdrop() {
  const stars = useMemo(() => {
    /* Hash-style RNG seeded per page-load for stable positions. */
    let seed = 4017;
    const rand = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    const arr = [];
    const N = 140;
    for (let i = 0; i < N; i++) {
      const r = rand();
      let cls = '';
      let size;
      if (r < 0.02) { cls = 'extra-bright'; size = 2.4 + rand() * 1.8; }
      else if (r < 0.10) { cls = 'bright'; size = 1.5 + rand() * 1.5; }
      else { cls = ''; size = 0.6 + rand() * 0.8; }
      arr.push({
        cls,
        top: rand() * 100,
        left: rand() * 100,
        size,
        lo: 0.12 + rand() * 0.4,
        hi: 0.6 + rand() * 0.4,
        dur: 4 + rand() * 9,
        delay: rand() * 8,
      });
    }
    return arr;
  }, []);
  return (
    <div className="orbit-backdrop">
      {stars.map((s, i) => (
        <span
          key={i}
          className={`star${s.cls ? ' ' + s.cls : ''}`}
          style={{
            top: s.top + '%',
            left: s.left + '%',
            width: s.size + 'px',
            height: s.size + 'px',
            '--star-lo': s.lo,
            '--star-hi': s.hi,
            '--star-dur': s.dur + 's',
            animationDelay: s.delay + 's',
          }}
        />
      ))}
      <div className="orbit-glow" />
      <div className="plasma-layer">
        <div className="plasma-blob a" />
        <div className="plasma-blob b" />
        <div className="plasma-blob c" />
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   Toast / Confirm
   ═══════════════════════════════════════════════════ */
function Toast({ message, time, onDone }) {
  const [leaving, setLeaving] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setLeaving(true), 1600);
    const t2 = setTimeout(() => onDone && onDone(), 2000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [onDone]);
  if (!message) return null;
  return (
    <div className={`toast ${leaving ? 'leaving' : 'entering'}`}>
      <span>{message}</span>
      {time != null && <span className="toast-time">{formatTime(time)}</span>}
    </div>
  );
}
function ConfirmModal({ open, eyebrow, message, time, confirmLabel = "Yes, end", cancelLabel = "Continue", onConfirm, onCancel }) {
  if (!open) return null;
  return (
    <div className="confirm-backdrop" onClick={onCancel}>
      <div className="confirm-card" onClick={e => e.stopPropagation()}>
        {eyebrow && <div className="confirm-eyebrow">{eyebrow}</div>}
        <div className="confirm-msg">{message}</div>
        {time != null && <div className="confirm-time">{formatTime(time)} remaining</div>}
        <div className="confirm-buttons">
          <button className="action" onClick={onCancel}>
            <span className="action-text">{cancelLabel}</span>
            <span className="action-line"></span>
          </button>
          <button className="action" onClick={onConfirm} data-blocked="true">
            <span className="action-text">{confirmLabel}</span>
            <span className="action-line"></span>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   Verse body
   ═══════════════════════════════════════════════════ */
function VerseBody({ verse, playing }) {
  const arabicWrapRef = useRef(null);
  const arabicRef = useRef(null);
  const transWrapRef = useRef(null);
  const transRef = useRef(null);
  useLayoutEffect(() => {
    const aw = arabicWrapRef.current;
    const a = arabicRef.current;
    if (aw && a) aw.dataset.overflowing = a.scrollHeight > aw.clientHeight + 2 ? 'true' : 'false';
    const tw = transWrapRef.current;
    const t = transRef.current;
    if (tw && t) tw.dataset.overflowing = t.scrollHeight > tw.clientHeight + 2 ? 'true' : 'false';
  }, [verse]);
  if (!verse) {
    return (
      <>
        <div className="verse-fs-arabic-wrap"><div className="verse-skeleton arabic-font">······</div></div>
        <div className="verse-fs-translation-wrap"><div className="verse-fs-translation" style={{ opacity: 0.4 }}>Loading…</div></div>
      </>
    );
  }
  return (
    <>
      <div className="verse-fs-arabic-wrap" ref={arabicWrapRef}>
        <div className="verse-fs-arabic" ref={arabicRef}>{verse.arabic}</div>
      </div>
      <div className="verse-fs-translation-wrap" ref={transWrapRef}>
        <div className="verse-fs-translation" ref={transRef}>{verse.translation}</div>
      </div>
    </>
  );
}
function VerseProgress({ total, idx, doneSet }) {
  if (!total || total < 2) return null;
  return (
    <div className="verse-progress">
      {Array.from({ length: total }).map((_, i) => (
        <span
          key={i}
          className={`verse-progress-dot ${i === idx ? 'active' : (doneSet && doneSet.has(i) ? 'done' : '')}`}
        />
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   LISTEN PHASE — auto-advance through verses
   ═══════════════════════════════════════════════════ */
function ListenPhase({ range, onBack, onContinue, openTafsir, listenIdx, setListenIdx, listenAllDone, setListenAllDone }) {
  const [playing, setPlaying] = useState(true);
  const [duration, setDuration] = useState(0);
  const [current, setCurrent] = useState(0);
  const [waveStep, setWaveStep] = useState(0);
  const audioRef = useRef(null);
  const verse = range && range.verses ? range.verses[listenIdx] : null;
  const total = range && range.verses ? range.verses.length : 0;
  const doneSet = useMemo(() => {
    const s = new Set();
    if (listenAllDone) for (let i = 0; i < total; i++) s.add(i);
    else for (let i = 0; i < listenIdx; i++) s.add(i);
    return s;
  }, [listenIdx, listenAllDone, total]);

  /* Audio engine */
  useEffect(() => {
    if (!verse || !verse.audioUrl) return;
    const audio = new Audio();
    audioRef.current = audio;
    audio.src = verse.audioUrl;
    audio.preload = "auto";

    const onLoaded = () => setDuration(audio.duration || 0);
    const onTime = () => setCurrent(audio.currentTime || 0);
    const onEnded = () => {
      if (listenIdx < total - 1) { setListenIdx(listenIdx + 1); }
      else { setListenAllDone(true); setPlaying(false); }
    };
    const onPlay = () => setPlaying(true);
    const onPause = () => setPlaying(false);
    audio.addEventListener('loadedmetadata', onLoaded);
    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('ended', onEnded);
    audio.addEventListener('play', onPlay);
    audio.addEventListener('pause', onPause);
    if (playing) audio.play().catch(() => {});
    return () => {
      audio.removeEventListener('loadedmetadata', onLoaded);
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('ended', onEnded);
      audio.removeEventListener('play', onPlay);
      audio.removeEventListener('pause', onPause);
      audio.pause();
      audio.src = "";
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [listenIdx, verse && verse.audioUrl]);

  useEffect(() => {
    if (!playing) return;
    const i = setInterval(() => setWaveStep(s => s + 1), 140);
    return () => clearInterval(i);
  }, [playing]);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) a.play().catch(() => {});
    else a.pause();
  };
  const replayVerse = () => {
    const a = audioRef.current;
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(() => {});
  };
  const prev = () => {
    if (listenIdx > 0) { setListenAllDone(false); setListenIdx(listenIdx - 1); }
  };
  const next = () => {
    if (listenIdx < total - 1) { setListenAllDone(false); setListenIdx(listenIdx + 1); }
  };
  const repeatAll = () => {
    setListenAllDone(false);
    setListenIdx(0);
    setPlaying(true);
  };

  const wave = useMemo(() => {
    const bars = [];
    for (let i = 0; i < 20; i++) {
      let h = 4;
      let op = 0.35;
      if (playing) {
        h = 4 + Math.abs(Math.sin((waveStep + i * 0.65) * 0.4)) * 18;
        op = 0.5 + Math.abs(Math.sin((waveStep + i * 0.65) * 0.4)) * 0.5;
      }
      bars.push({ h, op });
    }
    return bars;
  }, [waveStep, playing]);

  return (
    <div className={`step-fs ${playing ? 'playing' : ''}`}>
      <button className="step-fs-back" onClick={onBack} aria-label="Back to menu">
        <svg viewBox="0 0 24 24"><path d="M15 18L9 12L15 6"/></svg>
      </button>
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Listen</div>
        <div className="step-fs-ref">
          {range ? `${range.surahName} · ${range.surah}:${range.startAyah}${range.endAyah !== range.startAyah ? '–' + range.endAyah : ''}` : ''}
        </div>
      </div>
      <div className="step-fs-body">
        <VerseBody verse={verse} playing={playing} />
      </div>
      <div className="step-fs-bottom">
        <VerseProgress total={total} idx={listenIdx} doneSet={doneSet} />
        <div className="verse-fs-audio">
          <div className="verse-fs-meta">
            <span className="reciter">{window.RECITER_NAME}</span>
            <span className="sep">·</span>
            <span>{formatTime(current)}{duration > 0 && ` / ${formatTime(duration)}`}</span>
            <span className="sep">·</span>
            <span>{listenIdx + 1} / {total}</span>
          </div>
          <div className="verse-fs-audio-row">
            <button className="player-btn-small" onClick={prev} disabled={listenIdx === 0} aria-label="Previous verse">
              <svg viewBox="0 0 24 24"><path d="M19 5L9 12L19 19V5Z M5 5V19"/></svg>
            </button>
            <button className="player-btn" onClick={toggle} aria-label={playing ? 'Pause' : 'Play'}>
              {playing
                ? <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                : <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
              }
            </button>
            <button className="player-btn-small" onClick={next} disabled={listenIdx >= total - 1} aria-label="Next verse">
              <svg viewBox="0 0 24 24"><path d="M5 5L15 12L5 19V5Z M19 5V19"/></svg>
            </button>
          </div>
          <div className="verse-fs-wave" aria-hidden="true">
            {wave.map((b, i) => (
              <span key={i} style={{ height: b.h + 'px', opacity: b.op }} />
            ))}
          </div>
          <div className="verse-fs-actions">
            <button className="action-soft" onClick={() => verse && openTafsir(verse.surah, verse.ayah, range.surahName)}>
              Tafsīr
            </button>
            <button className="action-soft" onClick={replayVerse}>Repeat verse</button>
            {listenAllDone && (
              <button className="action-soft" onClick={repeatAll}>Repeat all</button>
            )}
          </div>
        </div>
        <button className="action" onClick={onContinue}>
          <span className="action-text">{listenAllDone ? 'Continue' : 'I am ready'}</span>
          <span className="action-line"></span>
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   SELECT PHASE — pick how many verses to ponder
   ═══════════════════════════════════════════════════ */
function SelectPhase({ range, onBack, onContinue, pivotAyah, setPivotAyah, openTafsir }) {

      </div>
      <div className="step-fs-body">
        <div className="select-intro">
          Which of these verses will you sit with? Tap the last one to include — the first is already chosen.
        </div>
        <div className="select-list-wrap">
          <div className="select-list">
            {verses.map((v, i) => {

              const isPivot = v.ayah === pivotAyah;
              const included = v.ayah <= pivotAyah;

                <button

          <span className="action-text">Continue</span>

        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   PONDER PHASE — manual nav, timer, no audio
   ═══════════════════════════════════════════════════ */
function PonderPhase({ verses, surahName, onBack, onContinue, openTafsir, ponderIdx, setPonderIdx, ponderRemaining, setPonderRemaining }) {
  const verse = verses[ponderIdx];
  const total = verses.length;
  const done = ponderRemaining <= 0;
  useEffect(() => {
    if (done) return;
    let start = Date.now();
    let base = ponderRemaining;
    const i = setInterval(() => {
      const elapsed = (Date.now() - start) / 1000;
      const rem = Math.max(0, base - elapsed);
      setPonderRemaining(rem);
      if (rem <= 0) clearInterval(i);
    }, 250);
    return () => clearInterval(i);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [done]);
  const prev = () => { if (ponderIdx > 0) setPonderIdx(ponderIdx - 1); };
  const next = () => { if (ponderIdx < total - 1) setPonderIdx(ponderIdx + 1); };
  return (
    <div className="step-fs">
      <button className="step-fs-back" onClick={onBack} aria-label="Back to menu">
        <svg viewBox="0 0 24 24"><path d="M15 18L9 12L15 6"/></svg>
      </button>
      <div className="step-fs-top">
        <div className="step-fs-eyebrow">Ponder</div>
        <div className="step-fs-ref">{surahName} · {verse.surah}:{verse.ayah}</div>
      </div>
      <div className="step-fs-body">
        <VerseBody verse={verse} playing={false} />
      </div>
      <div className="step-fs-bottom">
        <VerseProgress total={total} idx={ponderIdx} doneSet={null} />
        <div className="ponder-instruction">
          Read slowly. Let each meaning land. Move between verses freely.
        </div>
        <div className="ponder-actions">
          <button className="player-btn-small" onClick={prev} disabled={ponderIdx === 0} aria-label="Previous verse">
            <svg viewBox="0 0 24 24"><path d="M15 18L9 12L15 6"/></svg>
          </button>
          <button className="action-soft" onClick={() => openTafsir(verse.surah, verse.ayah, surahName)}>Tafsīr</button>
          <button className="player-btn-small" onClick={next} disabled={ponderIdx >= total - 1} aria-label="Next verse">
            <svg viewBox="0 0 24 24"><path d="M9 6L15 12L9 18"/></svg>
          </button>
        </div>
        <div className="ponder-timer" data-done={done ? 'true' : 'false'}>
          <span className="pt-dot"></span>
          <span>{done ? 'time complete' : formatTime(ponderRemaining)}</span>
        </div>
        <button className="action" onClick={onContinue}>
          <span className="action-text">{done ? 'Continue' : "I'm ready"}</span>
          <span className="action-line"></span>
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   QUESTIONS PHASE — 5 questions with verse panel
   ═══════════════════════════════════════════════════ */
function QuestionsPhase({ verses, surahName, qIdx, setQIdx, qRemaining, setQRemaining, onComplete, openTafsir }) {
  const total = window.QUESTIONS.length;
  const [panelOpen, setPanelOpen] = useState(false);
  const [confirmOpen, setConfirmOpen] = useState(false);
  useEffect(() => { setQRemaining(window.QUESTION_SECONDS); }, [qIdx, setQRemaining]);
  useEffect(() => {
    if (qRemaining <= 0) return;
    let start = Date.now();
    let base = qRemaining;
    const i = setInterval(() => {
      const elapsed = (Date.now() - start) / 1000;
      const rem = Math.max(0, base - elapsed);
      setQRemaining(rem);
      if (rem <= 0) {
        clearInterval(i);
        if (qIdx < total - 1) setQIdx(qIdx + 1);
        else onComplete();
      }
    }, 250);
    return () => clearInterval(i);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [qIdx]);
  const advance = () => {
    if (qIdx < total - 1) setQIdx(qIdx + 1);
    else onComplete();
  };
  const tryEarly = () => {
    if (qRemaining > 5) setConfirmOpen(true);
    else advance();
  };
  return (
    <div className="step-fs">
      <div className="step-fs-top">
        <div className="q-pill">
          <span>Question</span>
          <span className="q-pill-dots">
            {Array.from({ length: total }).map((_, i) => (
              <span key={i} className={`q-pill-dot ${i === qIdx ? 'active' : (i < qIdx ? 'done' : '')}`} />
            ))}
          </span>
          <span style={{ fontVariantNumeric: 'tabular-nums', color: 'var(--ink-faint)' }}>{formatTime(qRemaining)}</span>
        </div>
      </div>
      <div className="step-fs-body">
        <div className="question-body">
          <div className="question-ornament"><div className="o-line"></div><div className="o-mark">◇</div><div className="o-line flip"></div></div>
          <div className="question-text">{window.QUESTIONS[qIdx]}</div>
          <div className="question-hint">Sit with this. Don't rush to answer.</div>
        </div>
        <div className="qverse-panel" data-open={panelOpen ? 'true' : 'false'}>
          <button className="qverse-panel-toggle" onClick={() => setPanelOpen(!panelOpen)}>
            <span>{panelOpen ? 'Hide verses' : 'Show verses'}</span>
            <span className="chev"></span>
          </button>
          <div className="qverse-panel-body">
            <div className="qverse-scroller">
              {verses.map(v => (
                <div className="qverse-item" key={v.key}>
                  <div className="qverse-item-head">
                    <span className="qverse-item-num">{surahName} · {v.surah}:{v.ayah}</span>
                    <button className="qverse-item-tafsir" onClick={() => openTafsir(v.surah, v.ayah, surahName)}>Tafsīr</button>
                  </div>
                  <div className="qverse-item-arabic">{v.arabic}</div>
                  <div className="qverse-item-trans">{v.translation}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      <div className="step-fs-bottom">
        <button className="action" onClick={tryEarly}>
          <span className="action-text">{qIdx < total - 1 ? 'Next question' : 'Continue'}</span>
          <span className="action-line"></span>
        </button>
      </div>
      <ConfirmModal
        open={confirmOpen}
        eyebrow="Confirm"
        message="Are you sure you want to move on from this question?"
        time={qRemaining}
        confirmLabel="Yes, move on"
        cancelLabel="Stay"
        onConfirm={() => { setConfirmOpen(false); advance(); }}
        onCancel={() => setConfirmOpen(false)}
      />
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   WRITE PHASE — actions / commitments
   ═══════════════════════════════════════════════════ */
function WritePhase({ initialActions, onContinue }) {
  const [items, setItems] = useState(() => {
    if (initialActions && initialActions.length) {
      return initialActions.map(a => ({ key: uid(), text: a.text || '', existingId: a.id || null }));
    }
    return [{ key: uid(), text: '', existingId: null }, { key: uid(), text: '', existingId: null }];
  });
  const update = (k, t) => setItems(arr => arr.map(it => it.key === k ? { ...it, text: t } : it));
  const remove = (k) => setItems(arr => arr.length > 1 ? arr.filter(it => it.key !== k) : arr);
  const add = () => setItems(arr => [...arr, { key: uid(), text: '', existingId: null }]);
  const proceed = () => {
    const clean = items.map(it => ({ text: it.text.trim(), existingId: it.existingId })).filter(it => it.text);
    onContinue(clean);
  };

    <div className="step-fs">

        <div className="step-fs-eyebrow">Resolve</div>
      </div>

            {items.map((it, i) => (
              <div className="write-row" key={it.key}>
                <span className="write-row-num">{String(i + 1).padStart(2, '0')}</span>
                <input
                  className="write-input"

                  onChange={e => update(it.key, e.target.value)}

            ))}

      <div className="step-fs-bottom">

          <span className="action-text">Continue</span>
          <span className="action-line"></span>
        </button>
      </div>

  );
}

function useDebouncedSave(value, save, delay = 600) {
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const t = setTimeout(() => save(value), delay);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [value]);
}

function SectionResolutions({ actions, db, openHelp }) {
  const [showAll, setShowAll] = useState(false);
  const sorted = useMemo(() => {
    const arr = [...actions];
    arr.sort((a, b) => (a.ranking ?? 0) - (b.ranking ?? 0));
    return arr;
  }, [actions]);
  const visible = showAll ? sorted : sorted.slice(0, 3);
  const move = (idx, dir) => {
    const ni = idx + dir;
    if (ni < 0 || ni >= sorted.length) return;
    const reordered = [...sorted];
    const [it] = reordered.splice(idx, 1);
    reordered.splice(ni, 0, it);
    db.reorderActions(reordered.map(a => a.id));
  };
  return (
    <div className="dash-section">
      <SectionHead
        title="Resolutions"
        sub="What you've committed to do. The top three matter most."
        helpKey="resolutions"
        openHelp={openHelp}
      />

          ? <div className="dash-empty">Your resolutions will appear here.</div>

              <div key={a.id} className="action-row">

                <div className="action-row-text">{a.text}</div>

                  </button>
                  <button className="action-row-arrow" disabled={i === sorted.length - 1} onClick={() => move(i, 1)} aria-label="Move down">
                    <svg viewBox="0 0 24 24"><path d="M6 10L12 16L18 10"/></svg>
                  </button>
                </div>
              </div>
            ))
        }
        {sorted.length > 3 && (
          <button className="dash-more" onClick={() => setShowAll(!showAll)}>
            {showAll ? 'Show less' : `Show all ${sorted.length}`}

  );
}

function SectionTomorrow({ timetable, db, openHelp }) {
  const blocks = useMemo(() => {
    const arr = (timetable && timetable.blocks) ? [...timetable.blocks] : defaultPrayerBlocks();
    /* Ensure all five prayers exist */
    const prayerSet = new Set(arr.filter(b => b.kind === 'prayer').map(b => b.prayerId));
    for (const p of window.PRAYERS) {
      if (!prayerSet.has(p.id)) arr.push({ id: p.id, kind: 'prayer', prayerId: p.id, title: p.label, time: '' });
    }
    return arr;
  }, [timetable]);
  const save = (next) => db.setTimetable({ blocks: next });
  const updateBlock = (id, patch) => save(blocks.map(b => b.id === id ? { ...b, ...patch } : b));
  const addBlock = () => save([...blocks, { id: uid(), kind: 'custom', title: '', time: '' }]);
  const removeBlock = (id) => save(blocks.filter(b => b.id !== id));
  /* Sort visually by time when given, else by original order */
  const visible = useMemo(() => {
    const withTime = blocks.filter(b => b.time);
    const withoutTime = blocks.filter(b => !b.time);
    withTime.sort((a, b) => a.time.localeCompare(b.time));
    return [...withTime, ...withoutTime];
  }, [blocks]);
  return (
    <div className="dash-section">
      <SectionHead
        title="Tomorrow"
        sub="Slot the prayers; arrange the day around them."
        helpKey="tomorrow"
        openHelp={openHelp}
      />

        <div className="tt-card">
          {visible.map(b => (
            <div key={b.id} className={`tt-row ${b.kind === 'prayer' ? 'prayer' : ''}`}>

                <input
                  type="time"
                  value={b.time || ''}
                  onChange={e => updateBlock(b.id, { time: e.target.value })}

              </div>
              {b.kind === 'prayer'
                ? <div className="tt-title-input">{b.title}</div>
                : <input
                    className="tt-title-input"
                    value={b.title || ''}
                    onChange={e => updateBlock(b.id, { title: e.target.value })}
                    placeholder="What is this block?"

              }
              {b.kind === 'custom'
                ? <button className="tt-remove" onClick={() => removeBlock(b.id)} aria-label="Remove">
                    <svg viewBox="0 0 24 24"><path d="M6 6L18 18M6 18L18 6"/></svg>
