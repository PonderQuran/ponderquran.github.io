<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qalb · Orbit</title>

<style>
/* Shared base styles for all three Quran pondering variations */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&family=Amiri+Quran&family=Cormorant:ital,wght@0,300;0,400;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Cardo:ital,wght@0,400;1,400&display=swap');

.v-root {
  font-family: 'Inter Tight', system-ui, sans-serif;
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--ink);
  background: var(--bg);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.v-root * {
  box-sizing: border-box;
}

.v-root::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 20;
}

.arabic-font {
  font-family: 'Amiri Quran', 'Scheherazade New', serif;
  direction: rtl;
  font-feature-settings: "calt" 1, "liga" 1;
}

.serif {
  font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
}

.fraunces {
  font-family: 'Fraunces', 'Cormorant Garamond', serif;
}

.cardo {
  font-family: 'Cardo', 'EB Garamond', serif;
}

/* Scrollbars */
.v-root .scroll::-webkit-scrollbar {
  width: 3px;
}
.v-root .scroll::-webkit-scrollbar-track {
  background: transparent;
}
.v-root .scroll::-webkit-scrollbar-thumb {
  background: var(--accent-soft);
  opacity: 0.3;
  border-radius: 2px;
}
.v-root .scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--accent-soft) transparent;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

/* Theme-button ring (same across variations; each variation can override shape) */
.theme-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 300ms;
  position: relative;
  border: none;
  padding: 0;
}

.theme-dot:hover {
  transform: scale(1.12);
}

.theme-dot.active::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid currentColor;
  opacity: 0.4;
}

@keyframes v-fade-rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes v-breathe {
  0%, 100% { transform: scale(0.88); opacity: 0.35; }
  50% { transform: scale(1); opacity: 0.7; }
}

@keyframes v-pulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

@keyframes v-spin-slow {
  to { transform: rotate(360deg); }
}

.fade-in {
  animation: v-fade-rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* Variation 1 — Orbit */

.orbit-root {
  background:
    radial-gradient(ellipse at center top, color-mix(in oklab, var(--accent) 8%, transparent) 0%, transparent 50%),
    radial-gradient(ellipse at center bottom, var(--bg-soft) 0%, var(--bg) 70%),
    var(--bg);
}

.orbit-backdrop {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.orbit-backdrop span {
  position: absolute;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 4px var(--accent);
}

.orbit-glow {
  position: absolute;
  inset: 10% 10%;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 6%, transparent) 0%, transparent 60%);
  pointer-events: none;
}

/* Header */
.orbit-header {
  position: absolute;
  top: 32px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 5;
}

.orbit-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.orbit-brand-mark {
  color: var(--accent);
  font-size: 16px;
}

.orbit-brand-name {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--ink);
  font-style: italic;
}

.orbit-brand-sub {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* Stage */
.orbit-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  opacity: 0.15;
}
.orbit-ring.ring-1 { width: 240px; height: 240px; }
.orbit-ring.ring-2 { width: 480px; height: 480px; opacity: 0.12; }
.orbit-ring.ring-3 {
  width: 720px; height: 720px;
  opacity: 0.08;
  border-style: dashed;
  animation: v-spin-slow 240s linear infinite;
}

.orbit-corner {
  position: absolute;
  opacity: 0.5;
}
.orbit-corner.tl { top: 24px; left: 24px; }
.orbit-corner.tr { top: 24px; right: 24px; }
.orbit-corner.bl { bottom: 24px; left: 24px; }
.orbit-corner.br { bottom: 24px; right: 24px; }

/* Step markers */
.orbit-steps {
  position: absolute;
  width: 0;
  height: 0;
  top: 50%;
  left: 50%;
  pointer-events: none;
}

.orbit-step {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px;
  margin: -30px;
  width: 60px;
  background: none;
  color: var(--ink-faint);
  transition: color 300ms, transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
}

.orbit-step:hover {
  color: var(--ink-soft);
}

.orbit-step-glyph {
  font-size: 14px;
  opacity: 0.5;
  transition: all 400ms;
}

.orbit-step-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.6;
  font-style: italic;
}

.orbit-step.visited .orbit-step-glyph {
  color: var(--accent);
  opacity: 0.8;
}

.orbit-step.active {
  color: var(--ink);
}
.orbit-step.active .orbit-step-glyph {
  color: var(--accent);
  opacity: 1;
  font-size: 18px;
  text-shadow: 0 0 12px var(--accent);
}
.orbit-step.active .orbit-step-label {
  opacity: 1;
}

/* Center content */
.orbit-center {
  position: relative;
  z-index: 3;
  width: 420px;
  max-width: 90vw;
  text-align: center;
  padding: 32px;
}

.orbit-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.orbit-eyebrow {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-family: 'Inter Tight', sans-serif;
}

.orbit-title {
  font-size: 38px;
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.orbit-ref {
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
}

.orbit-hint {
  font-size: 14px;
  color: var(--ink-soft);
  font-style: italic;
  line-height: 1.6;
  max-width: 320px;
}

.orbit-arabic {
  font-size: 28px;
  line-height: 2;
  color: var(--ink);
  max-width: 380px;
}

.orbit-arabic-med {
  font-size: 22px;
  line-height: 2;
  color: var(--ink);
  max-width: 400px;
}

.orbit-translation {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink-soft);
  font-style: italic;
  max-width: 360px;
}

/* Action */
.orbit-action {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  color: var(--ink);
  transition: color 300ms;
}

.orbit-action-text {
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  font-family: 'Inter Tight', sans-serif;
}

.orbit-action-line {
  width: 24px;
  height: 1px;
  background: var(--accent);
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
}

.orbit-action:hover .orbit-action-line {
  width: 56px;
}

.orbit-action-soft {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
  padding: 8px 12px;
}

.orbit-action-soft:hover {
  color: var(--ink-soft);
}

/* Waveform */
.orbit-wave {
  display: flex;
  gap: 3px;
  align-items: center;
  height: 40px;
}
.orbit-wave span {
  display: block;
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
}

/* Breathing */
.orbit-breath {
  position: relative;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-breath-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--accent);
  animation: v-breathe 6s ease-in-out infinite;
}

.orbit-breath-ring.b2 {
  inset: -18px;
  border-color: var(--accent-soft);
  animation-duration: 6s;
  animation-delay: -0.2s;
  opacity: 0.4;
}

.orbit-breath-word {
  font-size: 14px;
  font-style: italic;
  letter-spacing: 0.4em;
  color: var(--ink-soft);
  z-index: 2;
  text-transform: lowercase;
}

/* Prompt + note */
.orbit-prompt {
  font-size: 26px;
  font-style: italic;
  line-height: 1.4;
  color: var(--ink);
  letter-spacing: -0.005em;
  max-width: 380px;
}

.orbit-note {
  width: 100%;
  max-width: 380px;
  min-height: 80px;
  background: color-mix(in oklab, var(--bg) 60%, var(--bg-soft));
  border: 1px solid var(--accent-soft);
  border-radius: 2px;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  padding: 14px;
  resize: none;
  font-style: italic;
  outline: none;
  transition: border-color 300ms;
}

.orbit-note:focus {
  border-color: var(--accent);
}

.orbit-note::placeholder {
  color: var(--ink-faint);
  opacity: 0.6;
}

/* Record button */
.orbit-record {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 1px solid var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 400ms;
}

.orbit-record-inner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  transition: all 400ms;
}

.orbit-record.recording {
  border-color: var(--accent);
  box-shadow: 0 0 24px color-mix(in oklab, var(--accent) 40%, transparent);
}

.orbit-record.recording .orbit-record-inner {
  border-radius: 3px;
  width: 14px;
  height: 14px;
}

.orbit-record.done .orbit-record-inner {
  background: var(--ink-soft);
}

.orbit-record-timer {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
}

/* Tafsir */
.orbit-tafsir-tabs {
  display: flex;
  gap: 24px;
  justify-content: center;
}
.orbit-tab {
  font-size: 13px;
  font-style: italic;
  color: var(--ink-faint);
  padding: 4px 0;
  position: relative;
  transition: color 300ms;
}
.orbit-tab.active {
  color: var(--ink);
}
.orbit-tab.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 1px;
  background: var(--accent);
}

.orbit-tafsir-body {
  max-height: 200px;
  overflow-y: auto;
  text-align: left;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-soft);
  padding-right: 8px;
  max-width: 400px;
}

.orbit-tafsir-body p + p {
  margin-top: 10px;
}

.orbit-tafsir-era {
  font-family: 'Inter Tight', sans-serif;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 12px;
}

.orbit-ornament {
  font-size: 32px;
  color: var(--accent);
  opacity: 0.7;
}

.orbit-countdown {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--accent);
  opacity: 0.8;
  font-variant-numeric: tabular-nums;
}

/* Theme picker */
.orbit-themes {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 5;
}

.orbit-themes-label {
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-style: italic;
}

.orbit-themes-row {
  display: flex;
  gap: 14px;
  padding: 10px 20px;
  border-radius: 100px;
  background: color-mix(in oklab, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
  backdrop-filter: blur(12px);
}

.orbit-theme-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  position: relative;
  transition: transform 300ms;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
}

.orbit-theme-dot:hover {
  transform: scale(1.15);
}

.orbit-theme-dot.active {
  transform: scale(1.15);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 0 2px var(--ink), 0 0 16px var(--accent);
}

.orbit-theme-tooltip {
  position: absolute;
  bottom: 140%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}

.orbit-theme-dot:hover .orbit-theme-tooltip,
.orbit-theme-dot.active .orbit-theme-tooltip {
  opacity: 1;
}

@media (max-width: 768px) {
  .orbit-ring.ring-3 { display: none; }
  .orbit-ring.ring-2 { width: 360px; height: 360px; }
  .orbit-ring.ring-1 { width: 200px; height: 200px; }
  .orbit-step { transform: scale(0.8); }
  .orbit-title { font-size: 28px; }
  .orbit-prompt { font-size: 22px; }
}


html, body { margin: 0; padding: 0; height: 100%; background: #0a0812;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#orbit-mount { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<div id="orbit-mount"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// Shared verse data & theme palettes for the Quran pondering app
// Each variation uses this to stay consistent.

window.VERSE = {
  surah: 'Al-Baqarah',
  surahArabic: 'ٱلْبَقَرَة',
  ref: '2:255',
  name: 'Āyat al-Kursī',
  arabic: 'ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ',
  translation: 'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Throne extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.',
  transliteration: 'Allāhu lā ilāha illā huwa, al-Ḥayyu al-Qayyūm. Lā taʾkhudhuhū sinatun wa lā nawm...',
  wordByWord: [
    { ar: 'ٱللَّهُ', en: 'Allah' },
    { ar: 'لَآ إِلَٰهَ', en: 'no deity' },
    { ar: 'إِلَّا هُوَ', en: 'except He' },
    { ar: 'ٱلْحَىُّ', en: 'the Ever-Living' },
    { ar: 'ٱلْقَيُّومُ', en: 'the Sustainer' },
  ],
  prompts: [
    'What does this verse reveal about the One you turn to?',
    'Where in your day did you forget that He never sleeps?',
    'One small thing to carry into the next six hours.',
  ],
  tafsirs: [
    {
      scholar: 'Ibn Kathīr',
      era: '14th c.',
      body: [
        'This verse is called Āyat al-Kursī — the Verse of the Throne — and the Prophet ﷺ called it the greatest verse in the Qurʾān. In it, Allah affirms His oneness, His eternal life, and His absolute sustaining of all creation.',
        'Al-Ḥayy (the Ever-Living) and al-Qayyūm (the Self-Sustaining) are two names that contain the meanings of all the others. He lives without beginning or end; all else lives by His granting. He sustains Himself and sustains everything else.',
        'The mention of slumber and sleep is for clarity: a human who watches over something eventually tires. Allah never does. What you loved yesterday, what you are afraid of now, what you hope for tomorrow — none of it is unattended.',
      ],
    },
    {
      scholar: 'Ma‘ārif al-Qurʾān',
      era: '20th c.',
      body: [
        'Reflect on the sequence of the verse: first the affirmation of tawḥīd, then the attributes of life and sustaining, then ownership of the heavens and earth, then intercession, then knowledge, then the throne, then the ease with which He preserves all of it.',
        'The one who memorises this verse and sits with it gains something the world cannot give: a settled heart. This is why the Prophet ﷺ taught it to be recited after every prayer and before sleep.',
      ],
    },
    {
      scholar: 'Tazkir al-Qurʾān',
      era: 'Modern',
      body: [
        'The verse does not merely describe Allah — it re-orients the reader. If He is al-Qayyūm, then you are not holding your life together. You are being held.',
        'Let this one thought rest in you: the heavens and the earth do not tire Him. Neither do you.',
      ],
    },
  ],
};

// Five themes, each defined by a primary hue (oklch) + accent.
// Circular buttons expose these in every variation.
window.THEMES = [
  {
    id: 'night',
    name: 'Night',
    subtitle: 'Deep sky, gold',
    bg: '#0a0812',
    bgSoft: '#141020',
    ink: '#ece3d0',
    inkSoft: '#b5a98f',
    inkFaint: '#6b5f48',
    accent: '#c9a14a',
    accentSoft: '#8f6f32',
    ring: 'radial-gradient(circle at 30% 30%, #e9cc7a, #8f6a24 60%, #3a2a0e)',
  },
  {
    id: 'dusk',
    name: 'Dusk',
    subtitle: 'Plum horizon',
    bg: '#14101a',
    bgSoft: '#1e1726',
    ink: '#f0e3d5',
    inkSoft: '#bfa99a',
    inkFaint: '#6e5d6a',
    accent: '#d7826a',
    accentSoft: '#9a5540',
    ring: 'radial-gradient(circle at 30% 30%, #f3b6a2, #b25f46 55%, #3d1d18)',
  },
  {
    id: 'olive',
    name: 'Olive',
    subtitle: 'Garden, dim light',
    bg: '#0f1410',
    bgSoft: '#171e18',
    ink: '#e7e0cd',
    inkSoft: '#a9b099',
    inkFaint: '#5a6352',
    accent: '#a8b266',
    accentSoft: '#6d7840',
    ring: 'radial-gradient(circle at 30% 30%, #d6dc9a, #7a8840 55%, #2a3014)',
  },
  {
    id: 'paper',
    name: 'Paper',
    subtitle: 'Warm parchment',
    bg: '#f2ebdb',
    bgSoft: '#e7ddc7',
    ink: '#2a231a',
    inkSoft: '#5a4d3c',
    inkFaint: '#a08f75',
    accent: '#8a6a2b',
    accentSoft: '#b89759',
    ring: 'radial-gradient(circle at 30% 30%, #e9cc7a, #8a6a2b 55%, #3a2a0e)',
    light: true,
  },
  {
    id: 'indigo',
    name: 'Indigo',
    subtitle: 'Cold midnight',
    bg: '#070a14',
    bgSoft: '#0f1428',
    ink: '#e4e7f0',
    inkSoft: '#9ba3bf',
    inkFaint: '#4a5375',
    accent: '#8aa6ff',
    accentSoft: '#5370c8',
    ring: 'radial-gradient(circle at 30% 30%, #c4d1ff, #4760c0 55%, #14204a)',
  },
];

</script>

<script type="text/babel" data-presets="react">
/* global React */

// ═══════════════════════════════════════════════════════════════════════════
// VARIATION 1 — ORBIT
// A concentric, radial interface. The verse sits at the center of a quiet
// orbit; each step of the journey lives on a ring around it. Theme buttons
// are solid color spheres. Geometric motifs throughout.
// ═══════════════════════════════════════════════════════════════════════════

const { useState, useEffect, useRef } = React;

const ORBIT_STEPS = [
  { id: 'arrive',  label: 'Arrive',  glyph: '✦' },
  { id: 'listen',  label: 'Listen',  glyph: '◉' },
  { id: 'breathe', label: 'Breathe', glyph: '◯' },
  { id: 'recite',  label: 'Recite',  glyph: '✺' },
  { id: 'reflect', label: 'Reflect', glyph: '◈' },
  { id: 'record',  label: 'Record',  glyph: '●' },
  { id: 'tafsir',  label: 'Scholars',glyph: '✧' },
  { id: 'close',   label: 'Close',   glyph: '❋' },
];

function OrbitRoot() {
  const [themeIdx, setThemeIdx] = useState(0);
  const [step, setStep] = useState('arrive');
  const theme = window.THEMES[themeIdx];

  // Apply theme as CSS vars
  const styleVars = {
    '--bg': theme.bg,
    '--bg-soft': theme.bgSoft,
    '--ink': theme.ink,
    '--ink-soft': theme.inkSoft,
    '--ink-faint': theme.inkFaint,
    '--accent': theme.accent,
    '--accent-soft': theme.accentSoft,
  };

  return (
    <div className="v-root orbit-root" style={styleVars}>
      <OrbitBackdrop light={theme.light} />
      <OrbitHeader />
      <OrbitStage step={step} setStep={setStep} theme={theme} />
      <OrbitThemePicker themeIdx={themeIdx} setThemeIdx={setThemeIdx} />
    </div>
  );
}

function OrbitBackdrop({ light }) {
  // Constellation dots
  const stars = Array.from({ length: 80 }, (_, i) => ({
    x: (i * 37) % 100,
    y: (i * 53) % 100,
    s: 0.5 + ((i * 13) % 7) / 10,
    o: 0.1 + ((i * 7) % 5) / 10,
  }));
  return (
    <div className="orbit-backdrop" aria-hidden>
      {!light && stars.map((s, i) => (
        <span key={i} style={{
          left: `${s.x}%`, top: `${s.y}%`,
          width: `${s.s}px`, height: `${s.s}px`,
          opacity: s.o,
        }} />
      ))}
      <div className="orbit-glow" />
    </div>
  );
}

function OrbitHeader() {
  return (
    <div className="orbit-header">
      <div className="orbit-brand">
        <span className="orbit-brand-mark">✦</span>
        <span className="orbit-brand-name serif">Mirān</span>
      </div>
      <div className="orbit-brand-sub">Day 042 · A verse to sit with</div>
    </div>
  );
}

function OrbitStage({ step, setStep, theme }) {
  // Ring positions for each step (8 steps around a circle)
  const stepIdx = ORBIT_STEPS.findIndex(s => s.id === step);

  return (
    <div className="orbit-stage">
      {/* Concentric rings */}
      <div className="orbit-ring ring-1" />
      <div className="orbit-ring ring-2" />
      <div className="orbit-ring ring-3" />

      {/* Geometric corner ornaments */}
      <GeometricCorners />

      {/* Orbiting step markers */}
      <div className="orbit-steps">
        {ORBIT_STEPS.map((s, i) => {
          const angle = (i / ORBIT_STEPS.length) * 2 * Math.PI - Math.PI / 2;
          const radius = 240;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          const active = s.id === step;
          const visited = i < stepIdx;
          return (
            <button
              key={s.id}
              className={`orbit-step ${active ? 'active' : ''} ${visited ? 'visited' : ''}`}
              style={{ transform: `translate(${x}px, ${y}px)` }}
              onClick={() => setStep(s.id)}
            >
              <span className="orbit-step-glyph">{s.glyph}</span>
              <span className="orbit-step-label serif">{s.label}</span>
            </button>
          );
        })}
      </div>

      {/* Center content changes by step */}
      <div className="orbit-center">
        <OrbitContent step={step} setStep={setStep} stepIdx={stepIdx} />
      </div>
    </div>
  );
}

function GeometricCorners() {
  const corner = (
    <svg viewBox="0 0 80 80" width="80" height="80">
      <g stroke="var(--accent)" strokeWidth="0.5" fill="none" opacity="0.45">
        <path d="M0 40 L40 0 L80 40 L40 80 Z" />
        <path d="M20 40 L40 20 L60 40 L40 60 Z" />
        <circle cx="40" cy="40" r="4" fill="var(--accent)" opacity="0.6" />
      </g>
    </svg>
  );
  return (
    <>
      <div className="orbit-corner tl">{corner}</div>
      <div className="orbit-corner tr">{corner}</div>
      <div className="orbit-corner bl">{corner}</div>
      <div className="orbit-corner br">{corner}</div>
    </>
  );
}

function OrbitContent({ step, setStep, stepIdx }) {
  const v = window.VERSE;
  const next = () => {
    const n = ORBIT_STEPS[stepIdx + 1];
    if (n) setStep(n.id);
  };

  return (
    <div className="orbit-content fade-in" key={step}>
      {step === 'arrive' && (
        <>
          <div className="orbit-eyebrow">Day 042</div>
          <div className="orbit-title serif">{v.name}</div>
          <div className="orbit-ref">{v.surah} · {v.ref}</div>
          <div className="orbit-hint">Five minutes. No more today. <br/>Welcome back.</div>
          <OrbitAction onClick={next} label="Begin" />
        </>
      )}
      {step === 'listen' && (
        <>
          <div className="orbit-eyebrow">Listen</div>
          <div className="orbit-arabic arabic-font">{v.arabic.split('۔')[0].slice(0, 60)}…</div>
          <OrbitWaveform />
          <div className="orbit-hint">Mishary al-ʿAfāsy · 0:38 / 1:12</div>
          <OrbitAction onClick={next} label="Continue" />
        </>
      )}
      {step === 'breathe' && (
        <>
          <div className="orbit-eyebrow">Rest here</div>
          <div className="orbit-breath">
            <div className="orbit-breath-ring" />
            <div className="orbit-breath-ring b2" />
            <div className="orbit-breath-word serif">breathe</div>
          </div>
          <OrbitAction onClick={next} label="Continue" />
        </>
      )}
      {step === 'recite' && (
        <>
          <div className="orbit-eyebrow">Say it with your own voice</div>
          <div className="orbit-arabic-med arabic-font">{v.arabic.slice(0, 90)}</div>
          <div className="orbit-translation serif">{v.translation.slice(0, 160)}…</div>
          <OrbitAction onClick={next} label="I have recited" />
        </>
      )}
      {step === 'reflect' && (
        <OrbitReflect next={next} />
      )}
      {step === 'record' && (
        <OrbitRecord next={next} />
      )}
      {step === 'tafsir' && (
        <OrbitTafsir next={next} />
      )}
      {step === 'close' && (
        <>
          <div className="orbit-ornament">❋</div>
          <div className="orbit-title serif" style={{ fontSize: '28px' }}>You have sat with today's verse.</div>
          <div className="orbit-hint">Your 42nd. Another is coming.</div>
          <div className="orbit-countdown">14 : 23 : 07</div>
        </>
      )}
    </div>
  );
}

function OrbitAction({ onClick, label }) {
  return (
    <button className="orbit-action" onClick={onClick}>
      <span className="orbit-action-text">{label}</span>
      <span className="orbit-action-line" />
    </button>
  );
}

function OrbitWaveform() {
  return (
    <div className="orbit-wave">
      {Array.from({ length: 28 }).map((_, i) => (
        <span key={i} style={{
          height: `${10 + Math.abs(Math.sin(i * 0.7)) * 26}px`,
          opacity: i < 12 ? 0.9 : 0.3,
          animationDelay: `${i * 60}ms`,
        }} />
      ))}
    </div>
  );
}

function OrbitReflect({ next }) {
  const [promptIdx, setPromptIdx] = useState(0);
  const [note, setNote] = useState('');
  const prompts = window.VERSE.prompts;
  return (
    <>
      <div className="orbit-eyebrow">Prompt {promptIdx + 1} of {prompts.length}</div>
      <div className="orbit-prompt serif">{prompts[promptIdx]}</div>
      <textarea
        className="orbit-note serif"
        placeholder="Write, or leave this blank."
        value={note}
        onChange={(e) => setNote(e.target.value)}
      />
      <div style={{ display: 'flex', gap: 24, justifyContent: 'center' }}>
        {promptIdx > 0 && (
          <button className="orbit-action-soft" onClick={() => setPromptIdx(promptIdx - 1)}>← Previous</button>
        )}
        {promptIdx < prompts.length - 1 ? (
          <OrbitAction onClick={() => { setPromptIdx(promptIdx + 1); setNote(''); }} label="Next prompt" />
        ) : (
          <OrbitAction onClick={next} label="To recording" />
        )}
      </div>
    </>
  );
}

function OrbitRecord({ next }) {
  const [rec, setRec] = useState('idle'); // idle, recording, done
  const [t, setT] = useState(0);
  useEffect(() => {
    if (rec !== 'recording') return;
    const i = setInterval(() => setT(x => x + 1), 1000);
    return () => clearInterval(i);
  }, [rec]);
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  return (
    <>
      <div className="orbit-eyebrow">Your reflection, aloud</div>
      <div className="orbit-hint" style={{ maxWidth: 280 }}>
        Speak it. As long or short as you need. <br/>
        Only you will hear this.
      </div>
      <button
        className={`orbit-record ${rec}`}
        onClick={() => {
          if (rec === 'idle') setRec('recording');
          else if (rec === 'recording') setRec('done');
        }}
      >
        <span className="orbit-record-inner" />
      </button>
      <div className="orbit-record-timer">
        {rec === 'idle' && 'tap to begin'}
        {rec === 'recording' && `${mm}:${ss} — tap to stop`}
        {rec === 'done' && `saved · ${mm}:${ss}`}
      </div>
      {rec === 'done' && <OrbitAction onClick={next} label="To the scholars" />}
      {rec !== 'done' && (
        <button className="orbit-action-soft" onClick={next}>Skip recording</button>
      )}
    </>
  );
}

function OrbitTafsir({ next }) {
  const [idx, setIdx] = useState(0);
  const t = window.VERSE.tafsirs[idx];
  return (
    <>
      <div className="orbit-eyebrow">The scholars</div>
      <div className="orbit-tafsir-tabs">
        {window.VERSE.tafsirs.map((tf, i) => (
          <button key={i} className={`orbit-tab ${i === idx ? 'active' : ''} serif`} onClick={() => setIdx(i)}>
            {tf.scholar}
          </button>
        ))}
      </div>
      <div className="orbit-tafsir-body scroll serif">
        <div className="orbit-tafsir-era">{t.era}</div>
        {t.body.map((p, i) => <p key={i}>{p}</p>)}
      </div>
      <OrbitAction onClick={next} label="Close the session" />
    </>
  );
}

function OrbitThemePicker({ themeIdx, setThemeIdx }) {
  return (
    <div className="orbit-themes">
      <div className="orbit-themes-label">style</div>
      <div className="orbit-themes-row">
        {window.THEMES.map((t, i) => (
          <button
            key={t.id}
            className={`orbit-theme-dot ${i === themeIdx ? 'active' : ''}`}
            style={{ background: t.ring }}
            onClick={() => setThemeIdx(i)}
            title={t.name}
          >
            <span className="orbit-theme-tooltip">{t.name}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// Mount — poll for the mount node since canvas-app.jsx creates it asynchronously.
ReactDOM.createRoot(document.getElementById('orbit-mount')).render(<OrbitRoot />);
</script>

</body>
</html>
