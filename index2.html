/* ═══════════════════════════════════════════════════
   ROOT — orchestrates everything
   ═══════════════════════════════════════════════════ */
function MiranRoot({ db }) {
  const [snap, setSnap] = useState(() => db.snapshot());
  useEffect(() => db.onChange(setSnap), [db]);

  const themeIdx = (typeof snap.meta.themeIdx === 'number') ? snap.meta.themeIdx : 0;
  const theme = window.THEMES[themeIdx] || window.THEMES[0];
  const setThemeIdx = (i) => db.setMeta({ themeIdx: i });

  const today = todayStr();
  const dailyDone = snap.meta.lastSessionDate === today && !snap.meta.replaySessionId;
  const isReplay = !!snap.meta.replaySessionId;

  /* ─── Determine which verse range to load ─── */
  const [range, setRange] = useState(null);
  const [rangeLoading, setRangeLoading] = useState(false);
  const [rangeError, setRangeError] = useState(null);

  const computedStartPoint = useMemo(() => {
    if (isReplay) {
      const s = snap.sessions.find(x => x.id === snap.meta.replaySessionId);
      if (s) return { surah: s.startSurah, ayah: s.startAyah, replay: s, count: (s.endAyah - s.startAyah + 1) };
      return null;
    }
    const ls = snap.meta.lastVerseSurah || 0;
    const la = snap.meta.lastVerseAyah || 0;
    if (!ls) return { surah: window.START_SURAH, ayah: window.START_AYAH, count: window.SESSION_VERSES };
    return { surah: ls, ayah: la + 1, count: window.SESSION_VERSES, advance: true };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isReplay, snap.meta.replaySessionId, snap.meta.lastVerseSurah, snap.meta.lastVerseAyah, snap.sessions.length]);

  useEffect(() => {
    let active = true;
    if (!computedStartPoint || dailyDone) { setRange(null); return; }
    setRangeLoading(true);
    setRangeError(null);

    (async () => {
      try {
        let surah = computedStartPoint.surah;
        let ayah = computedStartPoint.ayah;
        if (computedStartPoint.advance) {
          let info = await fetchSurahInfo(surah);
          if (info && ayah > info.verses_count) {
            surah = surah + 1;
            if (surah > 114) surah = 2; /* wrap, skip Fātiḥa */
            ayah = 1;
            info = await fetchSurahInfo(surah);
          }
        }
        const r = await fetchVerseRange(surah, ayah, computedStartPoint.count);
        if (active) {
          setRange(r);
          setRangeLoading(false);
        }
      } catch (e) {
        if (active) {
          setRangeError(e.message || 'Failed to load');
          setRangeLoading(false);
        }
      }
    })();

    return () => { active = false; };
  }, [computedStartPoint && computedStartPoint.surah, computedStartPoint && computedStartPoint.ayah, computedStartPoint && computedStartPoint.count, dailyDone]);

  /* ─── View state ─── */
  const [view, setView] = useState('menu');
  const [completed, setCompleted] = useState({ listen: false, select: false, ponder: false, questions: false, write: false });
  const [listenIdx, setListenIdx] = useState(0);
  const [listenAllDone, setListenAllDone] = useState(false);
  const [pivotAyah, setPivotAyah] = useState(null);
  const [ponderIdx, setPonderIdx] = useState(0);
  const [ponderRemaining, setPonderRemaining] = useState(window.PONDER_SEC_PER_VERSE);
  const [qIdx, setQIdx] = useState(0);
  const [qRemaining, setQRemaining] = useState(window.QUESTION_SECONDS);
  const [writeInitial, setWriteInitial] = useState([]);
  const [pendingActions, setPendingActions] = useState([]);

  /* Reset session state when range identity changes (new day OR new replay) */
  useEffect(() => {
    setView('menu');
    setCompleted({ listen: false, select: false, ponder: false, questions: false, write: false });
    setListenIdx(0);
    setListenAllDone(false);
    setPonderIdx(0);
    setQIdx(0);
    setQRemaining(window.QUESTION_SECONDS);
    setPendingActions([]);
    if (range) {
      setPivotAyah(range.verses && range.verses.length ? range.verses[0].ayah : null);
    } else {
      setPivotAyah(null);
    }
    /* If replaying, prefill actions */
    if (isReplay) {
      const repId = snap.meta.replaySessionId;
      const prior = snap.actions.filter(a => a.sessionId === repId);
      setWriteInitial(prior);
    } else {
      setWriteInitial([]);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [range && range.surah, range && range.startAyah, range && range.endAyah, isReplay, snap.meta.replaySessionId]);

  /* Selected (pondered) verses derived from pivotAyah */
  const selectedVerses = useMemo(() => {
    if (!range || pivotAyah == null) return [];
    return range.verses.filter(v => v.ayah <= pivotAyah);
  }, [range, pivotAyah]);

  /* Ponder timer total — resets when count changes */
  const ponderTotalSec = useMemo(() => Math.max(1, selectedVerses.length) * window.PONDER_SEC_PER_VERSE, [selectedVerses.length]);
  const lastTotalRef = useRef(ponderTotalSec);
  useEffect(() => {
    if (lastTotalRef.current !== ponderTotalSec) {
      lastTotalRef.current = ponderTotalSec;
      setPonderRemaining(ponderTotalSec);
    }
  }, [ponderTotalSec]);

  /* ─── Tafsir & Help sheets ─── */
  const [tafsirOpen, setTafsirOpen] = useState(false);
  const [tafsirState, setTafsirState] = useState({ surah: 0, ayah: 0, surahName: '', text: '', loading: false });
  const openTafsir = useCallback((surah, ayah, surahName) => {
    setTafsirState({ surah, ayah, surahName: surahName || '', text: '', loading: true });
    setTafsirOpen(true);
    fetchTafsir(surah, ayah).then(text => {
      setTafsirState(s => (s.surah === surah && s.ayah === ayah) ? { ...s, text, loading: false } : s);
    });
  }, []);
  const closeTafsir = () => setTafsirOpen(false);
  const [helpKey, setHelpKey] = useState(null);
  const openHelp = useCallback((k) => setHelpKey(k), []);
  const closeHelp = () => setHelpKey(null);

  /* ─── Toast ─── */
  const [toast, setToast] = useState(null);
  const showToast = (message) => setToast({ message, key: Date.now() });

  /* ─── Phase progression ─── */
  const phases = ['listen', 'select', 'ponder', 'questions', 'write'];
  const nextIncompletePhase = phases.find(p => !completed[p]) || 'write';
  const phaseLabel = (p) => ({
    listen: 'Listen', select: 'Select', ponder: 'Ponder', questions: 'Reflect', write: 'Resolve'
  }[p]);
  const centerLabel = isReplay ? 'Return' : phaseLabel(nextIncompletePhase);

  /* Floating pills: every completed phase EXCEPT the current next-up.
     Once questions or write completed, no pills (cannot go back). */
  const floatingPills = useMemo(() => {
    if (completed.questions || completed.write) return [];
    const pills = [];
    if (completed.listen && nextIncompletePhase !== 'listen') pills.push({ id: 'listen', label: 'Listen' });
    if (completed.select && nextIncompletePhase !== 'select') pills.push({ id: 'select', label: 'Select' });
    if (completed.ponder && nextIncompletePhase !== 'ponder') pills.push({ id: 'ponder', label: 'Ponder' });
    return pills;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [completed.listen, completed.select, completed.ponder, completed.questions, completed.write, nextIncompletePhase]);

  /* ─── Phase transitions ─── */
  const goToPhase = (p) => setView(p);
  const onCenterClick = () => {
    if (!range) {
      showToast(rangeLoading ? 'Loading verses…' : (rangeError || 'No verses available'));
      return;
    }
    goToPhase(nextIncompletePhase);
  };

  const completeListen = () => {
    setCompleted(c => ({ ...c, listen: true }));
    setView('menu');
  };
  const completeSelect = () => {
    setCompleted(c => ({ ...c, select: true }));
    setView('menu');
  };
  const completePonder = () => {
    setCompleted(c => ({ ...c, ponder: true }));
    setView('menu');
  };
  const completeQuestions = () => {
    setCompleted(c => ({ ...c, questions: true }));
    setView('write');
  };
  const proceedFromWrite = (cleanActions) => {
    setPendingActions(cleanActions);
    setCompleted(c => ({ ...c, write: true }));
    setView('name');
  };

  /* ─── Commit session ─── */
  const commitSession = (title) => {
    if (!range) return;
    db.transact(() => {
      const verses = selectedVerses.map(v => ({ s: v.surah, v: v.ayah }));
      const endAyahSelected = selectedVerses.length ? selectedVerses[selectedVerses.length - 1].ayah : range.startAyah;
      db.markPondered(verses);

      if (isReplay) {
        /* Replay: update existing session title; sync actions */
        const repId = snap.meta.replaySessionId;
        db.updateSession(repId, { title });
        /* Remove existing actions for this session that aren't in pendingActions */
        const existing = snap.actions.filter(a => a.sessionId === repId);
        const keptIds = new Set();
        const newOnes = [];
        for (const it of pendingActions) {
          if (it.existingId) {
            keptIds.add(it.existingId);
            /* Update text if changed */
            const ex = existing.find(e => e.id === it.existingId);
            if (ex && ex.text !== it.text) db.updateAction(it.existingId, { text: it.text });
          } else {
            newOnes.push(it);
          }
        }
        for (const ex of existing) {
          if (!keptIds.has(ex.id)) db.removeAction(ex.id);
        }
        for (const it of newOnes) {
          db.addAction({
            id: uid(),
            text: it.text,
            ranking: db.nextRanking(),
            sessionId: repId,
            createdAt: Date.now(),
          });
        }
        db.setMeta({ replaySessionId: '', lastSessionDate: today });
      } else {
        /* New session */
        const sid = uid();
        db.addSession({
          id: sid,
          title,
          startSurah: range.surah,
          startAyah: range.startAyah,
          endSurah: range.surah,
          endAyah: endAyahSelected,
          surahName: range.surahName,
          verses,
          dateISO: new Date().toISOString(),
          createdAt: Date.now(),
        });
        for (const it of pendingActions) {
          db.addAction({
            id: uid(),
            text: it.text,
            ranking: db.nextRanking(),
            sessionId: sid,
            createdAt: Date.now(),
          });
        }
        db.setMeta({
          lastVerseSurah: range.surah,
          lastVerseAyah: endAyahSelected,
          lastSessionDate: today,
          replaySessionId: '',
        });
      }
    });
    setView('menu');
    showToast(isReplay ? 'Reflection updated.' : 'Session committed.');
  };

  /* ─── Replay handler ─── */
  const onReplay = (sessionId) => {
    db.setMeta({ replaySessionId: sessionId, lastSessionDate: '' });
  };

  /* ─── Theme variables on root ─── */
  const rootStyle = {
    '--bg': theme.bg,
    '--bg-soft': theme.bgSoft,
    '--ink': theme.ink,
    '--ink-soft': theme.inkSoft,
    '--ink-faint': theme.inkFaint,
    '--accent': theme.accent,
    '--accent-soft': theme.accentSoft,
  };

  const isFullscreen = view !== 'menu';

  /* ─── Render ─── */
  return (
    <div
      className="v-root orbit-root"
      data-theme={theme.id}
      data-fullscreen={isFullscreen ? 'true' : 'false'}
      style={rootStyle}
    >
      <OrbitBackdrop />

      {view === 'menu' && (
        <MenuView
          centerLabel={centerLabel}
          onCenterClick={onCenterClick}
          floatingPills={floatingPills}
          onPillClick={(id) => {
            if (id === 'listen' && listenAllDone) {
              setListenIdx(0);
              setListenAllDone(false);
            }
            goToPhase(id);
          }}
          openHelp={openHelp}
          themeIdx={themeIdx}
          setThemeIdx={setThemeIdx}
          dailyDone={dailyDone}
          snap={snap}
          db={db}
          onReplay={onReplay}
        />
      )}

      {view === 'listen' && range && (
        <ListenPhase
          range={range}
          onBack={() => setView('menu')}
          onContinue={completeListen}
          openTafsir={openTafsir}
          listenIdx={listenIdx}
          setListenIdx={setListenIdx}
          listenAllDone={listenAllDone}
          setListenAllDone={setListenAllDone}
        />
      )}

      {view === 'select' && range && (
        <SelectPhase
          range={range}
          onBack={() => setView('menu')}
          onContinue={completeSelect}
          pivotAyah={pivotAyah || (range.verses[0] && range.verses[0].ayah)}
          setPivotAyah={setPivotAyah}
          openTafsir={openTafsir}
        />
      )}

      {view === 'ponder' && range && selectedVerses.length > 0 && (
        <PonderPhase
          verses={selectedVerses}
          surahName={range.surahName}
          onBack={() => setView('menu')}
          onContinue={completePonder}
          openTafsir={openTafsir}
          ponderIdx={Math.min(ponderIdx, selectedVerses.length - 1)}
          setPonderIdx={setPonderIdx}
          ponderRemaining={ponderRemaining}
          setPonderRemaining={setPonderRemaining}
        />
      )}

      {view === 'questions' && selectedVerses.length > 0 && range && (
        <QuestionsPhase
          verses={selectedVerses}
          surahName={range.surahName}
          qIdx={qIdx}
          setQIdx={setQIdx}
          qRemaining={qRemaining}
          setQRemaining={setQRemaining}
          onComplete={completeQuestions}
          openTafsir={openTafsir}
        />
      )}

      {view === 'write' && (
        <WritePhase
          initialActions={writeInitial}
          onContinue={proceedFromWrite}
        />
      )}

      {view === 'name' && range && (
        <NameSession
          range={{ ...range, endAyah: selectedVerses.length ? selectedVerses[selectedVerses.length - 1].ayah : range.startAyah }}
          initialTitle={isReplay
            ? (snap.sessions.find(s => s.id === snap.meta.replaySessionId)?.title || '')
            : ''}
          onCommit={commitSession}
        />
      )}

      {tafsirOpen && (
        <TafsirSheet
          surah={tafsirState.surah}
          ayah={tafsirState.ayah}
          surahName={tafsirState.surahName}
          text={tafsirState.text}
          loading={tafsirState.loading}
          onClose={closeTafsir}
        />
      )}
      {helpKey && (
        <HelpSheet helpKey={helpKey} onClose={closeHelp} />
      )}
      {toast && (
        <Toast
          key={toast.key}
          message={toast.message}
          onDone={() => setToast(null)}
        />
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   Bootstrap — wait for Yjs, mount, remove boot screen
   ═══════════════════════════════════════════════════ */
async function boot() {
  if (!window.Y || !window.IndexeddbPersistence) {
    document.getElementById('orbit-mount').innerHTML =
      '<div class="boot"><div class="b-mark">Mirān</div><div class="b-sub" style="color:#d77f5e">Storage unavailable</div></div>';
    return;
  }
  const db = new MiranDB();
  await db.ready;
  const root = ReactDOM.createRoot(document.getElementById('orbit-mount'));
  root.render(<MiranRoot db={db} />);
}

if (window.__YJS_READY__) {
  boot();
} else {
  window.addEventListener('yjs-ready', boot, { once: true });
}
</script>

</body>
</html>
